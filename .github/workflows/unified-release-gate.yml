name: OSGARD unified release evidence gate
on:
  pull_request:
    paths:
      - 'scripts/unified-release-gate.py'
      - 'tests/test_unified_release_gate.py'
      - 'docs/UNIFIED-RELEASE-GATE.md'
      - '.github/workflows/unified-release-gate.yml'
permissions:
  contents: read
jobs:
  gate-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/unified-release-gate.py tests/test_unified_release_gate.py
      - run: python -m unittest discover -s tests -p test_unified_release_gate.py -v
