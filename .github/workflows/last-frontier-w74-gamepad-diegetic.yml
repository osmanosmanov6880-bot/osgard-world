name: LAST FRONTIER W74 original physical gamepad, diegetic machinery, real frame profiler (DRAFT)

on:
  pull_request:
    branches:
      - game/last-frontier-w73-world-reticle-and-checkpoint-20261028
    paths:
      - 'w63-a7-cascade/**'
      - 'docs/LAST_FRONTIER_W74_DIEGETIC_GAMEPAD.md'
      - '.github/workflows/last-frontier-w74-gamepad-diegetic.yml'

permissions:
  contents: read

concurrency:
  group: last-frontier-w74-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  protect-original-game:
    name: Pin accepted W73 exact SHA, original A7 rules, W72 physical machines, W73 save+ray
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Audit exact descendant, 10 allowed files and unchanged original game/raycast/checkpoint blobs
        shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p w74-evidence
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          base='b006e9acaadae69b02976b4905e3a7c8262f072a'
          head=os.environ['HEAD']
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          assert re.fullmatch('[a-f0-9]{40}',head)
          assert git('rev-parse','HEAD')==head
          assert git('merge-base',base,head)==base
          changed=set(git('diff','--name-only','--no-renames',base,head).splitlines())
          allowed={
              'w63-a7-cascade/scripts/A7DiegeticFeedback.gd',
              'w63-a7-cascade/scripts/A7GamepadDirector.gd',
              'w63-a7-cascade/scripts/A7FrameTelemetry.gd',
              'w63-a7-cascade/scripts/A7FirstPersonOperator.gd',
              'w63-a7-cascade/scripts/A7CinematicStage.gd',
              'w63-a7-cascade/scripts/A7CascadeScreen.gd',
              'w63-a7-cascade/tests/test_w74_gamepad_feedback.gd',
              'w63-a7-cascade/ci/w74_browser_feedback.py',
              'docs/LAST_FRONTIER_W74_DIEGETIC_GAMEPAD.md',
              '.github/workflows/last-frontier-w74-gamepad-diegetic.yml',
          }
          assert changed==allowed,{'missing':sorted(allowed-changed),
                                   'unapproved':sorted(changed-allowed)}
          protected=[
              'w63-a7-cascade/scripts/A7CascadeCore.gd',
              'w63-a7-cascade/scripts/A7IncidentDirector.gd',
              'w63-a7-cascade/scripts/A7ProceduralAudio.gd',
              'w63-a7-cascade/scripts/A7CinematicHud.gd',
              'w63-a7-cascade/scripts/A7CinematicHeroSet.gd',
              'w63-a7-cascade/scripts/A7CinematicMaterialLab.gd',
              'w63-a7-cascade/scripts/A7ArchitecturalDetail.gd',
              'w63-a7-cascade/scripts/A7IndustrialCathedral.gd',
              'w63-a7-cascade/scripts/A7IncidentDirection.gd',
              'w63-a7-cascade/scripts/A7SpatialMission.gd',
              'w63-a7-cascade/scripts/A7FieldOperations.gd',
              'w63-a7-cascade/scripts/A7WorldInteraction.gd',
              'w63-a7-cascade/scripts/A7SessionCheckpoint.gd',
              'w63-a7-cascade/tests/test_a7_cascade.gd',
              'w63-a7-cascade/tests/test_w64_real_3d_stage.gd',
              'w63-a7-cascade/tests/test_w65_story_audio.gd',
              'w63-a7-cascade/tests/test_w67_cinematic_sectors.gd',
              'w63-a7-cascade/tests/test_w68_industrial_cinema.gd',
              'w63-a7-cascade/tests/test_w69_incident_direction.gd',
              'w63-a7-cascade/tests/test_w70_first_person_operator.gd',
              'w63-a7-cascade/tests/test_w71_spatial_mission.gd',
              'w63-a7-cascade/tests/test_w72_field_operations.gd',
              'w63-a7-cascade/tests/test_w73_world_and_checkpoint.gd',
              'w63-a7-cascade/ci/w64_browser_acceptance.py',
              'w63-a7-cascade/ci/w65_browser_story_audio.py',
              'w63-a7-cascade/ci/w67_browser_sectors.py',
              'w63-a7-cascade/ci/w68_browser_art.py',
              'w63-a7-cascade/ci/w69_browser_incident.py',
              'w63-a7-cascade/ci/w70_browser_operator.py',
              'w63-a7-cascade/ci/w71_browser_mission.py',
              'w63-a7-cascade/ci/w72_browser_field_ops.py',
              'w63-a7-cascade/ci/w73_browser_raycast.py',
              'w63-a7-cascade/Main.tscn',
              'w63-a7-cascade/project.godot',
              'w63-a7-cascade/export_presets.cfg',
              '.github/workflows/last-frontier-w73-world-and-checkpoint.yml',
          ]
          blobs={}
          for p in protected:
              original=git('rev-parse',base+':'+p)
              current=git('rev-parse',head+':'+p)
              assert original==current,'Protected original game blob modified: '+p
              blobs[p]=current
          subprocess.run(['git','diff','--check',base,head],check=True)
          feedback=Path('w63-a7-cascade/scripts/A7DiegeticFeedback.gd').read_text()
          pad=Path('w63-a7-cascade/scripts/A7GamepadDirector.gd').read_text()
          telemetry=Path('w63-a7-cascade/scripts/A7FrameTelemetry.gd').read_text()
          controller=Path('w63-a7-cascade/scripts/A7FirstPersonOperator.gd').read_text()
          for marker in ['TorusMesh.new()','MeshInstance3D.new()',
                         'notify_real_world_operation','reduced_motion']:
              assert marker in feedback
          for marker in ['JOY_BUTTON_A','JOY_BUTTON_START','JOY_BUTTON_DPAD_LEFT',
                         'JOY_BUTTON_RIGHT_SHOULDER','route_motion']:
              assert marker in pad
          for marker in ['sample_frame','window_p95_frame_ms',
                         'consumer_pc_gpu_benchmarked']:
              assert marker in telemetry
          assert 'set_controller_axis' in controller
          assert 'move_and_slide' in controller
          for p in [feedback,pad,telemetry]:
              for token in ['HTTPClient','OS.execute','await JavaScriptBridge']:
                  assert token not in p
          result={
              'schema':'LAST_FRONTIER_W74_EXACT_ACCEPTED_W73_SOURCE_V1',
              'base_sha':base,'head_sha':head,'status':'PASS',
              'changed_paths':sorted(changed),'protected_hashes':blobs,
              'original_A7_core_modified':False,
              'original_W73_ray_and_checkpoint_modified':False,
              'physical_gamepad_hardware_verified':False,
              'consumer_GPU_60fps_certified':False,
              'human_12_person_playtest_conducted':False,
              'commercial_release_authorized':False,
          }
          Path('w74-evidence/W74_SOURCE_AUDIT.json').write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print('W74 actual source exact Git SHA and protected W73 game PASS')
          PY
      - name: Archive independent exact source proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-frontier-w74-exact-source-${{ github.event.pull_request.head.sha }}
          path: w74-evidence/W74_SOURCE_AUDIT.json
          if-no-files-found: warn
          retention-days: 45

  full-native-cinematic-qa-and-webgl:
    name: Eleven real Godot suites + actual analog CharacterBody and original 3D feedback, W73/W74 Chromium and 14 frames
    runs-on: ubuntu-latest
    timeout-minutes: 115
    needs: protect-original-game
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          include-templates: true
          use-dotnet: false
      - name: Strict original Godot game import, reject all native GDScript errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p w74-evidence
          timeout --signal=TERM --kill-after=5s 290s godot --headless --editor --path w63-a7-cascade --import --quit 2>&1 | tee w74-evidence/import.log
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script' w74-evidence/import.log; then exit 1; fi
      - name: Actual eleven native Godot game suites including W74 joypad InputEvent physics, six-cycle original game, world save/replay and F3 telemetry
        shell: bash
        run: |
          set -euo pipefail
          for test in test_a7_cascade test_w64_real_3d_stage test_w65_story_audio test_w67_cinematic_sectors test_w68_industrial_cinema test_w69_incident_direction test_w70_first_person_operator test_w71_spatial_mission test_w72_field_operations test_w73_world_and_checkpoint test_w74_gamepad_feedback; do
            echo "W74 TRUE GODOT ORIGINAL NATIVE: $test"
            timeout --signal=TERM --kill-after=5s 490s godot --headless --path w63-a7-cascade --script "res://tests/$test.gd" 2>&1 | tee "w74-evidence/$test.log"
            if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "w74-evidence/$test.log"; then exit 1; fi
          done
          grep -q 'LAST FRONTIER W63 A7 CASCADE REAL GODOT PLAYABLE VERTICAL SLICE PASS: 105 checks' w74-evidence/test_a7_cascade.log
          grep -q 'LAST FRONTIER W64 REAL NATIVE 3D CINEMATIC GAME PASS:' w74-evidence/test_w64_real_3d_stage.log
          grep -q 'LAST FRONTIER W65 ORIGINAL GAME CAUSAL STORY + SYNTH AUDIO PASS:' w74-evidence/test_w65_story_audio.log
          grep -q 'LAST FRONTIER W67 REAL TWO-ZONE INDUSTRIAL CINEMA PASS:' w74-evidence/test_w67_cinematic_sectors.log
          grep -q 'LAST FRONTIER W68 REAL ORIGINAL PBR HERO AND COMPLETE GODOT GAME PASS:' w74-evidence/test_w68_industrial_cinema.log
          grep -q 'LAST FRONTIER W69 TRUE CINEMATIC INCIDENT/OPTICS/WIN PASS:' w74-evidence/test_w69_incident_direction.log
          grep -q 'LAST FRONTIER W70 REAL CHARACTERBODY FIRST PERSON PHYSICS PASS:' w74-evidence/test_w70_first_person_operator.log
          grep -q 'LAST FRONTIER W71 TRUE SPATIAL FIVE-OBJECTIVE GODOT GAME PASS:' w74-evidence/test_w71_spatial_mission.log
          grep -q 'LAST FRONTIER W72 TRUE THREE PHYSICAL INDUSTRIAL PUZZLES PASS:' w74-evidence/test_w72_field_operations.log
          grep -q 'LAST FRONTIER W73 TRUE WORLD RAYCAST AND TRANSACTIONAL CHECKPOINT PASS:' w74-evidence/test_w73_world_and_checkpoint.log
          grep -q 'LAST FRONTIER W74 TRUE DIEGETIC PHYSICS GAMEPAD AND FRAME TELEMETRY PASS:' w74-evidence/test_w74_gamepad_feedback.log
      - name: Export actual original Godot WebAssembly / PBR game binary
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          (
            cd w63-a7-cascade
            mkdir -p build/web
            godot --headless --path . --export-release Web build/web/index.html
          ) 2>&1 | tee w74-evidence/export.log
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' w74-evidence/export.log; then exit 1; fi
          python3 w33-godot-native/ci/verify_web_export.py w63-a7-cascade/build/web --sha "$SHA" --output w63-a7-cascade/build/web/evidence.json
      - name: Actual Chromium / WebGL user-input visual QA prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/a7-w74
          /tmp/a7-w74/bin/pip install --disable-pip-version-check playwright==1.56.0 Pillow==11.3.0
          /tmp/a7-w74/bin/python -m playwright install --with-deps chromium
      - name: True W73 raycast and W74 3D servo and F3 frame-time browser playthroughs
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 1190s /tmp/a7-w74/bin/python w63-a7-cascade/ci/w73_browser_raycast.py --export w63-a7-cascade/build/web --evidence w74-evidence/w73-original-regression --sha "$SHA" 2>&1 | tee w74-evidence/w73-browser.log
          grep -q 'LAST FRONTIER W73 TRUE GODOT RAYCAST PHYSICAL WORLD CHROMIUM PASS:' w74-evidence/w73-browser.log
          timeout --signal=TERM --kill-after=10s 1190s /tmp/a7-w74/bin/python w63-a7-cascade/ci/w74_browser_feedback.py --export w63-a7-cascade/build/web --evidence w74-evidence/w74-live-3d-feedback --sha "$SHA" 2>&1 | tee w74-evidence/w74-browser.log
          grep -q 'LAST FRONTIER W74 TRUE NATIVE 3D FEEDBACK AND FRAME TELEMETRY CHROMIUM PASS:' w74-evidence/w74-browser.log
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          proofdir=Path('w74-evidence/w74-live-3d-feedback')
          obj=json.loads((proofdir/'W74_REAL_CHROMIUM_ORIGINAL_FOOTAGE.json').read_text())
          assert obj['result']=='PASS' and obj['source_sha']==os.environ['SHA']
          assert obj['real_original_Godot_WebGL']
          assert obj['true_animated_3d_hardware_feedback']
          assert not obj['physical_Xbox_PS_gamepad_tested']
          assert not obj['physical_consumer_GPU_FPS_certified']
          assert not obj['AAA_professional_art_signoff']
          assert len(obj['screenshots'])==7
          for f in obj['screenshots']:
              b=(proofdir/f['name']).read_bytes()
              assert len(b)>12000 and hashlib.sha256(b).hexdigest()==f['sha256']
          print('W74 actual Godot game, original 3D feedback, frame delta and 14 real screenshots PASS')
          PY
      - name: Upload actual playable Godot WASM, machine footage and live original native proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-frontier-w74-actual-3d-servo-gamepad-and-webgl-${{ github.event.pull_request.head.sha }}
          path: |
            w63-a7-cascade/build/web/
            w74-evidence/
          if-no-files-found: warn
          retention-days: 45

  production-gate:
    name: Actual original game code accepted != physical GPU/controller/human AAA release
    runs-on: ubuntu-latest
    needs: [protect-original-game, full-native-cinematic-qa-and-webgl]
    if: always()
    steps:
      - name: Enforce all true source-native-browser checks before software PASS
        shell: bash
        env:
          SOURCE: ${{ needs.protect-original-game.result }}
          GAME: ${{ needs.full-native-cinematic-qa-and-webgl.result }}
        run: |
          set -euo pipefail
          test "$SOURCE" = success
          test "$GAME" = success
          echo 'W74 exact source + genuine Godot gamepad InputEvents + true PBR machine feedback and Chromium QA SOFTWARE PASS'
          echo 'PRODUCTION HOLD: no physical Xbox/PS gamepad, consumer GPU benchmark, finished AAA art, independently measured human session or commercial signoff'
