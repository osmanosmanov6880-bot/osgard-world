name: OSGARD Integrated Quality Suite
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  complete-safety-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: |
          python -m compileall -q scripts/ tests/test_pilot_scorecard.py tests/test_core_backup_recovery.py tests/test_release_zip_gate.py tests/test_unified_release_gate.py tests/test_github_release_evidence.py tests/test_release_artifact_manifest.py tests/test_zip_manifest_binding.py tests/test_release_bundle.py tests/test_game_archive.py tests/test_staging_operations.py
      - name: All release safety test families (combined)
        run: |
          python -m unittest discover -s tests -p test_pilot_scorecard.py -v
          python -m unittest discover -s tests -p test_core_backup_recovery.py -v
          python -m unittest discover -s tests -p test_core_recovery_http.py -v
          python -m unittest discover -s tests -p test_core_restored_operations.py -v
          python -m unittest discover -s tests -p test_release_zip_gate.py -v
          python -m unittest discover -s tests -p test_unified_release_gate.py -v
          python -m unittest discover -s tests -p test_github_release_evidence.py -v
          python -m unittest discover -s tests -p test_release_artifact_manifest.py -v
          python -m unittest discover -s tests -p test_zip_manifest_binding.py -v
          python -m unittest discover -s tests -p test_release_bundle.py -v
          python -m unittest discover -s tests -p test_game_archive.py -v
          python -m unittest discover -s tests -p test_staging_operations.py -v
          python -m unittest discover -s tests -p test_backup_shell_contract.py -v
          python -m unittest discover -s tests -p test_staging_release_acceptance.py -v
          python -m unittest discover -s tests -p test_release_pr_dependency_audit.py -v
          python -m unittest discover -s tests -p test_live_release_pr_audit.py -v
          python -m unittest discover -s tests -p test_full_source_ci_contract.py -v
          python -m unittest discover -s tests -p test_godot_export_binding.py -v
          python -m unittest discover -s tests -p test_remix_service.py -v
          python -m unittest discover -s tests -p test_remix_acceptance_wrapper.py -v
      - name: Live PR chain metadata verification (read-only)
        if: ${{ github.event_name == 'pull_request' }}
        run: python scripts/live-release-pr-audit.py
      - name: Guard against accidental activation
        run: |
          python - <<'PY'
          from pathlib import Path
          code=Path('scripts/unified-release-gate.py').read_text()
          assert 'publication_performed' in code
          assert 'payment_mode' in code
          assert 'ready_for_human_review' in code
          print('Validated: evidence gate remains manual and non-deploying')
          PY
