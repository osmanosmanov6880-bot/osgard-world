name: OSGARD production health watch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["OSGARD frontend deploy"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: osgard-production-health-watch
  cancel-in-progress: true

jobs:
  production-health:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Verify live production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out health-check script
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check production health monitor
        run: node --check scripts/production-health-watch.mjs

      - name: Probe public site, live bundle, and API gateways
        env:
          OSGARD_BASE_URL: https://osgard.world
        run: node scripts/production-health-watch.mjs
