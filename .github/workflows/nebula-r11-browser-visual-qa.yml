name: NEBULA R11 Chromium WebGL visual QA
on:
  workflow_run:
    workflows:
      - "REMIX NEBULA 3D native Web release"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot-and-software-gl:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Manual QA must test the branch selected in the Actions UI, not master.
      # Automated downstream QA still tests the merged master release.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'master' }}
      - name: Record exact tested source revision
        run: |
          echo "NEBULA_R11_TESTED_REF=$(git rev-parse --abbrev-ref HEAD)"
          echo "NEBULA_R11_TESTED_COMMIT=$(git rev-parse HEAD)"
      - name: Install headless Chromium and Playwright
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Confirm exported game files exist
        run: |
          set -euo pipefail
          game=public/games/remix/arena-v2/nebula-3d
          test -s "$game/index.html"
          test -s "$game/index.js"
          test -s "$game/index.pck"
          test -s "$game/index.wasm"
      - name: Capture GL render at 720p/1080p and exercise quality controls
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public > /tmp/nebula-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          node godot/nebula-3d/tests/browser_smoke_r11.mjs
      - name: Summarize actual visual capture state (never fabricate pass)
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'r11-browser-qa';
          const reportFile = path.join(root, 'report.json');
          const files = fs.existsSync(root) ? fs.readdirSync(root) : [];
          const report = fs.existsSync(reportFile) ?
            JSON.parse(fs.readFileSync(reportFile, 'utf8')) : null;
          const photoFiles = files.filter(name => /^r11-.*\.jpg$/.test(name));
          const bootFiles = files.filter(name => /^r11-.*-boot\.json$/.test(name));
          const failures = files.filter(name => /^r11-.*-capture-failure\.json$/.test(name));
          const evidence = photoFiles.length > 0 && report?.scenes?.some(
            scene => scene.screenshot_status?.maximum !== 'inconclusive');
          const summary = [
            '### NEBULA R11 — hosted software renderer evidence',
            '',
            '- Real rendered JPEG(s): ' + photoFiles.length,
            '- Pre-capture browser/GL telemetry JSON(s): ' + bootFiles.length,
            '- Explicit capture failure JSON(s): ' + failures.length,
            '- Confirmed visual screenshot: ' + (evidence ? 'YES' : 'NO'),
            '- Hardware GPU/phone QA: **NOT PERFORMED**',
            '- Raw files: see uploaded `nebula-r11-chromium-swiftshader-visual-qa` artifact',
            '',
            'A browser test with gameplay telemetry alone is **not** proof of pixels.'
          ].join('\n') + '\n';
          if (process.env.GITHUB_STEP_SUMMARY)
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log('NEBULA_R11_VISUAL_EVIDENCE: ' + JSON.stringify({
            real_jpeg_count: photoFiles.length, boot_count: bootFiles.length,
            failed_capture_count: failures.length, real_frame_confirmed: !!evidence
          }));
          NODE
      - name: Publish screenshots and hosted-renderer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-r11-chromium-swiftshader-visual-qa
          path: r11-browser-qa/
          if-no-files-found: warn
          retention-days: 14
