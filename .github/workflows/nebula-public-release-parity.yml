name: NEBULA public release exact-byte parity

on:
  workflow_run:
    workflows: ["Publish REMIX ARENA standalone"]
    types: [completed]
  # Self-check the verifier whenever its own logic changes. This is NOT
  # triggered by allowlist changes: those must still go through SSH activation.
  push:
    branches: [master]
    paths:
      - ".github/workflows/nebula-public-release-parity.yml"
      - "scripts/nebula-public-release-parity.mjs"
      - "scripts/test-nebula-public-release-parity.mjs"
  pull_request:
    paths:
      - ".github/workflows/nebula-public-release-parity.yml"
      - "scripts/nebula-public-release-parity.mjs"
      - "scripts/test-nebula-public-release-parity.mjs"
  # Successful deployment also triggers this automatically; dispatch remains
  # available for manual verification without touching production bytes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-parity:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Regression-test the strict verifier and negative cases
        run: node scripts/test-nebula-public-release-parity.mjs
      - name: Download the four real public HTTPS assets
        env:
          GAME_URL: https://osgard.world/games/remix/arena-v2/nebula-3d
        run: |
          set -euo pipefail
          mkdir -p /tmp/nebula-public-verified
          for name in index.html index.js index.wasm index.pck; do
            curl --fail-with-body --silent --show-error --location --retry 3 \
              --max-time 120 --header 'Cache-Control: no-cache' \
              --header 'Accept-Encoding: identity' \
              "$GAME_URL/$name" -o "/tmp/nebula-public-verified/$name"
            test -s "/tmp/nebula-public-verified/$name"
          done
      - name: Verify the public bytes using the SAME strict production policy
        run: node scripts/nebula-public-release-parity.mjs /tmp/nebula-public-verified
