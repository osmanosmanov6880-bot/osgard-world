name: NEBULA public release exact-byte parity

on:
  workflow_run:
    workflows: ["Publish REMIX ARENA standalone"]
    types: [completed]
  # PR tests compare to the last approved production; only a successful
  # deploy workflow_run can claim new public bytes. Do not race deployment
  # by running a candidate parity check immediately on master push.
  pull_request:
    paths:
      - ".github/workflows/nebula-public-release-parity.yml"
      - "scripts/nebula-public-release-parity.mjs"
      - "scripts/test-nebula-public-release-parity.mjs"
  # Successful deployment also triggers this automatically; dispatch remains
  # available for manual verification without touching production bytes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-parity:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Regression-test the strict verifier and negative cases
        run: node scripts/test-nebula-public-release-parity.mjs
      - name: Download the four real public HTTPS assets
        env:
          GAME_URL: https://osgard.world/games/remix/arena-v2/nebula-3d
        run: |
          set -euo pipefail
          mkdir -p /tmp/nebula-public-verified
          for name in index.html index.js index.wasm index.pck; do
            curl --fail-with-body --silent --show-error --location --retry 3 \
              --max-time 120 --header 'Cache-Control: no-cache' \
              --header 'Accept-Encoding: identity' \
              "$GAME_URL/$name" -o "/tmp/nebula-public-verified/$name"
            test -s "/tmp/nebula-public-verified/$name"
          done
      # The PR contains a *candidate* allowlist. It must prove the public
      # R49/R50 files still match the currently approved master release until
      # the candidate is actually deployed. Never treat a pending PR as live.
      - name: Resolve current approved policy from master for PR-only parity
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/master
          git show FETCH_HEAD:.github/nebula-production-allowlist.json > /tmp/nebula-approved-live-policy.json
          node -e "const p=require('/tmp/nebula-approved-live-policy.json'); console.log('CHECK_AGAINST_APPROVED_LIVE',p.approved_variant)"
      - name: Verify public HTTPS against current approved release or deployed master
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/nebula-public-release-parity.mjs /tmp/nebula-public-verified /tmp/nebula-approved-live-policy.json
          else
            node scripts/nebula-public-release-parity.mjs /tmp/nebula-public-verified
          fi
