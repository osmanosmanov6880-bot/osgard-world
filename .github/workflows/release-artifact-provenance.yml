name: OSGARD release artifact provenance
on:
  pull_request:
    paths:
      - 'scripts/release-artifact-manifest.py'
      - 'tests/test_release_artifact_manifest.py'
      - 'docs/RELEASE-ARTIFACT-PROVENANCE.md'
      - '.github/workflows/release-artifact-provenance.yml'
permissions:
  contents: read
jobs:
  provenance-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/release-artifact-manifest.py tests/test_release_artifact_manifest.py
      - run: python -m unittest discover -s tests -p test_release_artifact_manifest.py -v
