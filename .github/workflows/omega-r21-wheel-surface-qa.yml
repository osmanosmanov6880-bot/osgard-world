name: OSGARD HORIZON R21 four real wheel contacts native QA
on:
  pull_request:
    branches: [master, feat/horizon-r20-chase-camera-composition]
    paths:
      - 'godot/empire-omega/**'
      - '.github/workflows/omega-r21-wheel-surface-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheel-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Prepare original Godot game
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          godot --headless --editor --path godot/empire-omega --import --quit
      - name: Real physical world contacts and legacy driving regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in v21_vehicle_dynamics v26_horizon_sculpted_visuals v34_real_touch_drive v40_yaw_inertia v43_camera_composition v44_four_wheel_surface; do
            echo "=== NATIVE $test ==="
            timeout --signal=TERM --kill-after=5s 90s godot --headless --path godot/empire-omega --script "res://tests/$test.gd"
          done
