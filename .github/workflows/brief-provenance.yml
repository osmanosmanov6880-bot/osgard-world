name: Original brief provenance gate
on:
  pull_request:
    paths:
      - scripts/brief-coverage-audit.mjs
      - scripts/brief-coverage-audit.test.mjs
      - .github/workflows/brief-provenance.yml
  push:
    branches: [master]
    paths:
      - scripts/brief-coverage-audit.mjs
      - scripts/brief-coverage-audit.test.mjs
      - .github/workflows/brief-provenance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test brief parser and strict source fingerprint
        run: node scripts/brief-coverage-audit.test.mjs
