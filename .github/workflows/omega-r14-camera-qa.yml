name: OSGARD EMPIRE Omega R14 collision-safe camera native QA
on:
  pull_request:
    branches: [master]
    paths:
      - 'godot/empire-omega/**'
      - '.github/workflows/omega-r14-camera-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Regenerate source-owned game sounds and import real Godot engine
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          godot --headless --editor --path godot/empire-omega --import --quit
      - name: Run original car, tire, mobile input and collision-camera native tests
        shell: bash
        run: |
          set -euo pipefail
          for test in v21_vehicle_dynamics v25_horizon_racing v27_driver_assists v28_touch_controls v29_responsive_layout v34_real_touch_drive v35_portrait_viewport v36_mobile_car_entry v37_safe_chase_camera; do
            echo "=== REAL GODOT: $test ==="
            timeout --signal=TERM --kill-after=5s 60s godot --headless --path godot/empire-omega --script "res://tests/$test.gd"
          done
