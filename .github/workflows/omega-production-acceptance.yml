name: OSGARD Omega live acceptance

on:
  workflow_run:
    workflows: ["OSGARD frontend deploy"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-live-acceptance
  cancel-in-progress: true

jobs:
  verify-production:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout production acceptance scripts
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked app dependencies
        run: npm ci
      - name: Install pinned Playwright
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Wait for deployed NASA imagery and CDN propagation
        shell: bash
        run: |
          python3 - <<'PY'
          import time, urllib.request
          url = "https://osgard.world/brand/earth/manifest.json"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=15) as res:
                      body = res.read()
                  if b'"not_live_data": true' in body and b'blue-marble-4096.webp' in body:
                      print("NASA texture manifest deployed")
                      break
              except Exception as error:
                  print(f"Waiting for deployment: {error}")
              time.sleep(5)
          else:
              raise SystemExit("Deployed Earth texture manifest not found")
          PY
      - name: Validate the live public website in desktop and mobile browsers
        env:
          OSGARD_PROD_BASE_URL: https://osgard.world
        run: npx playwright test --config playwright.omega-production.config.mjs
      - name: Upload screenshots, HTML results and failed traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-production-acceptance
          path: |
            omega-acceptance-results/
            omega-acceptance-report/
          if-no-files-found: warn
          retention-days: 14
