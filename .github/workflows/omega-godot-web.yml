name: OSGARD Empire Omega native Godot Web
on:
  push:
    branches: [master]
    paths:
      - 'godot/empire-omega/**'
      - '.github/workflows/omega-godot-web.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: omega-godot-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Regenerate original prototype audio
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          test -s godot/empire-omega/assets/audio/city_air.wav
          test -s godot/empire-omega/assets/audio/patrol_alert.wav
      - name: Import scripts, resources and native scenes
        run: godot --headless --editor --path godot/empire-omega --import --quit
      - name: Execute native Godot city-smoke and gameplay regression tests
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          for test_file in godot/empire-omega/tests/*.gd; do
            if [[ "$test_file" == *"/horizon_capture.gd" || "$test_file" == *"/horizon_driving_capture.gd" || "$test_file" == *"/horizon_r4_showroom_capture.gd" || "$test_file" == *"/r44_actual_night_capture.gd" ]]; then
              echo "Route GPU screenshot test to mandatory real XVFB/OpenGL capture, never headless"
              continue
            fi
            echo "=== NATIVE ${test_file##*/} ==="
            # Normal native suites remain bounded to 15s.
            # Real 60 Hz R46 A/B has 3*(140+108+72+48) physics frames:
            # 1104/60=18.4s minimum BEFORE Godot startup and CI overhead.
            # The previous 15s timeout killed a valid physics experiment.
            # R40 is the six-candidate spring calibration sweep (~40s).
            test_seconds=15
            case "${test_file##*/}" in
              v59_r40_force_motor_calibration.gd) test_seconds=110 ;;
              v67_r46_physics_ab_trials.gd) test_seconds=60 ;;
            esac
            echo "Native test budget: ${test_seconds}s for ${test_file##*/}"
            if timeout --signal=TERM --kill-after=5s "${test_seconds}s" godot --headless --path godot/empire-omega --script "res://tests/${test_file##*/}"; then
              echo "PASS: ${test_file##*/}"
            else
              echo "::error::Failed Godot test: ${test_file##*/}"
              failures=1
            fi
          done
          exit "$failures"
      - name: Install real OpenGL framebuffer for mandatory night-city acceptance
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Run genuine 1366x768 day and night Godot framebuffer acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          timeout --signal=TERM --kill-after=8s 145s \
            xvfb-run -a -s '-screen 0 1920x1080x24' \
            godot --path godot/empire-omega --rendering-method gl_compatibility \
              --script res://tests/r44_actual_night_capture.gd
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack
          for name in ("omega_r44_real_day_1366x768.png","omega_r44_real_night_1366x768.png"):
              p=Path('screenshots')/name
              assert p.is_file() and p.stat().st_size>10000, f'missing original GL screenshot: {name}'
              with p.open('rb') as f:
                  header=f.read(24)
              assert header[:8]==bytes.fromhex('89504e470d0a1a0a')
              assert unpack('>II',header[16:24])==(1366,768),f'wrong real GL resolution: {name}'
              print('PASS original Godot OpenGL framebuffer:',name,p.stat().st_size,'bytes')
          PY
      - name: Preserve actual Godot day and night PNG evidence for external review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-master-actual-night-opengl-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Export authentic Godot 4.4.1 Web application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/empire-omega/.build-web
          godot --headless --path godot/empire-omega --export-release Web "$GITHUB_WORKSPACE/godot/empire-omega/.build-web/index.html"
          node scripts/localize-godot-web-export.mjs godot/empire-omega/.build-web
          test -s godot/empire-omega/.build-web/index.html
          test -n "$(find godot/empire-omega/.build-web -maxdepth 1 -name '*.wasm' -size +100k -print -quit)"
          test -n "$(find godot/empire-omega/.build-web -maxdepth 1 -name '*.pck' -size +100k -print -quit)"
      - name: Verify origin of the exported runtime and stage it without overwriting other games
        shell: bash
        run: |
          set -euo pipefail
          target=public/games/omega-3d-preview
          rm -rf "$target"
          mkdir -p "$target"
          cp -a godot/empire-omega/.build-web/. "$target/"
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json
          p=Path('public/games/omega-3d-preview')
          files=sorted(x for x in p.iterdir() if x.is_file())
          required={'.html','.js','.wasm','.pck'}
          assert required <= {x.suffix for x in files},'Godot export incomplete'
          d={'engine':'Godot 4.4.1','source_path':'godot/empire-omega',
             'source_commit':'${{ github.sha }}','native_tests':'passed',
             'artifact_kind':'native-Godot-HTML5-export',
             'files':{x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in files}}
          (p/'release.json').write_text(json.dumps(d,indent=2)+'\n')
          print('Godot Web export verified:',len(files),'files')
          PYCODE
      - name: Commit verified native runtime and request existing SSH deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The portal changes constantly. Rebase would conflict with the
          # generated release.json even though only the game is being updated.
          # Rebuild the commit from the freshest master tree, staging ONLY
          # the newly exported native game assets.
          python3 scripts/omega-build-freshness.py --self-test
          published=0
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            # A newer source revision must own its WebAssembly release.
            # Website-only changes do not invalidate this build, but any
            # source change inside godot/empire-omega does.
            if ! python3 scripts/omega-build-freshness.py "${{ github.sha }}" origin/master; then
              # An obsolete build is correctly blocked, but it is NOT a
              # successful export and must never trigger deployment listeners.
              echo "::error::SUPERSEDED native export: a newer Omega source exists; zero binaries published."
              exit 3
            fi
            git reset --mixed origin/master
            git add -f public/games/omega-3d-preview
            if git diff --cached --quiet; then
              echo 'Native game is already up to date'
              published=1
              break
            fi
            git commit -m 'build(games): publish tested Godot 4.4.1 Omega Web runtime'
            if git push origin HEAD:master; then
              published=1
              break
            fi
            echo "Master changed during publication; retrying attempt $attempt"
          done
          test "$published" -eq 1
          gh workflow run deploy-frontend.yml --ref master
