name: OSGARD R135 exact asset reconstruction and native publish

on:
  push:
    branches: [integration/r135-assets-audit-20261024]
    paths:
      - '.github/workflows/r135-rebuild-publish.yml'
      - 'godot/osgard-r135-standalone/requirements-r135.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r135-recovered-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original human-readable R135 source from verified payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import io, base64, hashlib, tarfile
          project=Path('godot/osgard-r135-standalone').resolve()
          fragments=sorted((project/'bootstrap').glob('part-*.b64'))
          assert len(fragments)==4, ('Expected 4 source fragments', len(fragments))
          raw=base64.b64decode(''.join(p.read_text().strip() for p in fragments),validate=True)
          expected='141f5c573b85b87f4974c4670d632441a93f5313a0403f796f8e6bf1f85c411d'
          assert hashlib.sha256(raw).hexdigest()==expected, 'R135 source archive hash mismatch'
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as archive:
              for item in archive.getmembers():
                  assert item.isfile(), 'Unexpected bundle entry'
                  target=(project/item.name).resolve()
                  assert target.is_relative_to(project), 'Invalid bundle path'
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(archive.extractfile(item).read())
                  print('Restored',item.name)
          PYCODE
          test -s godot/osgard-r135-standalone/R135ServiceDirector.gd
          test -s godot/osgard-r135-standalone/tools/build_r135_service_spine.py

      - name: Install deterministic asset dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: godot/osgard-r135-standalone/requirements-r135.txt

      - name: Reproduce HERO/ECO GLBs and all PBR images
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r godot/osgard-r135-standalone/requirements-r135.txt
          python godot/osgard-r135-standalone/tools/build_r135_service_spine.py --level both
          python -m pytest -q godot/osgard-r135-standalone/tests/test_asset_integrity.py
          find godot/osgard-r135-standalone/models/r135 -maxdepth 1 -type f -printf '%f: %k KB\n'

      - name: Install verified Godot engine and web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Import Godot assets and run native scene smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path godot/osgard-r135-standalone --import --quit
          timeout --signal=TERM --kill-after=10s 150s godot --headless --path godot/osgard-r135-standalone --script res://tests/smoke.gd

      - name: Export genuine Web runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/r135-web"
          godot --headless --path godot/osgard-r135-standalone --export-release Web "${RUNNER_TEMP}/r135-web/index.html"
          node scripts/localize-godot-web-export.mjs "${RUNNER_TEMP}/r135-web"
          test -s "${RUNNER_TEMP}/r135-web/index.html"
          test -n "$(find "${RUNNER_TEMP}/r135-web" -maxdepth 1 -name '*.wasm' -size +100k -print -quit)"
          test -n "$(find "${RUNNER_TEMP}/r135-web" -maxdepth 1 -name '*.pck' -size +0c -print -quit)"
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json,os
          folder=Path(os.environ['RUNNER_TEMP'])/'r135-web'
          files=sorted(p for p in folder.iterdir() if p.is_file())
          metadata={'engine':'Godot 4.4.1','game':'OSGARD R135 Service Spine',
            'simulation_only':True,'native_smoke':'passed','performance':'not GPU benchmarked',
            'original_eco_glb_sha256':'c6bbc41c53e596d5048371e639a662cd2a75d58a02f75c9df93ffced7685533b',
            'original_hero_glb_sha256':'8ef33e28534c7c41d4adaceee4e479e38da92287a99bbd5fd53b9fc9318c0078',
            'source_revision':os.environ['GITHUB_SHA'],
            'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}
          (folder/'release.json').write_text(json.dumps(metadata,indent=2)+'\n')
          print('Web PCK size',[(p.name,p.stat().st_size) for p in files if p.suffix=='.pck'])
          PYCODE

      - name: Upload complete Web runtime as a retained build artifact
        uses: actions/upload-artifact@v4
        with:
          name: osgard-r135-web-native-verified
          path: ${{ runner.temp }}/r135-web/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified original assets and recovered scene into integration branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          project='godot/osgard-r135-standalone'
          target='public/games/r135-service'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          web_size=$(du -sb "${RUNNER_TEMP}/r135-web" | cut -f1)
          publish_web=0
          if [ "$web_size" -lt 90000000 ]; then
            rm -rf "$target"
            mkdir -p "$target"
            cp -a "${RUNNER_TEMP}/r135-web/." "$target/"
            publish_web=1
          else
            echo "::warning::Web export is too large for a safe Git commit; preserved as an Actions artifact."
          fi
          published=0
          for attempt in 1 2 3; do
            git fetch origin integration/r135-assets-audit-20261024
            git reset --mixed origin/integration/r135-assets-audit-20261024
            git add -f "$project/R135ServiceDirector.gd" "$project/StandaloneMain.gd" "$project/shaders/r135_cinematic_grade.gdshader"
            git add -f "$project/tools/build_r135_service_spine.py" "$project/models/r135" "$project/textures/r135"
            if [ "$publish_web" -eq 1 ]; then git add -f "$target"; fi
            if git diff --cached --quiet; then published=1; break; fi
            git commit -m 'build(r135): publish SHA-verified original HERO/ECO GLBs, PBR maps and tested Web runtime'
            if git push origin HEAD:integration/r135-assets-audit-20261024; then published=1; break; fi
          done
          test "$published" -eq 1
