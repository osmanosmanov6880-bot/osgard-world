name: CITY REIGN R161 - native road life QA (no SSH publication)

on:
  push:
    branches:
      - feat/city-reign-r161-road-life-20261028
    paths:
      - 'godot/empire-omega/**'
      - '.github/workflows/city-reign-r161-road-life-qa.yml'
  pull_request:
    branches:
      - feat/city-reign-osgard-ssh-playable-20261028

permissions:
  contents: read

jobs:
  godot-native:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Build local audio and strict original Godot import
        shell: bash
        run: |
          set -euo pipefail
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          bash scripts/omega-strict-godot-import.sh godot/empire-omega 2>&1 | tee r161-import.log
          grep -Fq 'R42 PASS: real Godot imported with no script errors' r161-import.log
      - name: Native game regressions (no mocked canvas, no deployment)
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            v134_city_reign_road_guidance \
            v135_city_reign_turn_signals \
            v133_city_reign_camera_modes \
            v129_city_reign_paid_crossing_traffic \
            v68_r47_predictive_crosswalk_traffic; do
            echo "Testing $suite"
            log="$suite.log"
            timeout --signal=TERM --kill-after=5s 120s godot --headless \
              --path godot/empire-omega --script "res://tests/$suite.gd" 2>&1 | tee "$log"
            if grep -nE 'SCRIPT ERROR:|Parse Error:|[1-9][0-9]* FAIL|ERROR:.*FAIL' "$log"; then
              exit 1
            fi
            grep -Fq '0 FAIL' "$log"
          done
      - name: Upload native evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-reign-r161-original-native-evidence
          path: |
            r161-import.log
            v134*.log
            v135*.log
            v133*.log
            v129*.log
            v68*.log
          if-no-files-found: warn
