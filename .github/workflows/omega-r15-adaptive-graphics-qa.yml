name: OSGARD Horizon R15 adaptive graphics native QA
on:
  pull_request:
    branches: [master]
    paths:
      - 'godot/empire-omega/**'
      - '.github/workflows/omega-r15-adaptive-graphics-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-native:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Generate original game audio
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
      - name: Import actual Godot project
        run: godot --headless --editor --path godot/empire-omega --import --quit
      - name: Run integrated native regression (physics, touch, quality, weather)
        shell: bash
        run: |
          set -euo pipefail
          for test in v21_vehicle_dynamics v25_horizon_racing v27_driver_assists v28_touch_controls v34_real_touch_drive v37_touch_commands v38_adaptive_graphics; do
            timeout --signal=TERM --kill-after=5s 90s godot --headless --path godot/empire-omega --script "res://tests/$test.gd"
          done
