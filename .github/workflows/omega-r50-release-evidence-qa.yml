name: EMPIRE Omega R50 exact real-game release evidence and hardware HOLD gate
on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/omega-r50-release-gate.py'
      - 'scripts/omega-live-integrity.py'
      - 'scripts/omega-live-webgl.spec.mjs'
      - 'scripts/omega-world-frame-evidence.mjs'
      - 'scripts/omega-world-frame-evidence.test.mjs'
      - 'scripts/omega-browser-evidence.mjs'
      - '.github/workflows/omega-r50-release-evidence-qa.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['OSGARD Omega verified Godot direct SSH deploy']
    types: [completed]
    branches: [master]
permissions:
  contents: read
concurrency:
  group: omega-r50-evidence-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  evidence-contract:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Check original native release source, binary hashes, false success guard
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/omega-live-integrity.py --self-test
          python3 scripts/omega-r50-release-gate.py --self-test
          python3 scripts/omega-r50-release-gate.py > /tmp/r50-hold.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/r50-hold.json'))
          assert data['status']=='HOLD'
          assert data['public_verified_sha256']==0
          assert not data['aaa_quality_attested']
          assert 'missing-independent-live-desktop-touch' in data['gaps']
          print('R50 CONTRACT PASS: candidate tests cannot counterfeit production or hardware release')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: R72 reject fake Godot splash as a real city screenshot
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          # pngjs is a browser-test-only dependency, intentionally installed
          # without altering the product lockfile or runtime bundle.
          npm install --no-save --package-lock=false pngjs@7.0.0
          node --test scripts/omega-world-frame-evidence.test.mjs
  real-post-ssh-game-acceptance:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate original manifest and latest source freshness
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/omega-r50-release-gate.py --self-test
          source_sha="$(python3 -c 'import json;print(json.load(open("public/games/omega-3d-preview/release.json"))["source_commit"])')"
          git fetch --no-tags origin "$source_sha"
          python3 scripts/omega-build-freshness.py "$source_sha" HEAD
          mkdir -p omega-r50-evidence
      - name: Independently download and SHA-256 check seven real public Godot assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/omega-live-integrity.py \
            --expected public/games/omega-3d-preview/release.json \
            --base https://osgard.world/games/omega-3d-preview \
            --nonce "${{ github.run_id }}" > omega-r50-evidence/live-integrity.json
          python3 scripts/omega-r50-release-gate.py \
            --live-evidence omega-r50-evidence/live-integrity.json > omega-r50-evidence/provisional-hold.json
      - name: Install pinned genuine Chromium WebGL browser
        shell: bash
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.58.2 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Actually drive published Godot game on desktop and mobile touch
        shell: bash
        env:
          OSGARD_GAME_ORIGIN: https://osgard.world
        run: |
          set -euo pipefail
          npx playwright test --config playwright.omega-live-webgl.config.mjs --reporter=json > omega-r50-evidence/playwright.json
      - name: Bind source SHA, seven byte hashes and browser result without claiming hardware
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/omega-r50-release-gate.py \
            --live-evidence omega-r50-evidence/live-integrity.json \
            --browser-json omega-r50-evidence/playwright.json \
            --output omega-r50-evidence/release-review.json
          python3 - <<'PY'
          import json
          obj=json.load(open('omega-r50-evidence/release-review.json'))
          assert obj['public_verified_sha256']==7
          assert obj['status']=='HOLD'
          assert 'missing-two-physical-hardware-reports' in obj['gaps']
          assert len(obj['live_chromium_projects'])==2
          print('R50 REAL POST-SSH WEBGL PASS, but full production quality certification HOLD for physical devices')
          PY
      - name: Preserve exact downloaded hashes and two genuine WebGL trace collections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-r50-exact-public-game-evidence-${{ github.run_id }}
          path: |
            omega-r50-evidence/
            omega-live-webgl-results/
            omega-live-webgl-report/
          if-no-files-found: warn
          retention-days: 14
