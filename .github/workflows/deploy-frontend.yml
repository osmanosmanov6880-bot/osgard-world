name: OSGARD frontend deploy

concurrency:
  group: ${{ contains(github.event.head_commit.message, '[supersede]') && 'osgard-frontend-deploy-recovery' || 'osgard-frontend-deploy' }}
  cancel-in-progress: false

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "public/skillcred/**"
      - "public/games/**"
      - "public/privacy/**"
      - "public/terms/**"
      - "godot/null-shift/**"
      - "scripts/null-shift-godot-smoke.mjs"
      - "public/games/null-shift-godot/**"
      - ".gitignore"
      - "index.html"
      - "public/sitemap.xml"
      - "nginx.conf"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "scripts/sync-swarm-assets.mjs"
      - "scripts/frontend-archive-preflight.mjs"
      - "scripts/production-route-matrix.mjs"
      - "scripts/activate-frontend-remote.sh"
      - "scripts/deploy-workflow-smoke.mjs"
      - "scripts/skillcred-page-smoke.mjs"
      - "scripts/time-prototype-smoke.mjs"
      - "scripts/null-shift-premium-smoke.mjs"
      - "scripts/games-portal-smoke.mjs"
      - "scripts/academy-home-smoke.mjs"
      - "scripts/remix-growth-smoke.mjs"
      - "scripts/ecosystem-integrity-smoke.mjs"
      - "docs/09_OSGARD_GAMES_PLATFORM_AUDIT.md"
      - "docs/04_NULL_SHIFT_GAME_DESIGN.md"
      - "docs/02_IMPERIUM_OF_TIME_GAME_DESIGN.md"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Validate deployment workflow safety checks
        run: npm run qa:deploy-workflow
      - run: npm run check
      - run: npm run qa:null-shift
      - name: Smoke-test the OSGARD Games hub
        run: npm run qa:games-portal
      - name: Verify REMIX viral loop, attribution and sponsor safety
        run: npm run qa:remix-growth
      - name: Verify ecosystem links, claims, contacts and privacy boundaries
        run: npm run qa:ecosystem
      - name: Verify Academy-first homepage and preserved portal route
        run: npm run qa:academy

      - name: Validate the Godot game project contract
        run: npm run qa:null-shift-godot
      - name: Cache Godot 4.7.2 and web export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/osgard-godot
            /home/runner/.local/share/godot/export_templates/4.7.2.stable
          key: osgard-godot-4.7.2-web-templates-v1-${{ runner.os }}
      - name: Install official Godot 4.7.2 engine and web templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/osgard-godot "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/osgard-godot/engine.zip
          unzip -q /tmp/osgard-godot/engine.zip -d /tmp/osgard-godot/
          curl -L --fail --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o /tmp/osgard-godot/templates.tpz
          mkdir -p /tmp/osgard-godot/unpacked-templates
          unzip -q /tmp/osgard-godot/templates.tpz -d /tmp/osgard-godot/unpacked-templates
          cp -a /tmp/osgard-godot/unpacked-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Verify Godot installation
        run: |
          chmod +x /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64 --version
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip"
      - name: Import and parse the Godot project
        run: /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path godot/null-shift --quit
      - name: Runtime-smoke gameplay state transitions in headless Godot
        run: |
          set -euo pipefail
          timeout 120s /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/null-shift --script res://tests/runtime_smoke.gd 2>&1 | tee /tmp/null-shift-godot-runtime.log
          ! grep -E 'SCRIPT ERROR:|Parse Error:|RUNTIME_SMOKE_FAILURE:' /tmp/null-shift-godot-runtime.log
      - name: Export Godot Web game
        run: |
          mkdir -p public/games/null-shift-godot
          /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/null-shift --export-release Web "$GITHUB_WORKSPACE/public/games/null-shift-godot/index.html"
          node scripts/null-shift-godot-smoke.mjs --export-check public/games/null-shift-godot
      - run: npm run build
      - name: Subset self-hosted Inter and minify SkillCred assets
        run: |
          python -m pip install --quiet fonttools brotli
          python -m fontTools.subset dist/skillcred/fonts/InterVariable.woff2 --output-file=/tmp/InterVariable-subset.woff2 --flavor=woff2 --unicodes="U+0020-007E,U+00A0-00FF,U+0400-045F,U+2000-206F,U+2116,U+2190-2199,U+2212,U+2713-2717,U+FEFF,U+FFFD" --layout-features="*" --no-hinting
          test -s /tmp/InterVariable-subset.woff2
          stat -c 'Subset font bytes: %s' /tmp/InterVariable-subset.woff2
          cp /tmp/InterVariable-subset.woff2 dist/skillcred/fonts/InterVariable.woff2
          python -m fontTools.subset dist/skillcred/fonts/JetBrainsMono-Regular.woff2 --output-file=/tmp/JetBrainsMono-subset.woff2 --flavor=woff2 --unicodes="U+0020-007E,U+00A0-00FF,U+2000-206F,U+2116,U+2190-2199,U+2212,U+2713-2717,U+FEFF,U+FFFD" --layout-features="*" --no-hinting
          test -s /tmp/JetBrainsMono-subset.woff2
          cp /tmp/JetBrainsMono-subset.woff2 dist/skillcred/fonts/JetBrainsMono-Regular.woff2
          python -m fontTools.subset dist/skillcred/fonts/InstrumentSerif-Italic.woff2 --output-file=/tmp/InstrumentSerif-subset.woff2 --flavor=woff2 --unicodes="U+0020-007E,U+00A0-00FF,U+2000-206F,U+2116,U+2190-2199,U+2212,U+2713-2717,U+FEFF,U+FFFD" --layout-features="*" --no-hinting
          test -s /tmp/InstrumentSerif-subset.woff2
          cp /tmp/InstrumentSerif-subset.woff2 dist/skillcred/fonts/InstrumentSerif-Italic.woff2
          printf 'Font bytes — Inter: %s; JetBrains Mono: %s; Instrument Serif: %s\\n' "$(wc -c < dist/skillcred/fonts/InterVariable.woff2)" "$(wc -c < dist/skillcred/fonts/JetBrainsMono-Regular.woff2)" "$(wc -c < dist/skillcred/fonts/InstrumentSerif-Italic.woff2)"
          ./node_modules/.bin/esbuild dist/skillcred/app.js --minify --outfile=/tmp/skillcred-app.min.js
          mv /tmp/skillcred-app.min.js dist/skillcred/app.js
          ./node_modules/.bin/esbuild dist/skillcred/styles.css --minify --outfile=/tmp/skillcred-styles.min.css
          mv /tmp/skillcred-styles.min.css dist/skillcred/styles.css
      - run: npm run preflight:frontend
      - run: npm run qa:skillcred
      - name: Verify Imperium of Time visuals and real diagnostics
        run: npm run qa:time-ui
      - name: Check deployment shell syntax
        run: bash -n scripts/activate-frontend-remote.sh
      - name: Package HTML assets and matching Nginx config
        run: |
          mkdir -p osgard-release/html
          cp -a dist/. osgard-release/html/
          ASSET_VERSION="${GITHUB_SHA:0:12}"
          sed -i "s|/skillcred/styles.css|/skillcred/styles.css?v=$ASSET_VERSION|g" osgard-release/html/skillcred/index.html
          sed -i "s|/skillcred/app.js|/skillcred/app.js?v=$ASSET_VERSION|g" osgard-release/html/skillcred/index.html
          find osgard-release/html/skillcred -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -exec gzip -9 -k {} +
          SKILLCRED_JS_GZIP_BYTES=$(wc -c < osgard-release/html/skillcred/app.js.gz)
          printf 'SkillCred JavaScript transfer size: %s bytes / 15360 bytes budget\n' "$SKILLCRED_JS_GZIP_BYTES"
          test "$SKILLCRED_JS_GZIP_BYTES" -le 15360 || { echo 'SkillCred compressed JavaScript exceeds 15 KiB budget' >&2; exit 1; }
          touch osgard-release/html/skillcred/styles.css.gz osgard-release/html/skillcred/app.js.gz
          test -s osgard-release/html/skillcred/styles.css.gz
          test -s osgard-release/html/skillcred/app.js.gz
          gzip -t osgard-release/html/skillcred/styles.css.gz osgard-release/html/skillcred/app.js.gz
          cp nginx.conf osgard-release/nginx.conf
          tar -czf osgard-world-release.tgz -C osgard-release .
      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.OSGARD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.OSGARD_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.OSGARD_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::Missing GitHub Actions secret OSGARD_DEPLOY_HOST. Set it to the VPS hostname or IP."
            exit 1
          fi
          if [ -z "$DEPLOY_USER" ]; then
            echo "::error::Missing GitHub Actions secret OSGARD_DEPLOY_USER. Set it to the SSH deployment username."
            exit 1
          fi
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::Missing GitHub Actions secret OSGARD_DEPLOY_KEY. Add the private SSH key authorized for the deployment user on the VPS."
            exit 1
          fi
          if ! printf '%s' "$DEPLOY_KEY" | grep -q -- 'PRIVATE KEY'; then
            echo "::error::OSGARD_DEPLOY_KEY does not look like a private SSH key. Store the full private key, including its BEGIN/END lines."
            exit 1
          fi
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.OSGARD_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.OSGARD_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/osgard_deploy
          chmod 600 ~/.ssh/osgard_deploy
          if ! ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/tmp/osgard-keyscan.err; then
            echo "::error::Could not read the SSH host key from OSGARD_DEPLOY_HOST. Check the host/IP, network access, and SSH port on the VPS."
            cat /tmp/osgard-keyscan.err >&2
            exit 1
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::SSH host-key scan returned no host keys for OSGARD_DEPLOY_HOST."
            exit 1
          fi
      - name: Stage archive and verify checksum
        env:
          HOST: ${{ secrets.OSGARD_DEPLOY_HOST }}
          USER: ${{ secrets.OSGARD_DEPLOY_USER }}
        run: |
          sha256sum osgard-world-release.tgz | tee local.sha256
          ssh -i ~/.ssh/osgard_deploy "$USER@$HOST" 'rm -rf /tmp/osgard-gh-release && mkdir -p /tmp/osgard-gh-release'
          scp -i ~/.ssh/osgard_deploy osgard-world-release.tgz "$USER@$HOST:/tmp/osgard-gh-release/"
          scp -i ~/.ssh/osgard_deploy local.sha256 "$USER@$HOST:/tmp/osgard-gh-release/"
          ssh -i ~/.ssh/osgard_deploy "$USER@$HOST" 'cd /tmp/osgard-gh-release && sha256sum -c local.sha256'
      - name: Activate verified archive with config rollback
        env:
          HOST: ${{ secrets.OSGARD_DEPLOY_HOST }}
          USER: ${{ secrets.OSGARD_DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/osgard_deploy scripts/activate-frontend-remote.sh "$USER@$HOST:/tmp/activate-frontend-remote.sh"
          ssh -i ~/.ssh/osgard_deploy "$USER@$HOST" 'docker cp /tmp/osgard-gh-release/osgard-world-release.tgz osgard-world:/tmp/osgard-gh-release.tgz && chmod 700 /tmp/activate-frontend-remote.sh && OSGARD_ARCHIVE=/tmp/osgard-gh-release.tgz OSGARD_CONTAINER=osgard-world /tmp/activate-frontend-remote.sh'
      - name: Verify published routes and same-origin API proxy
        env:
          OSGARD_BASE_URL: https://osgard.world
          SKILLCRED_EXPECT_CURRENT_DESIGN: "1"
        run: npm run qa:production-routes
      - name: Test real issue, verify and revoke through OSGARD proxy
        env:
          OSGARD_BASE_URL: https://osgard.world
        run: node scripts/skillcred-proxy-smoke.mjs
