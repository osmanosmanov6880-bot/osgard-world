name: OSGARD frontend deploy

concurrency:
  # A superseding release cancels stale normal runs and older recovery runs.
  group: osgard-frontend-deploy
  cancel-in-progress: ${{ contains(github.event.head_commit.message, '[supersede]') }}

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "server/**"
      - "scripts/remix-*"
      - "scripts/check-nginx-remix-guard.sh"
      - "scripts/check-nginx-remix-owned.sh"
      - "tests/test_remix_*.py"
      - "tests/test_frontend_activation.py"
      - "docker-compose.production.yml"
      - "public/development/index.html"
      - "public/development/osa-intelligence/**"
      - "public/development/og.svg"
      - "scripts/development-index-smoke.mjs"
      - "scripts/osa-intelligence-case-smoke.mjs"
      - "public/development/merakki/**"
      - "scripts/merakki-case-smoke.mjs"
      - "public/skillcred/**"
      - "public/entertainment/**"
      - "public/games/**"
      - "public/brand/**"
      - "public/privacy/**"
      - "public/osa-library/**"
      - "docs/OSA_MEDIA_RECOVERY_RUNBOOK.md"
      - "public/terms/**"
      - "public/tedes/**"
      - "public/development/tedes/**"
      - "public/development/phantom/**"
      - "public/development/auto-style/**"
      - "public/development/textura/**"
      - "public/development/essentia/**"
      - "scripts/essentia-case-smoke.mjs"
      - "godot/null-shift/**"
      - "scripts/null-shift-godot-smoke.mjs"
      - "public/games/null-shift-godot/**"
      - ".gitignore"
      - "index.html"
      - "public/sitemap.xml"
      - "nginx.conf"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "scripts/sync-swarm-assets.mjs"
      - "scripts/frontend-archive-preflight.mjs"
      - "scripts/production-route-matrix.mjs"
      - "scripts/ecosystem-production-smoke.mjs"
      - "scripts/production-health-watch.mjs"
      - "scripts/activate-frontend-remote.sh"
      - "scripts/deploy-workflow-smoke.mjs"
      - "scripts/tedes-case-smoke.mjs"
      - "scripts/phantom-case-smoke.mjs"
      - "scripts/auto-style-case-smoke.mjs"
      - "scripts/textura-case-smoke.mjs"
      - "scripts/elbrus-case-smoke.mjs"
      - "scripts/noir-auto-case-smoke.mjs"
      - "scripts/entertainment-locales-smoke.mjs"
      - "scripts/skillcred-page-smoke.mjs"
      - "scripts/time-prototype-smoke.mjs"
      - "scripts/null-shift-premium-smoke.mjs"
      - "scripts/games-portal-smoke.mjs"
      - "scripts/zion-local-smoke.mjs"
      - "scripts/redesign-*.mjs"
      - "scripts/core-*.py"
      - "scripts/academy-home-smoke.mjs"
      - "scripts/lecture-library-smoke.mjs"
      - "scripts/osa-media-release-preflight.mjs"
      - "scripts/osa-media-file-audit.mjs"
      - "scripts/precompress-brand-transition.mjs"
      - "scripts/osa-narration-readiness.mjs"
      - "docs/OSA_TTS_PRODUCTION_PLAN.md"
      - "docs/osa-narration/**"
      - "docs/OSA_MEDIA_RELEASE_PIPELINE.md"
      - "scripts/remix-growth-smoke.mjs"
      - "scripts/ecosystem-integrity-smoke.mjs"
      - "docs/09_OSGARD_GAMES_PLATFORM_AUDIT.md"
      - "docs/04_NULL_SHIFT_GAME_DESIGN.md"
      - "docs/02_IMPERIUM_OF_TIME_GAME_DESIGN.md"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Validate deployment workflow safety checks
        run: npm run qa:deploy-workflow
      - run: npm run check
      - name: Verify three product surfaces and all game entry points
        run: npm run qa:redesign
      - name: Verify locally published ZION gameplay
        run: npm run qa:zion-local
      - name: Verify navigation, guest progress and resilient game interfaces
        run: |
          npm run qa:ux
          npm run qa:osa-progress
          npm run qa:game-interface
          npm run qa:inherit-handoff
          npm run qa:inherit-account
          npm run qa:inherit-i18n
          npm run qa:inherit-legacy
          npm run qa:inherit-story
          npm run qa:inherit-world-cycle
          npm run qa:inherit-research
          npm run qa:inherit-pilot-launch
          npm run qa:inherit-followup
          npm run qa:inherit-atlas
          npm run qa:inherit-handoff-moment
          npm run qa:inherit-timelapse
          npm run qa:inherit-compass
          npm run qa:remix-session
          npm run qa:remix-owned-session
          npm run qa:remix-invitations
          npm run qa:remix-owned-probe
          npm run qa:remix-legacy
          npm run qa:remix-contract
          npm run qa:remix-guard
          npm run qa:remix-owned
          npm run qa:remix-participants
          npm run qa:remix-two-player-probe
          npm run qa:activation
      - name: Verify measured pilot outcomes and offline recovery
        run: |
          npm run qa:pilot-scorecard
          npm run qa:core-recovery
      - name: Install pinned Core dependencies
        run: python3 -m pip install -r server/requirements.txt
      - name: Validate TEDES demo and portfolio page
        run: node scripts/tedes-case-smoke.mjs
      - name: Validate Development landing and prevent directory 403
        run: node scripts/development-index-smoke.mjs
      - name: Validate OSA Global Intelligence case
        run: npm run qa:osa-intelligence-case
      - name: Validate PHANTOM premium gaming case
        run: node scripts/phantom-case-smoke.mjs
      - name: Smoke-test the ELBRUS Entertainment case
        run: npm run qa:elbrus-case
      - name: Smoke-test the NOIR AUTO automotive case
        run: node scripts/noir-auto-case-smoke.mjs
      - name: Smoke-test global Entertainment hubs
        run: npm run qa:entertainment-locales
      - name: Verify MERAKKI brief generation and copy flow
        run: npm run qa:merakki-case
      - name: Verify AUTO STYLE premium case, metadata and routes
        run: npm run qa:auto-style-case
      - name: Verify TEXTURA luxury case and all locales
        run: npm run qa:textura-case
      - name: Verify ESSENTIA commerce showcase
        run: npm run qa:essentia
      - run: npm run qa:null-shift
      - name: Smoke-test the OSGARD Games hub
        run: npm run qa:games-portal
      - name: Verify REMIX viral loop, attribution and sponsor safety
        run: npm run qa:remix-growth
      - name: Verify ecosystem links, claims, contacts and privacy boundaries
        run: npm run qa:ecosystem
      - name: Verify Academy-first homepage and preserved portal route
        run: npm run qa:academy
      - name: Verify ordered OSA course and lecture library
        run: npm run qa:lectures
      - name: Verify unified OSA learning progress persistence
        run: npm run qa:osa-progress
      - name: Validate OSGARD Core API and SQLite operations
        run: npm run qa:core-api
      - name: Verify release integrity and payment recovery boundaries
        run: |
          npm run qa:core-readiness
          npm run qa:core-commerce
          npm run qa:core-program-commerce
          npm run qa:stripe-sdk

      - name: Validate the Godot game project contract
        run: npm run qa:null-shift-godot
      - name: Detect whether the Godot web export needs rebuilding
        id: godot-changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet HEAD^ HEAD -- godot/null-shift/ public/games/null-shift-godot/ scripts/null-shift-godot-smoke.mjs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Godot sources or exported assets changed; keeping the checked-in Web export."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Godot sources or exported assets changed; rebuilding and validating the Web export."
          fi
      - name: Cache Godot 4.7.2 and web export templates
        id: godot-cache
        if: ${{ steps.godot-changes.outputs.changed == 'true' && !contains(github.event.head_commit.message, '[supersede]') }}
        uses: actions/cache@v4
        with:
          path: |
            /tmp/osgard-godot
            /home/runner/.local/share/godot/export_templates/4.7.2.stable
          key: osgard-godot-4.7.2-web-templates-v1-${{ runner.os }}
      - name: Install official Godot 4.7.2 engine and web templates
        if: ${{ steps.godot-changes.outputs.changed == 'true' && steps.godot-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/osgard-godot "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/osgard-godot/engine.zip
          unzip -q /tmp/osgard-godot/engine.zip -d /tmp/osgard-godot/
          curl -L --fail --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o /tmp/osgard-godot/templates.tpz
          mkdir -p /tmp/osgard-godot/unpacked-templates
          unzip -q /tmp/osgard-godot/templates.tpz -d /tmp/osgard-godot/unpacked-templates
          cp -a /tmp/osgard-godot/unpacked-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Verify Godot installation
        if: ${{ steps.godot-changes.outputs.changed == 'true' }}
        run: |
          chmod +x /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64 --version
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip"
      - name: Import and parse the Godot project
        if: ${{ steps.godot-changes.outputs.changed == 'true' }}
        run: /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path godot/null-shift --quit
      - name: Runtime-smoke gameplay state transitions in headless Godot
        if: ${{ steps.godot-changes.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          timeout 120s /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/null-shift --script res://tests/runtime_smoke.gd 2>&1 | tee /tmp/null-shift-godot-runtime.log
          ! grep -E 'SCRIPT ERROR:|Parse Error:|RUNTIME_SMOKE_FAILURE:' /tmp/null-shift-godot-runtime.log
      - name: Export Godot Web game
        if: ${{ steps.godot-changes.outputs.changed == 'true' }}
        run: |
          mkdir -p public/games/null-shift-godot
          /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/null-shift --export-release Web "$GITHUB_WORKSPACE/public/games/null-shift-godot/index.html"
          node scripts/null-shift-godot-smoke.mjs --export-check public/games/null-shift-godot
      - run: npm run build
      - name: Verify Unity runtime delivery through candidate Nginx
        run: npm run qa:nginx-game-delivery
      - name: Verify REMIX result durability through candidate Nginx
        run: npm run qa:nginx-remix-guard
      - name: Verify Core ownership and protected rollback through candidate Nginx
        run: npm run qa:nginx-remix-owned
      - name: Verify unavailable Unity build is pinned to reviewed evidence
        run: |
          node scripts/remix-unity-status-check.mjs dist
          node scripts/remix-unity-status-check.mjs --self-test
      - name: Install pinned launcher safety browser
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.58.2 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Verify unavailable Unity route and diagnostic recovery before publication
        run: bash scripts/check-nginx-unity-browser.sh --grep-invert 'actual gzip build'
      - name: Verify REMIX guest and account recovery on desktop and mobile before publication
        run: npx playwright test --config playwright.ecosystem.config.mjs scripts/remix-console-browser.spec.mjs scripts/remix-owned-browser.spec.mjs scripts/remix-invitations-browser.spec.mjs scripts/inherit-account-browser.spec.mjs
      - name: Verify landing page budgets and route metadata
        run: npm run qa:redesign-build
      - name: Verify precompressed shared-brand JavaScript
        run: npm run qa:brand-gzip
      - name: Verify OSA media inventory and publication gate
        run: npm run qa:osa-media-release
      - name: Test local original-file verification gate
        run: npm run qa:osa-media-files
      - name: Verify bilingual OSA narration sources and estimate TTS cost
        run: npm run qa:osa-narration
      - name: Ensure public case and game assets are present in release tree
        run: |
          mkdir -p dist/games dist/entertainment
          cp -a public/games/. dist/games/
          cp -a public/entertainment/. dist/entertainment/
          test -s dist/games/ecosystem-intermission.js
          test -s dist/entertainment/og.svg
          test -s dist/entertainment/noir-auto/og.svg
      - name: Subset self-hosted Inter and minify SkillCred assets
        run: |
          python -m pip install --quiet fonttools brotli
          python -m fontTools.subset dist/skillcred/fonts/InterVariable.woff2 --output-file=/tmp/InterVariable-subset.woff2 --flavor=woff2 --unicodes="U+0020-007E,U+00A0-00FF,U+0400-045F,U+2000-206F,U+2116,U+2190-2199,U+2212,U+2713-2717,U+FEFF,U+FFFD" --layout-features="*" --no-hinting
          test -s /tmp/InterVariable-subset.woff2
          stat -c 'Subset font bytes: %s' /tmp/InterVariable-subset.woff2
          cp /tmp/InterVariable-subset.woff2 dist/skillcred/fonts/InterVariable.woff2
          python -m fontTools.subset dist/skillcred/fonts/JetBrainsMono-Regular.woff2 --output-file=/tmp/JetBrainsMono-subset.woff2 --flavor=woff2 --unicodes="U+0020-007E,U+00A0-00FF,U+2000-206F,U+2116,U+2190-2199,U+2212,U+2713-2717,U+FEFF,U+FFFD" --layout-features="*" --no-hinting
          test -s /tmp/JetBrainsMono-subset.woff2
          cp /tmp/JetBrainsMono-subset.woff2 dist/skillcred/fonts/JetBrainsMono-Regular.woff2
          python -m fontTools.subset dist/skillcred/fonts/InstrumentSerif-Italic.woff2 --output-file=/tmp/InstrumentSerif-subset.woff2 --flavor=woff2 --unicodes="U+0020-007E,U+00A0-00FF,U+2000-206F,U+2116,U+2190-2199,U+2212,U+2713-2717,U+FEFF,U+FFFD" --layout-features="*" --no-hinting
          test -s /tmp/InstrumentSerif-subset.woff2
          cp /tmp/InstrumentSerif-subset.woff2 dist/skillcred/fonts/InstrumentSerif-Italic.woff2
          printf 'Font bytes — Inter: %s; JetBrains Mono: %s; Instrument Serif: %s\n' "$(wc -c < dist/skillcred/fonts/InterVariable.woff2)" "$(wc -c < dist/skillcred/fonts/JetBrainsMono-Regular.woff2)" "$(wc -c < dist/skillcred/fonts/InstrumentSerif-Italic.woff2)"
          ./node_modules/.bin/esbuild dist/skillcred/app.js --minify --outfile=/tmp/skillcred-app.min.js
          mv /tmp/skillcred-app.min.js dist/skillcred/app.js
          ./node_modules/.bin/esbuild dist/skillcred/styles.css --minify --outfile=/tmp/skillcred-styles.min.css
          mv /tmp/skillcred-styles.min.css dist/skillcred/styles.css
      - run: npm run preflight:frontend
      - run: npm run qa:skillcred
      - name: Verify Imperium of Time visuals and real diagnostics
        run: npm run qa:time-ui
      - name: Check deployment shell syntax
        run: bash -n scripts/activate-frontend-remote.sh
      - name: Package HTML assets and matching Nginx config
        run: |
          set -euo pipefail
          mkdir -p osgard-release/html
          cp -a dist/. osgard-release/html/
          ASSET_VERSION="${GITHUB_SHA:0:12}"
          # Bust immutable edge-cache URLs after changing the shared brand delivery.
          find osgard-release/html -type f -name '*.html' -exec sed -i \
            -e "s|/brand/osa-transition.js|/brand/osa-transition.js?v=$ASSET_VERSION|g" \
            -e "s|/brand/osa5-portals.css|/brand/osa5-portals.css?v=$ASSET_VERSION|g" {} +
          test -s osgard-release/html/brand/osa-transition.js.gz
          test -s osgard-release/html/brand/osa5-portals.css.gz
          gzip -t osgard-release/html/brand/osa-transition.js.gz osgard-release/html/brand/osa5-portals.css.gz
          grep -R -F "/brand/osa-transition.js?v=$ASSET_VERSION" osgard-release/html --include='*.html' >/dev/null
          grep -R -F "/brand/osa5-portals.css?v=$ASSET_VERSION" osgard-release/html --include='*.html' >/dev/null
          sed -i "s|/skillcred/styles.css|/skillcred/styles.css?v=$ASSET_VERSION|g" osgard-release/html/skillcred/index.html
          sed -i "s|/skillcred/app.js|/skillcred/app.js?v=$ASSET_VERSION|g" osgard-release/html/skillcred/index.html
          find osgard-release/html/skillcred -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -exec gzip -9 -k {} +
          SKILLCRED_JS_GZIP_BYTES=$(wc -c < osgard-release/html/skillcred/app.js.gz)
          printf 'SkillCred JavaScript transfer size: %s bytes / 15360 bytes budget\n' "$SKILLCRED_JS_GZIP_BYTES"
          test "$SKILLCRED_JS_GZIP_BYTES" -le 15360 || { echo 'SkillCred compressed JavaScript exceeds 15 KiB budget' >&2; exit 1; }
          touch osgard-release/html/skillcred/styles.css.gz osgard-release/html/skillcred/app.js.gz
          test -s osgard-release/html/skillcred/styles.css.gz
          test -s osgard-release/html/skillcred/app.js.gz
          gzip -t osgard-release/html/skillcred/styles.css.gz osgard-release/html/skillcred/app.js.gz
          cp nginx.conf osgard-release/nginx.conf
          docker build --pull -f server/Dockerfile -t osgard-core-api:${GITHUB_SHA} .
          docker save osgard-core-api:${GITHUB_SHA} | gzip -1 > osgard-release/core-api-image.tar.gz
          test -s osgard-release/core-api-image.tar.gz
          docker build --pull -f server/RemixGuard.Dockerfile -t osgard-remix-guard:${GITHUB_SHA} .
          docker save osgard-remix-guard:${GITHUB_SHA} | gzip -1 > osgard-release/remix-guard-image.tar.gz
          test -s osgard-release/remix-guard-image.tar.gz
          tar -czf osgard-world-release.tgz -C osgard-release .
      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.OSGARD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.OSGARD_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.OSGARD_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::Missing GitHub Actions secret OSGARD_DEPLOY_HOST. Set it to the VPS hostname or IP."
            exit 1
          fi
          if [ -z "$DEPLOY_USER" ]; then
            echo "::error::Missing GitHub Actions secret OSGARD_DEPLOY_USER. Set it to the SSH deployment username."
            exit 1
          fi
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::Missing GitHub Actions secret OSGARD_DEPLOY_KEY. Add the private SSH key authorized for the deployment user on the VPS."
            exit 1
          fi
          if ! printf '%s' "$DEPLOY_KEY" | grep -q -- 'PRIVATE KEY'; then
            echo "::error::OSGARD_DEPLOY_KEY does not look like a private SSH key. Store the full private key, including its BEGIN/END lines."
            exit 1
          fi
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.OSGARD_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.OSGARD_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/osgard_deploy
          chmod 600 ~/.ssh/osgard_deploy
          if ! ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/tmp/osgard-keyscan.err; then
            echo "::error::Could not read the SSH host key from OSGARD_DEPLOY_HOST. Check the host/IP, network access, and SSH port on the VPS."
            cat /tmp/osgard-keyscan.err >&2
            exit 1
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::SSH host-key scan returned no host keys for OSGARD_DEPLOY_HOST."
            exit 1
          fi
      - name: Verify host-managed API from frontend container
        env:
          HOST: ${{ secrets.OSGARD_DEPLOY_HOST }}
          USER: ${{ secrets.OSGARD_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/osgard_deploy "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          host_gateway="$(docker inspect --format '{{range $name, $conf := .NetworkSettings.Networks}}{{println $conf.Gateway}}{{end}}' osgard-world | awk 'NF { print $1; exit }')"
          test -n "$host_gateway" || { echo "Unable to determine the host gateway for osgard-world" >&2; exit 1; }
          echo "Testing host API through frontend gateway $host_gateway"
          docker exec osgard-world sh -lc "wget -q -O - -T 3 http://$host_gateway:4317/health"
          REMOTE
      - name: Preserve Godot Web export for static-only releases
        if: ${{ steps.godot-changes.outputs.changed == 'false' }}
        env:
          HOST: ${{ secrets.OSGARD_DEPLOY_HOST }}
          USER: ${{ secrets.OSGARD_DEPLOY_USER }}
        run: |
          set -euo pipefail
          TEMP_DIR="/tmp/osgard-godot-preserve-${GITHUB_RUN_ID}"
          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR/unpacked/html/games/null-shift-godot"
          tar -xzf osgard-world-release.tgz -C "$TEMP_DIR/unpacked"
          ssh -i ~/.ssh/osgard_deploy "$USER@$HOST" "GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" > "$TEMP_DIR/godot-export.tgz" <<'REMOTE'
          set -euo pipefail
          container="osgard-world"
          remote_dir="/tmp/osgard-godot-preserve-${GITHUB_RUN_ID}"
          active="/usr/share/nginx/html/games/null-shift-godot"
          previous="/tmp/osgard-gh-previous/games/null-shift-godot"
          mkdir -p "$remote_dir"
          trap 'rm -rf "$remote_dir"' EXIT
          if docker exec "$container" sh -lc 'test -s /usr/share/nginx/html/games/null-shift-godot/index.js && test -s /usr/share/nginx/html/games/null-shift-godot/index.wasm && test -s /usr/share/nginx/html/games/null-shift-godot/index.pck'; then
            source="$active"
          elif docker exec "$container" sh -lc 'test -s /tmp/osgard-gh-previous/games/null-shift-godot/index.js && test -s /tmp/osgard-gh-previous/games/null-shift-godot/index.wasm && test -s /tmp/osgard-gh-previous/games/null-shift-godot/index.pck'; then
            echo "Active export absent; restoring from last verified release backup." >&2
            source="$previous"
          else
            echo "No complete Godot Web export is available in active or previous release." >&2
            exit 1
          fi
          docker cp "$container:$source" "$remote_dir/export"
          tar -czf - -C "$remote_dir/export" .
          REMOTE
          tar -xzf "$TEMP_DIR/godot-export.tgz" -C "$TEMP_DIR/unpacked/html/games/null-shift-godot"
          node scripts/null-shift-godot-smoke.mjs --export-check "$TEMP_DIR/unpacked/html/games/null-shift-godot"
          tar -czf osgard-world-release.tgz -C "$TEMP_DIR/unpacked" .
          rm -rf "$TEMP_DIR"
      - name: Stage archive and verify checksum
        env:
          HOST: ${{ secrets.OSGARD_DEPLOY_HOST }}
          USER: ${{ secrets.OSGARD_DEPLOY_USER }}
        run: |
          REMOTE_RELEASE_DIR="/tmp/osgard-gh-release-${GITHUB_RUN_ID}"
          sha256sum osgard-world-release.tgz | tee local.sha256
          ssh -i ~/.ssh/osgard_deploy "$USER@$HOST" "rm -rf '$REMOTE_RELEASE_DIR' && mkdir -p '$REMOTE_RELEASE_DIR'"
          scp -i ~/.ssh/osgard_deploy osgard-world-release.tgz "$USER@$HOST:$REMOTE_RELEASE_DIR/"
          scp -i ~/.ssh/osgard_deploy local.sha256 "$USER@$HOST:$REMOTE_RELEASE_DIR/"
          ssh -i ~/.ssh/osgard_deploy "$USER@$HOST" "cd '$REMOTE_RELEASE_DIR' && sha256sum -c local.sha256"
      - name: Activate verified archive with config rollback
        env:
          HOST: ${{ secrets.OSGARD_DEPLOY_HOST }}
          USER: ${{ secrets.OSGARD_DEPLOY_USER }}
        run: |
          REMOTE_RELEASE_DIR="/tmp/osgard-gh-release-${GITHUB_RUN_ID}"
          REMOTE_ARCHIVE="/tmp/osgard-gh-release-${GITHUB_RUN_ID}.tgz"
          REMOTE_SCRIPT="/tmp/activate-frontend-remote-${GITHUB_RUN_ID}.sh"
          scp -i ~/.ssh/osgard_deploy scripts/activate-frontend-remote.sh "$USER@$HOST:$REMOTE_SCRIPT"
          ssh -i ~/.ssh/osgard_deploy "$USER@$HOST" "docker cp '$REMOTE_RELEASE_DIR/osgard-world-release.tgz' osgard-world:'$REMOTE_ARCHIVE' && chmod 700 '$REMOTE_SCRIPT' && OSGARD_ARCHIVE='$REMOTE_ARCHIVE' OSGARD_CORE_IMAGE='osgard-core-api:${GITHUB_SHA}' OSGARD_REMIX_GUARD_IMAGE='osgard-remix-guard:${GITHUB_SHA}' OSGARD_CONTAINER=osgard-world '$REMOTE_SCRIPT'"
      - name: Verify published REMIX guard readiness
        run: npm run qa:remix-health
      - name: Verify one private QA match through the published REMIX API
        id: remix-live-contract
        run: python3 scripts/remix-service-contract-smoke.py --exercise --output remix-live-contract.json
      - name: Retain the exact private QA match contract evidence
        if: ${{ always() && steps.remix-live-contract.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: remix-live-contract
          path: remix-live-contract.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify published routes and same-origin API proxy
        env:
          OSGARD_BASE_URL: https://osgard.world
          SKILLCRED_EXPECT_CURRENT_DESIGN: "1"
        run: npm run qa:production-routes
      - name: Verify published Unity runtime and real missing-resource responses
        env:
          OSGARD_BASE_URL: https://osgard.world
        run: npm run qa:game-delivery
      - name: Verify all world routes and exact published ZION assets
        env:
          OSGARD_BASE_URL: https://osgard.world
        run: npm run qa:ecosystem-production
      - name: Verify versioned shared-brand assets are delivered with gzip
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${ASSET_VERSION:0:12}"
          for asset in brand/osa-transition.js brand/osa5-portals.css; do
            url="https://osgard.world/${asset}?v=${SHORT_SHA}"
            echo "Checking gzip response for ${url}"
            headers="$(curl --http1.1 -fsS -D - -o /dev/null -H 'Accept-Encoding: gzip' "${url}")"
            if printf '%s\n' "${headers}" | grep -Eiq '^content-encoding:[[:space:]]*gzip[[:space:]]*$'; then
              echo "PASS: ${url} served with gzip"
            else
              content_length="$(printf '%s\n' "${headers}" | awk 'tolower($1) == "content-length:" { gsub("\r", "", $2); print $2; exit }')"
              if [[ "${content_length}" =~ ^[0-9]+$ && "${content_length}" -le 4096 ]]; then
                echo "::warning::${url} was served uncompressed (${content_length} bytes), within the 4 KiB asset budget."
              else
                echo "Expected gzip or a response under 4096 bytes for ${url} (Content-Length: ${content_length:-unknown})" >&2
                exit 1
              fi
            fi
          done
      - name: Test real issue, verify and revoke through OSGARD proxy
        env:
          OSGARD_BASE_URL: https://osgard.world
        run: node scripts/skillcred-proxy-smoke.mjs
