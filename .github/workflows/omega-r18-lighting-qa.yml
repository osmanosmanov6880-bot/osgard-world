name: OSGARD HORIZON R18 anti-glare and PBR lacquer native QA
on:
  pull_request:
    branches: [master, feat/horizon-r17-yaw-inertia-tyre-load]
    paths:
      - 'godot/empire-omega/**'
      - '.github/workflows/omega-r18-lighting-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Generate audio and import genuine Godot game
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          godot --headless --editor --path godot/empire-omega --import --quit
      - name: Validate sky, fog, PBR coat, wet road and actual world
        shell: bash
        run: |
          set -euo pipefail
          for suite in v23_horizon_visuals v26_horizon_sculpted_visuals v38_adaptive_graphics v40_yaw_inertia v41_lighting_grade; do
            timeout --signal=TERM --kill-after=5s 80s godot --headless --path godot/empire-omega --script "res://tests/$suite.gd"
          done
