name: OSGARD HORIZON R26 real organic foliage and portrait HUD QA
on:
  pull_request:
    branches: [master]
    paths:
      - 'godot/empire-omega/**'
      - '.github/workflows/omega-r26-foliage-focus-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-organic-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Generate original game audio and import official Godot source
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          godot --headless --editor --path godot/empire-omega --import --quit
      - name: Validate native foliage, layout, multitouch and current world
        shell: bash
        run: |
          set -euo pipefail
          for test in v23_horizon_visuals v26_horizon_sculpted_visuals v29_responsive_layout v28_touch_controls v37_touch_commands v38_adaptive_graphics v48_city_polish v50_organic_foliage_mobile_focus; do
            echo "::group::Godot $test"
            timeout --signal=TERM --kill-after=5s 95s godot --headless --path godot/empire-omega --script "res://tests/$test.gd"
            echo "::endgroup::"
          done
