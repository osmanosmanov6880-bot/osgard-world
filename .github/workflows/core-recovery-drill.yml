name: OSGARD Core backup recovery verification
on:
  pull_request:
    paths:
      - 'scripts/verify-core-backup.py'
      - 'tests/test_core_backup_recovery.py'
      - 'docs/CORE-RECOVERY-DRILL.md'
      - '.github/workflows/core-recovery-drill.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/verify-core-backup.py'
      - 'tests/test_core_backup_recovery.py'
      - 'docs/CORE-RECOVERY-DRILL.md'
      - '.github/workflows/core-recovery-drill.yml'
permissions:
  contents: read
jobs:
  temporary-sqlite-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/verify-core-backup.py tests/test_core_backup_recovery.py
      - run: python -m unittest discover -s tests -p test_core_backup_recovery.py -v
