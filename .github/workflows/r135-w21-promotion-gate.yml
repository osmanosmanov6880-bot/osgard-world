name: OSGARD R135 W21 independent real settings, 15 PNG and WebGL release acceptance

on:
  push:
    branches:
      - release/r135-w21-independent-gate-20261025
      - release/r135-w21-reviewed-artifact-20261025
    paths:
      - ".github/workflows/r135-w21-promotion-gate.yml"
      - "scripts/r135-w21-promotion-qa.py"
      - "scripts/r135-w21-candidate-pin-draft.py"
      - "scripts/test_r135_w21_promotion_gate.py"
      - "scripts/r135-w21-release-pin.json"
      - "scripts/r135-release-stage.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-fail-closed-W21-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify old W18/W19 compatibility and reject falsified new W21 UI evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_r135_w21_promotion_gate.py -v
          python3 -m unittest discover -s scripts -p test_r135_w20_promotion_gate.py -v
          python3 -m unittest discover -s scripts -p test_r135_w19_promotion_gate.py -v
          python3 -m py_compile scripts/r135-w21-promotion-qa.py scripts/r135-w21-candidate-pin-draft.py scripts/r135-release-stage.py
          echo 'W21 negative-only contract PASS; no candidate publication implied'

  independently-review-exact-W21:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release/r135-w21-reviewed-artifact-20261025'
    needs: verify-fail-closed-W21-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify same-source successful full native and optimized WebGL runs, exact artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PIN=scripts/r135-w21-release-pin.json
          test -s "$PIN" || { echo 'HOLD: no original reviewed W21 pin exists'; exit 1; }
          test "$(jq -er '.channel' scripts/r135-active-release.json)" = w19 || test "$(jq -er '.channel' scripts/r135-active-release.json)" = w20
          SOURCE="$(jq -er '.source_commit' "$PIN")"
          RUN_ID="$(jq -er '.artifact_run_id' "$PIN")"
          ART_ID="$(jq -er '.artifact_id' "$PIN")"
          ART_NAME="$(jq -er '.artifact_name' "$PIN")"
          NATIVE_ID="$(jq -er '.native_run_id' "$PIN")"
          test "$ART_NAME" = osgard-r135-optimized-web-qa
          for kind in web native; do
            if [[ "$kind" == web ]]; then
              IDENTIFIER="$RUN_ID"
              EXPECTED=r135-web-optimized.yml
            else
              IDENTIFIER="$NATIVE_ID"
              EXPECTED=r135-w21-explainable-native-qa.yml
            fi
            RUN="$(gh api "repos/osmanosmanov6880-bot/osgard-world/actions/runs/$IDENTIFIER")"
            test "$(jq -er '.head_sha' <<< "$RUN")" = "$SOURCE"
            test "$(jq -er '.conclusion' <<< "$RUN")" = success
            jq -er '.path' <<< "$RUN" | grep -Fq "$EXPECTED"
          done
          NATIVE_JOBS="$(gh api "repos/osmanosmanov6880-bot/osgard-world/actions/runs/$NATIVE_ID/jobs?per_page=100")"
          jq -e '.jobs[] | select(.name == "actual-godot-explainable-course" and .conclusion == "success")' <<< "$NATIVE_JOBS" >/dev/null
          WEB_ART="$(gh api "repos/osmanosmanov6880-bot/osgard-world/actions/runs/$RUN_ID/artifacts")"
          jq -e --argjson id "$ART_ID" --arg name "$ART_NAME" \
            '.artifacts[] | select(.id == $id and .name == $name and .expired == false)' <<< "$WEB_ART" >/dev/null
          mkdir -p "$RUNNER_TEMP/r135-w21"
          gh run download "$RUN_ID" --repo osmanosmanov6880-bot/osgard-world \
            --name "$ART_NAME" --dir "$RUNNER_TEMP/r135-w21"

      - name: Review exact 15 PNG originals, actual Godot diagnostics and all binary hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/r135-w21-promotion-qa.py \
            --pin scripts/r135-w21-release-pin.json \
            --artifact "$RUNNER_TEMP/r135-w21" | tee "$RUNNER_TEMP/r135-w21-independent.json"

      - name: Immutable archive staging and WebGL actual Nginx HTTP
        shell: bash
        run: |
          set -euo pipefail
          PIN=scripts/r135-w21-release-pin.json
          ROOT="$RUNNER_TEMP/r135-w21/r135-optimized-release"
          python3 scripts/r135-release-stage.py \
            "$ROOT/OSGARD_R135_OPTIMIZED_WEB.zip" \
            "$ROOT/R135_OPTIMIZED_MANIFEST.json" \
            "$RUNNER_TEMP/r135-w21-staged" "$PIN"
          test -s "$RUNNER_TEMP/r135-w21-staged/index.wasm.gz"
          test -s "$RUNNER_TEMP/r135-w21-staged/index.pck"
          export OSGARD_EXPECTED_R135_SOURCE="$(jq -er '.source_commit' "$PIN")"
          export OSGARD_EXPECTED_R135_VERSION="$(jq -er '.version' "$PIN")"
          export OSGARD_EXPECTED_R135_MANIFEST_SHA256="$(jq -er '.manifest_sha256' "$PIN")"
          export OSGARD_REQUIRE_R135_REVALIDATION=1
          bash scripts/r135-nginx-wasm-smoke.sh "$RUNNER_TEMP/r135-w21-staged"

      - name: Store original 15-frame independent review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osgard-r135-w21-original-independent-evidence
          path: "${{ runner.temp }}/r135-w21-independent.json"
          if-no-files-found: warn
          retention-days: 30

  permanently-archive-reviewed-W21:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release/r135-w21-reviewed-artifact-20261025'
    needs: independently-review-exact-W21
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Create immutable non-production W21 Godot WebGL and original image package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PIN=scripts/r135-w21-release-pin.json
          TAG=r135-player-settings-w21-reviewed-webgl-20261025
          if gh release view "$TAG" --repo osmanosmanov6880-bot/osgard-world >/dev/null 2>&1; then
            echo 'Already exists: immutable W21 tag is not overwritten' >&2
            exit 1
          fi
          SOURCE="$(jq -er '.source_commit' "$PIN")"
          RUN_ID="$(jq -er '.artifact_run_id' "$PIN")"
          mkdir -p "$RUNNER_TEMP/w21-archive"
          gh run download "$RUN_ID" --repo osmanosmanov6880-bot/osgard-world \
            --name osgard-r135-optimized-web-qa --dir "$RUNNER_TEMP/w21-archive"
          ROOT="$RUNNER_TEMP/w21-archive"
          python3 scripts/r135-w21-promotion-qa.py --pin "$PIN" --artifact "$ROOT"
          cd "$ROOT"
          zip -qr9 W21_ORIGINAL_SCREENSHOTS_AND_GAMEPLAY_EVIDENCE.zip \
            r135-screens r135-w10-release-evidence.json
          gh release create "$TAG" \
            "$ROOT/r135-optimized-release/OSGARD_R135_OPTIMIZED_WEB.zip" \
            "$ROOT/r135-optimized-release/R135_OPTIMIZED_MANIFEST.json" \
            "$ROOT/W21_ORIGINAL_SCREENSHOTS_AND_GAMEPLAY_EVIDENCE.zip" \
            --repo osmanosmanov6880-bot/osgard-world \
            --target "$SOURCE" --latest=false \
            --title "OSGARD R135 W21 — exact-source real player settings Godot WebGL" \
            --notes "Independent pinned 15-original-frame Godot native and desktop/mobile software WebGL release. NOT automatically promoted. Physical-phone GPU and AAA photorealism remain unverified."
