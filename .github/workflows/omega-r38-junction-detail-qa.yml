name: EMPIRE Omega R38 actual street junction geometry QA
on:
  pull_request:
    branches: [master, 'feat/omega-r37-actual-pbr-masonry']
    paths:
      - 'godot/empire-omega/scripts/horizon_intersection_details.gd'
      - 'godot/empire-omega/scripts/horizon_roadscape.gd'
      - 'godot/empire-omega/scripts/world_builder.gd'
      - 'godot/empire-omega/tests/v61_r38_street_infrastructure.gd'
      - '.github/workflows/omega-r38-junction-detail-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic-junction-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import authentic Godot game and audio
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          godot --headless --editor --path godot/empire-omega --import --quit
      - name: Genuine world, R35 balcony, R37 material, R38 corner test
        shell: bash
        run: |
          set -euo pipefail
          for suite in v48_city_polish v53_rain_puddles_city_cleanup v55_r33_four_wheel_wet_night_beams v57_r35_street_facade_depth v58_r37_real_facade_material_pack v61_r38_street_infrastructure; do
            timeout --signal=TERM --kill-after=5s 125s godot --headless --path godot/empire-omega --script "res://tests/$suite.gd"
          done
