name: NEBULA R37 offline hardware report quality gate

on:
  pull_request:
    paths:
      - "public/games/remix/arena-v2/nebula-3d/performance-report.html"
      - "scripts/test-nebula-r37-performance-reports.mjs"
      - "scripts/nebula-r40-field-release-gate.mjs"
      - "scripts/nebula-r40-device-progress.mjs"
      - "docs/nebula/R40-DEVICE-FIELD-MANIFEST.example.json"
      - ".github/workflows/nebula-r37-performance-reports.yml"
  push:
    branches: [master]
    paths:
      - "public/games/remix/arena-v2/nebula-3d/performance-report.html"
      - "scripts/test-nebula-r37-performance-reports.mjs"
      - "scripts/nebula-r40-field-release-gate.mjs"
      - "scripts/nebula-r40-device-progress.mjs"
      - "docs/nebula/R40-DEVICE-FIELD-MANIFEST.example.json"
      - ".github/workflows/nebula-r37-performance-reports.yml"

permissions:
  contents: read

concurrency:
  group: nebula-r37-reports-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  report-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test shipped offline HTML against synthetic CI fixtures
        run: |
          set -euo pipefail
          node scripts/test-nebula-r37-performance-reports.mjs
      - name: Verify real-device evidence checker refuses empty manifests
        run: |
          set -euo pipefail
          node --check scripts/nebula-r40-field-release-gate.mjs
          node scripts/nebula-r40-field-release-gate.mjs --selftest
          if node scripts/nebula-r40-field-release-gate.mjs docs/nebula/R40-DEVICE-FIELD-MANIFEST.example.json; then
            echo "Empty hardware matrix must never be approved" >&2
            exit 1
          fi
      - name: Inventory the empty device QA template without false release approval
        run: |
          set -euo pipefail
          node --check scripts/nebula-r40-device-progress.mjs
          node scripts/nebula-r40-device-progress.mjs > /tmp/nebula-r40-progress.json
          node -e "const q=require('/tmp/nebula-r40-progress.json');if(q.expected_json!==108||q.found_json!==0||q.expected_screenshots!==12||q.found_screenshots!==0||q.field_work_declared!==false||q.status!=='TRACKING_ONLY_NOT_A_RELEASE_APPROVAL')process.exit(1);console.log('NEBULA_R40_INCOMPLETE_FIELD_MATRIX_EXPECTED_108_JSON_12_IMAGES')"
      - name: Ensure deployed viewer does not need external assets
        run: |
          set -euo pipefail
          file="public/games/remix/arena-v2/nebula-3d/performance-report.html"
          test -s "$file"
          grep -Fq 'nebula-r37-comparator' "$file"
          grep -Fq 'NEBULA / PERFORMANCE LAB' "$file"
          grep -Fq 'Выбрать JSON-отчёты' "$file"
          if grep -Eqi '<script[^>]*src=|<link[^>]*href="https?://' "$file"; then
            echo 'Unexpected external asset; comparator must be self-contained' >&2
            exit 1
          fi
