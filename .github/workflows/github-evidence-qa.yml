name: OSGARD verified release evidence
on:
  pull_request:
    paths:
      - 'scripts/verify-github-release-evidence.py'
      - 'tests/test_github_release_evidence.py'
      - 'docs/GITHUB-RELEASE-EVIDENCE.md'
      - '.github/workflows/github-evidence-qa.yml'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/verify-github-release-evidence.py tests/test_github_release_evidence.py
      - run: python -m unittest discover -s tests -p test_github_release_evidence.py -v
