name: LAST FRONTIER W66 original AAA visual-direction Godot review HOLD
on:
  pull_request:
    branches:
      - experiment/last-frontier-w65-sound-story-20261028
permissions:
  contents: read
jobs:
  native-art-and-original-game:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and W65 protected gameplay
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          python3 - <<'PY'
          import os,subprocess
          base=os.environ['BASE']
          head=os.environ['HEAD']
          assert subprocess.check_output(['git','merge-base',base,head],text=True).strip()==base
          changed=set(subprocess.check_output(['git','diff','--name-only',base,head],text=True).splitlines())
          allowed={'w63-a7-cascade/scripts/A7ArchitecturalDetail.gd','w63-a7-cascade/scripts/A7CinematicHud.gd','w63-a7-cascade/scripts/A7CinematicStage.gd','w63-a7-cascade/scripts/A7CascadeScreen.gd','.github/workflows/last-frontier-w66-visual.yml','docs/LAST_FRONTIER_W66_ART_DIRECTION.md'}
          assert changed==allowed,(changed-allowed,allowed-changed)
          for path in ['w63-a7-cascade/scripts/A7CascadeCore.gd','w63-a7-cascade/tests/test_a7_cascade.gd','w63-a7-cascade/tests/test_w64_real_3d_stage.gd','w63-a7-cascade/tests/test_w65_story_audio.gd']:
              def sha(ref):return subprocess.check_output(['git','rev-parse',ref+':'+path],text=True).strip()
              assert sha(base)==sha(head),path
          print('PASS: exact W65 gameplay and tests preserved')
          PY
          git diff --check "$BASE" "$HEAD"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Import and native scene regressions
        run: |
          set -euo pipefail
          mkdir -p w66-evidence
          godot --headless --editor --path w63-a7-cascade --import --quit 2>&1 | tee w66-evidence/import.log
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' w66-evidence/import.log; then exit 1; fi
          for t in test_a7_cascade test_w64_real_3d_stage test_w65_story_audio; do
            timeout 210s godot --headless --path w63-a7-cascade --script "res://tests/$t.gd" 2>&1 | tee "w66-evidence/$t.log"
            if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "w66-evidence/$t.log"; then exit 1; fi
          done
          grep -q 'LAST FRONTIER W65 ORIGINAL GAME CAUSAL STORY + SYNTH AUDIO PASS:' w66-evidence/test_w65_story_audio.log
      - name: Export native 3D web game
        run: |
          set -euo pipefail
          (cd w63-a7-cascade && mkdir -p build/web && godot --headless --path . --export-release Web build/web/index.html) 2>&1 | tee w66-evidence/web-export.log
          python3 w33-godot-native/ci/verify_web_export.py w63-a7-cascade/build/web --sha "${{ github.event.pull_request.head.sha }}" --output w63-a7-cascade/build/web/evidence.json
      - name: Keep reproducible original WebGL artifact and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-frontier-w66-obsidian-aurora-${{ github.event.pull_request.head.sha }}
          path: |
            w66-evidence/
            w63-a7-cascade/build/web/
          retention-days: 30
          if-no-files-found: warn
