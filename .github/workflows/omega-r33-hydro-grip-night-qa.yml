name: EMPIRE Omega R33 four wheel wet grip and night lights
on:
  pull_request:
    branches: [master, 'feat/omega-r32-cinematic-city-wet-grip']
    paths:
      - 'godot/empire-omega/scripts/horizon_rain_puddles.gd'
      - 'godot/empire-omega/scripts/vehicle_controller.gd'
      - 'godot/empire-omega/scripts/main.gd'
      - 'godot/empire-omega/tests/v55_r33_four_wheel_wet_night_beams.gd'
      - '.github/workflows/omega-r33-hydro-grip-night-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-wheel-physics-and-lighting:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Build authentic resources and import
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          godot --headless --editor --path godot/empire-omega --import --quit
      - name: Run current native engine tests
        shell: bash
        run: |
          set -euo pipefail
          for suite in v21_vehicle_dynamics v29_responsive_layout v41_lighting_grade v44_four_wheel_surface v53_rain_puddles_city_cleanup v54_r32_cinematic_cabinet_wet_grip v55_r33_four_wheel_wet_night_beams; do
            timeout --signal=TERM --kill-after=5s 110s godot --headless --path godot/empire-omega --script "res://tests/$suite.gd"
          done
