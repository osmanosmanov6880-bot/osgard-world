name: OSGARD R135 W16 same-origin Android Safari evidence capture QA
on:
  push:
    branches: [feat/r135-w16-physical-safari-android-capture-20261025]
    paths:
      - 'public/games/r135-device-capture/**'
      - 'scripts/test-r135-w16-mobile-capture.mjs'
      - 'scripts/r135-device-matrix-assemble.mjs'
      - 'nginx.conf'
      - '.github/workflows/r135-w16-physical-capture-ui-qa.yml'
      - 'docs/R135_W16_REAL_DEVICE_CAPTURE_RUNBOOK.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-capture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse same-origin browser UI, exact-W18 raw capture and offline matrix assembler
        shell: bash
        run: |
          set -euo pipefail
          node --check public/games/r135-device-capture/device-capture.js
          node --check public/games/r135-device-capture/device-capture-ui.js
          node --check scripts/r135-device-matrix-assemble.mjs
          node --check scripts/test-r135-w16-mobile-capture.mjs
          node scripts/test-r135-w16-mobile-capture.mjs
          grep -Fq 'src="./device-capture-ui.js"' public/games/r135-device-capture/index.html
          grep -Fq 'href="./styles.css"' public/games/r135-device-capture/index.html
          grep -Fq "frame-src 'self'" nginx.conf
          ! grep -Eq '<script[^>]*>[[:space:]]*import ' public/games/r135-device-capture/index.html
          echo 'PASS: these are synthetic UI schema tests, not hardware, GPS, GPU, thermal or iOS certification.'

      - name: Confirm Vite actually includes source files for same-origin mobile devices
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -s dist/games/r135-device-capture/index.html
          test -s dist/games/r135-device-capture/device-capture.js
          test -s dist/games/r135-device-capture/device-capture-ui.js
          test -s dist/games/r135-device-capture/styles.css
          grep -Fq '/games/r135-service/' dist/games/r135-device-capture/index.html
          echo 'PASS: static capture UI is included in deployed file tree, no public deployment from this job.'
