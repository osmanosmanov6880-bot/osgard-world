name: ZION-030 focused gameplay acceptance

on:
  pull_request:
    paths:
      - 'public/games/zion-9/queue/ZION-030/**'
      - 'scripts/zion-*.mjs'
      - 'playwright.ecosystem.config.mjs'
      - '.github/workflows/zion-v29-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zion-desktop-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify authoritative cooling puzzle and v28/v29 open-world rules
        run: npm run qa:zion-local
      - name: Build the actual release site
        run: npm run build
      - name: Include static game assets required by preview
        run: cp -a public/games/. dist/games/
      - name: Install browser tooling with Chrome-first fallback
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "OSGARD_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
            echo "Using preinstalled Google Chrome for browser acceptance"
          else
            npx playwright install --with-deps --no-shell chromium
          fi
      - name: Verify ZION-030 desktop and mobile gameplay only
        run: npx playwright test --config playwright.ecosystem.config.mjs --grep 'ZION' --workers=2
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zion-focused-browser-evidence
          path: |
            browser-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
