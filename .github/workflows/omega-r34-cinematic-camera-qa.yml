name: EMPIRE Omega R34 cinematic city governance native acceptance
on:
  pull_request:
    branches: [master, 'feat/omega-r33-four-wheel-wetness-night-lights']
    paths:
      - 'godot/empire-omega/scripts/horizon_camera_collision.gd'
      - 'godot/empire-omega/scripts/main.gd'
      - 'godot/empire-omega/tests/v56_r34_cinematic_cabinet_camera.gd'
      - '.github/workflows/omega-r34-cinematic-camera-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic-camera-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Create original audio and import world in Godot
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          godot --headless --editor --path godot/empire-omega --import --quit
      - name: Verify camera, city, and wheel physics in native Godot
        shell: bash
        run: |
          set -euo pipefail
          for suite in v21_vehicle_dynamics v29_responsive_layout v38_adaptive_graphics v43_camera_composition v44_four_wheel_surface v54_r32_cinematic_cabinet_wet_grip v55_r33_four_wheel_wet_night_beams v56_r34_cinematic_cabinet_camera; do
            timeout --signal=TERM --kill-after=5s 110s godot --headless --path godot/empire-omega --script "res://tests/$suite.gd"
          done
