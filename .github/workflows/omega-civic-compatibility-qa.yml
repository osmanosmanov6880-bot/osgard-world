name: OSGARD Omega current civic gateway compatibility QA
on:
  pull_request:
    branches: [master]
    paths:
      - "godot/empire-omega/tests/v24_horizon_character_and_hall.gd"
      - "godot/empire-omega/scripts/horizon_civic_gateway.gd"
      - ".github/workflows/omega-civic-compatibility-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-city-godot:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Prepare official game resource imports
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          godot --headless --editor --path godot/empire-omega --import --quit
      - name: Validate actual player, modern cityhall and mobile car controls
        shell: bash
        run: |
          set -euo pipefail
          for t in v24_horizon_character_and_hall v52_civic_pbr_gateway v34_real_touch_drive; do
            timeout --signal=TERM --kill-after=5s 95s godot --headless --path godot/empire-omega --script "res://tests/$t.gd"
          done
