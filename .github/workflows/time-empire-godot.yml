name: TIME EMPIRE Chronos City native Godot validation

on:
  pull_request:
    paths:
      - 'godot/time-empire/**'
      - '.github/workflows/time-empire-godot.yml'
  push:
    branches:
      - 'feat/time-empire-chronos*'
    paths:
      - 'godot/time-empire/**'
      - '.github/workflows/time-empire-godot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 with Web templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Generate authored Chronos reactor and skyline glTF PBR models
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check -q numpy==2.3.5 Pillow==12.3.0 trimesh==4.11.1
          python3 scripts/build_osgard_wave4_assets.py --project time-empire
          python3 scripts/validate_wave4_assets.py --project time-empire
          python3 scripts/build_osgard_wave5_environment.py --project time-empire
          python3 scripts/validate_osgard_wave5.py --project time-empire
          python3 scripts/build_osgard_wave6_materials.py --project time-empire
          python3 scripts/validate_osgard_wave6.py --project time-empire
          python3 scripts/build_osgard_wave8_materials.py --project time-empire
          python3 scripts/validate_osgard_wave8_materials.py --project time-empire
      - name: Import Godot city scene
        run: godot --headless --rendering-method gl_compatibility --editor --path godot/time-empire --import --quit
      - name: Validate city, economy, UI, save and load
        run: godot --headless --rendering-method gl_compatibility --path godot/time-empire --script res://tests/runtime_smoke.gd
      - name: Validate Wave 5 city, performance telemetry and cinematic materials
        run: godot --headless --rendering-method gl_compatibility --path godot/time-empire --script res://tests/wave5_smoke.gd
      - name: Verify Wave6 detailed geometry, materials and gameplay compatibility
        run: godot --headless --rendering-method gl_compatibility --path godot/time-empire --script res://tests/wave6_smoke.gd
      - name: Verify Wave 7 authored geometry, living environment and preserved gameplay
        run: godot --headless --rendering-method gl_compatibility --path godot/time-empire --script res://tests/wave7_smoke.gd
      - name: Verify Wave 8 professional surfaces, animation and gameplay
        run: godot --headless --rendering-method gl_compatibility --path godot/time-empire --script res://tests/wave8_smoke.gd
      - name: Verify Wave 9 hero geometry, optimized detail and gameplay
        run: godot --headless --rendering-method gl_compatibility --path godot/time-empire --script res://tests/wave9_smoke.gd
      - name: Validate Wave10 clustered forest, urban lighting and construction cinematic
        run: godot --headless --rendering-method gl_compatibility --path godot/time-empire --script res://tests/wave10_smoke.gd
      - name: Export playable Godot Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/time-empire/.build-web
          godot --headless --rendering-method gl_compatibility --path godot/time-empire --export-release Web "$GITHUB_WORKSPACE/godot/time-empire/.build-web/index.html"
          ls -lah godot/time-empire/.build-web
          python3 - <<'PYCODE'
          from pathlib import Path
          folder = Path('godot/time-empire/.build-web')
          for ext in ('.html', '.js', '.wasm', '.pck'):
              files = sorted(folder.glob('*' + ext))
              assert files and all(f.stat().st_size > 0 for f in files), f'Incomplete Web export: {ext}'
              for f in files:
                  print(f'PASS {f.name}: {f.stat().st_size:,} bytes')
          assert next(folder.glob('*.wasm')).open('rb').read(4) == b'\x00asm'
          PYCODE
      - name: Capture actual native 3D city screenshot (optional renderer QA)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          command -v xvfb-run
          timeout 90s xvfb-run -a -s "-screen 0 1600x900x24" godot --rendering-method gl_compatibility --path godot/time-empire --script res://tests/capture.gd
          test -s godot/time-empire/screenshots-ci/time-empire-chronos-city-native.png
      - name: CI software renderer performance sample (not real GPU certification)
        shell: bash
        continue-on-error: true
        run: |
          timeout 120s xvfb-run -a -s "-screen 0 1280x720x24" godot --rendering-method gl_compatibility --path godot/time-empire --script res://tests/wave5_perf_ci.gd
      - name: Attach CI rendering measurements separately from hardware QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-empire-wave5-ci-performance-not-hardware
          path: godot/time-empire/benchmark-ci/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Attach real native scene screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-empire-chronos-city-native-render
          path: godot/time-empire/screenshots-ci/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Reproducible Wave6 software renderer benchmark (not hardware certification)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/time-empire/benchmark-wave6
          timeout 160s xvfb-run -a -s "-screen 0 1280x720x24" godot --rendering-method gl_compatibility --path godot/time-empire -- --w6-benchmark --w6-duration=6 --w6-warmup=2 --w6-resolution=1280x720 --w6-profile=balanced "--w6-output=$GITHUB_WORKSPACE/godot/time-empire/benchmark-wave6/ci.json"
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          f=Path("godot/time-empire/benchmark-wave6/ci.json")
          assert f.is_file(), "Benchmark JSON not written"
          j=json.loads(f.read_text())
          assert j["frames"] >= 5 and j["measurement_seconds"] >= 4, j
          assert j["rendering_method"] == "gl_compatibility", j
          print("PASS WAVE6 CI SOFTWARE MEASURE:",j["adapter"],j["mean_fps"],j["p95_frame_ms"])
          PYCODE
      - name: Attach Wave6 CI sample labelled as non-hardware
        uses: actions/upload-artifact@v4
        with:
          name: time-empire-wave6-ci-software-benchmark
          path: godot/time-empire/benchmark-wave6/ci.json
          if-no-files-found: error
          retention-days: 14
      - name: Attach playable Web build for approval; do not touch production
        uses: actions/upload-artifact@v4
        with:
          name: time-empire-chronos-city-web
          path: godot/time-empire/.build-web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Export Windows native PC Ultra executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/time-empire/.build-windows
          godot --headless --rendering-method gl_compatibility --path godot/time-empire --export-release "Windows Desktop" "$GITHUB_WORKSPACE/godot/time-empire/.build-windows/OSGARD_CHRONOS_CITY_PC_ULTRA.exe"
          python3 - <<'VERIFYEXE'
          from pathlib import Path
          directory = Path("godot/time-empire/.build-windows")
          exe = directory / "OSGARD_CHRONOS_CITY_PC_ULTRA.exe"
          pack = exe.with_suffix(".pck")
          assert exe.exists() and exe.stat().st_size > 100000, "Missing Windows executable"
          assert exe.open("rb").read(2) == b"MZ", "Not a Windows PE executable"
          assert pack.exists() and pack.stat().st_size > 100000, "Missing Godot PCK game resources"
          print("PASS WINDOWS PC ULTRA:", exe.stat().st_size, pack.stat().st_size)
          VERIFYEXE
      - name: Package Windows hardware test instructions
        run: |
          cp tools/VERIFY_WINDOWS_GPU_RU.cmd godot/time-empire/.build-windows/
          cp tools/TEST_GPU_WINDOWS_RU.cmd godot/time-empire/.build-windows/
          cp tools/TEST_GPU_WAVE7_ALL.cmd godot/time-empire/.build-windows/
          cp scripts/check_osgard_wave8_gpu_reports.py godot/time-empire/.build-windows/
          cp tools/CERTIFY_GPU_WAVE7.ps1 godot/time-empire/.build-windows/
      - name: Attach independent Windows PC Ultra build
        uses: actions/upload-artifact@v4
        with:
          name: time-empire-chronos-windows-pc-ultra
          path: godot/time-empire/.build-windows/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Archive exact native Godot sources at this validated commit
        uses: actions/upload-artifact@v4
        with:
          name: time-empire-cinematic-source
          path: |
            godot/time-empire/project.godot
            godot/time-empire/export_presets.cfg
            godot/time-empire/scenes/
            godot/time-empire/scripts/
            godot/time-empire/tests/
            docs/games/OSGARD_WAVE7_RELEASE_RU.md
            tools/TEST_GPU_WAVE7_ALL.cmd
            tools/CERTIFY_GPU_WAVE7.ps1
            godot/time-empire/README.md
            godot/time-empire/assets/wave4/
            godot/time-empire/assets/wave5/
            godot/time-empire/assets/wave6/
            godot/time-empire/assets/wave8/
            scripts/build_osgard_wave8_materials.py
            scripts/validate_osgard_wave8_materials.py
            scripts/check_osgard_wave8_gpu_reports.py
            docs/games/OSGARD_WAVE8_RELEASE_RU.md
            scripts/build_osgard_wave6_materials.py
            scripts/validate_osgard_wave6.py
            tools/TEST_GPU_WINDOWS_RU.cmd
            docs/games/OSGARD_WAVE6_README_RU.md
            scripts/build_osgard_wave5_environment.py
            scripts/validate_osgard_wave5.py
            docs/games/OSGARD_WAVE5_RELEASE_AND_GPU_QA_RU.md
            tools/VERIFY_WINDOWS_GPU_RU.cmd
            scripts/build_osgard_wave4_assets.py
            scripts/validate_wave4_assets.py
          if-no-files-found: error
          retention-days: 14
