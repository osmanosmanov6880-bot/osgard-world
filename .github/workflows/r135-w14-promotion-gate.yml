name: OSGARD R135 W14 exact archive promotion gate
on:
  push:
    branches: [release/r135-w14-sha-pinned-publication-20261025]
    paths:
      - ".github/workflows/r135-w14-promotion-gate.yml"
      - ".github/workflows/deploy-frontend.yml"
      - "scripts/r135-w14-release-pin.json"
      - "scripts/r135-w14-promotion-qa.py"
      - "scripts/r135-release-stage.py"
      - "scripts/r135-verified-live-recover.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate-reviewed-r135-w14:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download exactly the independently reviewed W14 Godot candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PIN=scripts/r135-w14-release-pin.json
          RUN_ID="$(jq -er '.artifact_run_id' "$PIN")"
          ART_NAME="$(jq -er '.artifact_name' "$PIN")"
          test "$RUN_ID" = 40175524463
          test "$ART_NAME" = osgard-r135-optimized-web-qa
          mkdir -p "$RUNNER_TEMP/r135-w14-artifact"
          gh run download "$RUN_ID" \
            --repo osmanosmanov6880-bot/osgard-world \
            --name "$ART_NAME" --dir "$RUNNER_TEMP/r135-w14-artifact"

      - name: Verify independent ZIP and manifest hashes, native proof and three actual faults
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/r135-w14-promotion-qa.py \
            --pin scripts/r135-w14-release-pin.json \
            --artifact "$RUNNER_TEMP/r135-w14-artifact" \
            | tee "$RUNNER_TEMP/r135-w14-promotion-evidence.json"

      - name: Stage all nine genuine Godot binaries and reject unauthorized archive contents
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/r135-w14-artifact/r135-optimized-release"
          python3 scripts/r135-release-stage.py \
            "$ROOT/OSGARD_R135_OPTIMIZED_WEB.zip" \
            "$ROOT/R135_OPTIMIZED_MANIFEST.json" \
            "$RUNNER_TEMP/r135-w14-staged" scripts/r135-w14-release-pin.json
          test -s "$RUNNER_TEMP/r135-w14-staged/index.pck"
          test -s "$RUNNER_TEMP/r135-w14-staged/index.wasm.gz"

      - name: Independently reject dark or unreadable R135 real WebGL scenes
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: W11-and-later real screenshot luminance regression gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "Pillow==11.3.0"
          python3 scripts/r135-w11-readability-qa.py \
            --portrait "$RUNNER_TEMP/r135-w14-artifact/r135-screens/w6-portrait-optical-active.png" \
            --desktop "$RUNNER_TEMP/r135-w14-artifact/r135-screens/desktop-1366.png" \
            --output "$RUNNER_TEMP/r135-w14-readability-evidence.json"

      - name: Verify actual production Nginx WASM MIME, gzip transfer and PCK HTTP 206
        shell: bash
        run: |
          set -euo pipefail
          export OSGARD_EXPECTED_R135_SOURCE="$(jq -er '.source_commit' scripts/r135-w14-release-pin.json)"
          export OSGARD_EXPECTED_R135_VERSION="$(jq -er '.version' scripts/r135-w14-release-pin.json)"
          export OSGARD_EXPECTED_R135_MANIFEST_SHA256="$(jq -er '.manifest_sha256' scripts/r135-w14-release-pin.json)"
          export OSGARD_REQUIRE_R135_REVALIDATION=1
          bash scripts/r135-nginx-wasm-smoke.sh "$RUNNER_TEMP/r135-w14-staged"

      - name: Exercise byte-for-byte W14 recovery from a local HTTP fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/r135-verified-live-recover.py
          python3 -m http.server 8876 --bind 127.0.0.1 \
            --directory "$RUNNER_TEMP/r135-w14-staged" > /tmp/r135-w14-local-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for n in $(seq 1 25); do
            if curl --max-time 2 -fsS http://127.0.0.1:8876/release.json -o /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/r135-verified-live-recover.py \
            --pin scripts/r135-w14-release-pin.json \
            --target "$RUNNER_TEMP/r135-w14-recovered" \
            --base-url http://127.0.0.1:8876/
          python3 scripts/r135-release-stage.py \
            "$RUNNER_TEMP/r135-w14-recovered/OSGARD_R135_OPTIMIZED_WEB.zip" \
            "$RUNNER_TEMP/r135-w14-recovered/R135_OPTIMIZED_MANIFEST.json" \
            "$RUNNER_TEMP/r135-w14-recovered-stage" scripts/r135-w14-release-pin.json

      - name: Store reproducible prepublication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r135-w14-prepublication-evidence
          path: |
            ${{ runner.temp }}/r135-w14-promotion-evidence.json
            ${{ runner.temp }}/r135-w14-readability-evidence.json
          retention-days: 30
          if-no-files-found: warn
