name: EMPIRE Omega real published desktop WebGL compositor and driving gate
on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/omega-browser-evidence.mjs'
      - 'scripts/omega-browser-evidence.contract.test.mjs'
      - 'scripts/omega-live-webgl.spec.mjs'
      - '.github/workflows/omega-authentic-desktop-after-ssh-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omega-live-desktop-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  published-desktop-real-driving:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify original source-SHA and fail-closed real-pixel contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/omega-browser-evidence.mjs
          node --check scripts/omega-live-webgl.spec.mjs
          node --test scripts/omega-browser-evidence.contract.test.mjs
          python3 scripts/omega-live-integrity.py --self-test
      - name: Independently re-download seven published Godot assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/omega-live-integrity.py \
            --expected public/games/omega-3d-preview/release.json \
            --base https://osgard.world/games/omega-3d-preview \
            --nonce "${{ github.run_id }}" | tee /tmp/omega-desktop-public-hashes.json
      - name: Install real headless Chromium and PNG decoding
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.58.2 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Drive authentic published Godot 1366x768 desktop and capture real pixels
        shell: bash
        env:
          OSGARD_GAME_ORIGIN: https://osgard.world
        run: |
          set -euo pipefail
          npx playwright test \
            --config playwright.omega-live-webgl.config.mjs \
            --project=desktop-chromium
      - name: Preserve authentic desktop rendering, keyboard-drive and integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-independent-real-desktop-${{ github.run_id }}
          path: |
            /tmp/omega-desktop-public-hashes.json
            omega-live-webgl-results/
            omega-live-webgl-report/
          if-no-files-found: warn
          retention-days: 14
