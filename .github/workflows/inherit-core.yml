name: INHERIT Core Lineage
on:
  pull_request:
    paths:
      - server/core_server.py
      - server/core_inherit.py
      - tests/test_inherit_core.py
      - .github/workflows/inherit-core.yml
  push:
    branches: [master, feat/inherit-core-lineage-20261017]
    paths:
      - server/core_server.py
      - server/core_inherit.py
      - tests/test_inherit_core.py
      - .github/workflows/inherit-core.yml
  workflow_dispatch:
jobs:
  lineage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Core and lineage
        run: python -m py_compile server/core_server.py server/core_inherit.py
      - name: Real HTTP and SQLite regression
        run: python -m unittest discover -s tests -p 'test_inherit_core.py' -v
