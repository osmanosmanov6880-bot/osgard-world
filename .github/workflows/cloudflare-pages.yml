name: OSGARD Cloudflare Pages

on:
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "public/**"
      - "godot/null-shift/**"
      - "scripts/sync-swarm-assets.mjs"
      - "scripts/null-shift-godot-smoke.mjs"
      - "scripts/osa-media-release-preflight.mjs"
      - "scripts/osa-media-file-audit.mjs"
      - "scripts/precompress-brand-transition.mjs"
      - "scripts/osa-narration-readiness.mjs"
      - "docs/OSA_TTS_PRODUCTION_PLAN.md"
      - "docs/osa-narration/**"
      - "docs/OSA_MEDIA_RELEASE_PIPELINE.md"
      - "scripts/cloudflare-pages-preflight.mjs"
      - "scripts/compress-pages-wasm.mjs"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-pages.yml"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "public/**"
      - "godot/null-shift/**"
      - "scripts/sync-swarm-assets.mjs"
      - "scripts/null-shift-godot-smoke.mjs"
      - "scripts/cloudflare-pages-preflight.mjs"
      - "scripts/compress-pages-wasm.mjs"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy static assets to a Pages preview or production branch"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate the Godot Web export contract
        run: npm run qa:null-shift-godot
      - name: Verify unified OSA learning progress persistence
        run: npm run qa:osa-progress
      - name: Install official Godot 4.7.2 engine and web templates
        run: |
          set -euo pipefail
          mkdir -p /tmp/osgard-godot "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/osgard-godot/engine.zip
          unzip -q /tmp/osgard-godot/engine.zip -d /tmp/osgard-godot/
          curl -L --fail --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o /tmp/osgard-godot/templates.tpz
          mkdir -p /tmp/osgard-godot/unpacked-templates
          unzip -q /tmp/osgard-godot/templates.tpz -d /tmp/osgard-godot/unpacked-templates
          cp -a /tmp/osgard-godot/unpacked-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Verify Godot installation
        run: |
          chmod +x /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64 --version
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip"
      - name: Import and parse the Godot project
        run: /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path godot/null-shift --quit
      - name: Runtime-smoke gameplay state transitions in headless Godot
        run: |
          set -euo pipefail
          timeout 120s /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/null-shift --script res://tests/runtime_smoke.gd 2>&1 | tee /tmp/null-shift-godot-runtime.log
          ! grep -E 'SCRIPT ERROR:|Parse Error:|RUNTIME_SMOKE_FAILURE:' /tmp/null-shift-godot-runtime.log
      - name: Export Godot Web game
        run: |
          mkdir -p public/games/null-shift-godot
          /tmp/osgard-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/null-shift --export-release Web "$GITHUB_WORKSPACE/public/games/null-shift-godot/index.html"
          node scripts/null-shift-godot-smoke.mjs --export-check public/games/null-shift-godot
      - name: Build the static frontend
        run: npm run build
      - name: Verify precompressed shared-brand JavaScript
        run: npm run qa:brand-gzip
      - name: Verify OSA media inventory and publication gate
        run: npm run qa:osa-media-release
      - name: Test local original-file verification gate
        run: npm run qa:osa-media-files
      - name: Verify bilingual OSA narration sources and estimate TTS cost
        run: npm run qa:osa-narration
      - name: Package Godot WASM under the Pages asset limit
        run: node scripts/compress-pages-wasm.mjs dist
      - name: Check Cloudflare Pages artifact and limits
        run: npm run qa:cloudflare-pages
      - name: Ensure production deploy comes from master
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production') }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master" || {
            echo "Production Pages deployments must be started from master." >&2
            exit 1
          }
      - name: Deploy to Cloudflare Pages
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_TARGET: ${{ github.event_name == 'push' && 'production' || inputs.target }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID GitHub Actions secret." >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN GitHub Actions secret." >&2; exit 1; }
          if [ "$PAGES_TARGET" = "production" ]; then
            DEPLOY_BRANCH="master"
          else
            DEPLOY_BRANCH="cf-preview"
          fi
          npx --yes wrangler@4 pages deploy dist \
            --project-name=osgard-world \
            --branch="$DEPLOY_BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="OSGARD Cloudflare Pages $GITHUB_SHA"
