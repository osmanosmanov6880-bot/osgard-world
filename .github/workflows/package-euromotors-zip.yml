name: Package EUROMOTORS ZIP

on:
  push:
    branches: [master]
    paths:
      - "cloudflare/euromotors/**"
      - ".github/workflows/package-euromotors-zip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create standalone ZIP
        run: |
          cd cloudflare/euromotors
          zip -r ../../EUROMOTORS-Cloudflare-Pages.zip . -x "README.md"
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: EUROMOTORS-Cloudflare-Pages
          path: EUROMOTORS-Cloudflare-Pages.zip
          if-no-files-found: error
          retention-days: 30
