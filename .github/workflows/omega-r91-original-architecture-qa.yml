name: EMPIRE Omega R91 actual Godot skyline architecture acceptance
on:
  pull_request:
    branches:
      - master
      - feat/omega-r90-aaa-reference-first-slice-20261026
    paths:
      - 'godot/empire-omega/scripts/horizon_r90_street_dressing.gd'
      - 'godot/empire-omega/scripts/horizon_r91_skyline_detail.gd'
      - 'godot/empire-omega/tests/v79_r91_original_architecture.gd'
      - '.github/workflows/omega-r91-original-architecture-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-original-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Rebuild exact source with strict importer
        shell: bash
        run: |
          set -euo pipefail
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          bash scripts/omega-strict-godot-import.sh godot/empire-omega
      - name: Confirm actual skyline, unchanged responsive layout and weather grip
        shell: bash
        run: |
          set -euo pipefail
          for suite in v79_r91_original_architecture v29_responsive_layout v54_r32_cinematic_cabinet_wet_grip; do
            timeout --signal=TERM --kill-after=5s 115s godot --headless --path godot/empire-omega --script "res://tests/$suite.gd"
          done
