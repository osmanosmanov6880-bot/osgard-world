name: OSGARD HORIZON R28 civic PBR entrance and native mobile QA
on:
  pull_request:
    branches: [master, feat/horizon-r27-batched-city-streetfronts]
    paths:
      - 'godot/empire-omega/**'
      - '.github/workflows/omega-r28-civic-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omega-r28-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-civic:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import original 3D world and audio
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          godot --headless --editor --path godot/empire-omega --import --quit
      - name: Test real civic materials, building colliders and mobile continuity
        shell: bash
        run: |
          set -euo pipefail
          for test in v23_horizon_visuals v26_horizon_sculpted_visuals v29_responsive_layout v34_real_touch_drive v37_touch_commands v48_city_polish v50_organic_foliage_mobile_focus v51_batched_streetfronts v52_civic_pbr_gateway; do
            timeout --signal=TERM --kill-after=5s 100s godot --headless --path godot/empire-omega --script "res://tests/$test.gd"
          done
