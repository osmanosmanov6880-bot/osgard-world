name: Package ESSENTIA for Cloudflare
on:
  workflow_dispatch:
  push:
    paths:
      - "cloudflare/essentia/**"
      - ".github/workflows/package-essentia.yml"
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create standalone ZIP
        run: cd cloudflare/essentia && zip -r ../../ESSENTIA-Cloudflare.zip . -x "README.md"
      - uses: actions/upload-artifact@v4
        with:
          name: ESSENTIA-Cloudflare
          path: ESSENTIA-Cloudflare.zip
          if-no-files-found: error
          retention-days: 14
