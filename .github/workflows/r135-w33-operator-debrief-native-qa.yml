name: OSGARD W33 native 6-case QA, action debrief, WebGL build and original-byte inspection
on:
  push:
    branches: [master]
    paths:
      - 'w33-godot-native/**'
      - '.github/workflows/r135-w33-operator-debrief-native-qa.yml'
  pull_request:
    paths:
      - 'w33-godot-native/**'
      - '.github/workflows/r135-w33-operator-debrief-native-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w33-native-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  actual-godot-source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out commit is exactly the proposed source SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Real native 3D source import and parse (blocking)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path w33-godot-native --import --quit 2>&1 | tee "$RUNNER_TEMP/w33-import.log"
          # Editor import returns exit=0 even with GDScript parse errors.
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script' "$RUNNER_TEMP/w33-import.log"; then
            echo '::error::Godot import emitted script compilation errors'
            exit 1
          fi
      - name: Six W31-reference cases in actual Godot GDScript (blocking)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s godot --headless --path w33-godot-native --script res://tests/test_six_missions.gd 2>&1 | tee "$RUNNER_TEMP/w33-missions.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/w33-missions.log"; then
            echo '::error::Actual Godot native test emitted engine errors'
            exit 1
          fi
      - name: Real Godot 3D rotor, hatch, camera, bilingual controls and ECO (blocking)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s godot --headless --path w33-godot-native --script res://tests/test_scene_integration.gd 2>&1 | tee "$RUNNER_TEMP/w33-scene.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/w33-scene.log"; then
            echo '::error::Actual Godot native test emitted engine errors'
            exit 1
          fi
      - name: Real Godot session debrief, retry, bounded log, signal MultiMesh and erase confirmation (blocking)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s godot --headless --path w33-godot-native --script res://tests/test_w33_debrief.gd 2>&1 | tee "$RUNNER_TEMP/w33-debrief.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/w33-debrief.log"; then
            echo '::error::Actual Godot native test emitted engine errors'
            exit 1
          fi
      - name: Create real Godot 4.4.1 WebGL export from the same native-tested commit
        shell: bash
        run: |
          set -euo pipefail
          cd w33-godot-native
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee "$RUNNER_TEMP/w33-export.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/w33-export.log"; then
            echo '::error::Native Godot Web export emitted engine errors'
            exit 1
          fi
      - name: Verify actual Godot generated HTML, JS, WASM and PCK bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 w33-godot-native/ci/verify_web_export.py \
            w33-godot-native/build/web \
            --sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output w33-godot-native/build/web/evidence.json
      - name: Install pinned Chromium for actual exported Godot WebGL
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile w33-godot-native/ci/browser_webgl_smoke.py
          python3 -m venv "$RUNNER_TEMP/w33-qa-venv"
          "$RUNNER_TEMP/w33-qa-venv/bin/pip" install --disable-pip-version-check --no-cache-dir playwright==1.56.0 Pillow==11.3.0
          "$RUNNER_TEMP/w33-qa-venv/bin/python" -m playwright install --with-deps chromium
      - name: Actually render same Godot WebGL export in desktop and mobile-emulated Chromium
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/w33-qa-venv/bin/python" w33-godot-native/ci/browser_webgl_smoke.py \
            --export w33-godot-native/build/web \
            --evidence w33-godot-native/build/browser-evidence \
            --sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Retain original browser screenshots for diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osgard-w33-original-browser-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: w33-godot-native/build/browser-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Archive exactly generated candidate (not deployed or certified)
        uses: actions/upload-artifact@v4
        with:
          name: osgard-w33-godot-webgl-${{ github.event.pull_request.head.sha || github.sha }}
          path: w33-godot-native/build/web/
          if-no-files-found: error
          retention-days: 30
      - name: Verify no device/GPU/web deployment certification is inferred
        shell: bash
        run: |
          set -euo pipefail
          test -s w33-godot-native/scripts/OSGARDCore.gd
          test -s w33-godot-native/Main.tscn
          echo 'Native software verification only. Physical iPhone/Android GPU, HDR and AAA are NOT certified.'
