name: OSGARD HORIZON R17 progressive steering and tire load QA
on:
  pull_request:
    branches: [master, feat/horizon-r16-mobile-performance-metrics]
    paths:
      - 'godot/empire-omega/**'
      - '.github/workflows/omega-r17-yaw-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Prepare real original game resources
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          godot --headless --editor --path godot/empire-omega --import --quit
      - name: Regression for powertrain, tires and real multitouch driving
        shell: bash
        run: |
          set -euo pipefail
          for test in v21_vehicle_dynamics v25_horizon_racing v27_driver_assists v34_real_touch_drive v40_yaw_inertia; do
            echo "### Native Godot 4.4.1: $test"
            timeout --signal=TERM --kill-after=5s 80s godot --headless --path godot/empire-omega --script "res://tests/$test.gd"
          done
