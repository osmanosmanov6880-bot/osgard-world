name: EMPIRE Omega R32 real cinematic cabinet and wet driving QA
on:
  pull_request:
    branches: [master]
    paths:
      - 'godot/empire-omega/scripts/hud.gd'
      - 'godot/empire-omega/scripts/main.gd'
      - 'godot/empire-omega/scripts/horizon_responsive_layout.gd'
      - 'godot/empire-omega/scripts/horizon_light_grade.gd'
      - 'godot/empire-omega/scripts/horizon_rain_puddles.gd'
      - 'godot/empire-omega/tests/v54_r32_cinematic_cabinet_wet_grip.gd'
      - '.github/workflows/omega-r32-cinematic-city-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-native-cinematic-and-grip:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Generate authentic assets and import real game
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          godot --headless --editor --path godot/empire-omega --import --quit
      - name: Verify real physics, HUD, daylight and wet contact in Godot
        shell: bash
        run: |
          set -euo pipefail
          for suite in v21_vehicle_dynamics v29_responsive_layout v38_adaptive_graphics v41_lighting_grade v44_four_wheel_surface v53_rain_puddles_city_cleanup v54_r32_cinematic_cabinet_wet_grip; do
            echo "RUN native Godot $suite"
            timeout --signal=TERM --kill-after=5s 105s godot --headless --path godot/empire-omega --script "res://tests/$suite.gd"
          done
