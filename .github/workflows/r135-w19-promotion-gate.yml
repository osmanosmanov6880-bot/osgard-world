name: OSGARD R135 W19 independent exact-artifact and original-frame gate

on:
  push:
    branches:
      - release/r135-w19-independent-gate-20261025
      - release/r135-w19-reviewed-artifact-20261025
    paths:
      - '.github/workflows/r135-w19-promotion-gate.yml'
      - 'scripts/r135-w19-promotion-qa.py'
      - 'scripts/test_r135_w19_promotion_gate.py'
      - 'scripts/r135-w19-release-pin.json'
      - 'scripts/r135-release-stage.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reject-forged-and-incomplete-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Strict negative W19 evidence and QA contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_r135_w19_promotion_gate.py -v
          python3 -m unittest discover -s scripts -p test_r135_w18_promotion_gate.py -v
          python3 -m py_compile scripts/r135-w19-promotion-qa.py scripts/r135-release-stage.py
          bash -n scripts/r135-release-selector.sh
          node scripts/r135-w18-deploy-contract.mjs
          echo 'W19 CONTRACT PASS; actual WebGL and original image review are NOT implied'

  independently-accept-real-w19:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/release/r135-w19-reviewed-artifact-20261025')
    needs: reject-forged-and-incomplete-proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact-source green Godot browser run and unexpired unique artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PIN=scripts/r135-w19-release-pin.json
          test -s "$PIN" || { echo 'HOLD: no independent W19 screenshot/binary review pin'; exit 1; }
          RUN_ID="$(jq -er '.artifact_run_id' "$PIN")"
          ART_ID="$(jq -er '.artifact_id' "$PIN")"
          SOURCE="$(jq -er '.source_commit' "$PIN")"
          ART_NAME="$(jq -er '.artifact_name' "$PIN")"
          test "$ART_NAME" = osgard-r135-optimized-web-qa
          RUN="$(gh api "repos/osmanosmanov6880-bot/osgard-world/actions/runs/$RUN_ID")"
          test "$(jq -er '.head_sha' <<< "$RUN")" = "$SOURCE"
          test "$(jq -er '.conclusion' <<< "$RUN")" = success
          jq -er '.path' <<< "$RUN" | grep -Fq '.github/workflows/r135-web-optimized.yml'
          ART="$(gh api "repos/osmanosmanov6880-bot/osgard-world/actions/runs/$RUN_ID/artifacts")"
          jq -e --argjson id "$ART_ID" --arg name "$ART_NAME" \
            '.artifacts[] | select(.id == $id and .name == $name and .expired == false)' <<< "$ART" >/dev/null
          mkdir -p "$RUNNER_TEMP/r135-w19-artifact"
          gh run download "$RUN_ID" --repo osmanosmanov6880-bot/osgard-world \
            --name "$ART_NAME" --dir "$RUNNER_TEMP/r135-w19-artifact"

      - name: Independently verify true 13 PNGs, 3 simulated faults on 2 viewports and all binary hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/r135-w19-promotion-qa.py \
            --pin scripts/r135-w19-release-pin.json \
            --artifact "$RUNNER_TEMP/r135-w19-artifact" \
            | tee "$RUNNER_TEMP/r135-w19-evidence.json"

      - name: Stage reviewed actual Godot release and reject unsafe ZIP entries
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/r135-w19-artifact/r135-optimized-release"
          python3 scripts/r135-release-stage.py \
            "$ROOT/OSGARD_R135_OPTIMIZED_WEB.zip" \
            "$ROOT/R135_OPTIMIZED_MANIFEST.json" \
            "$RUNNER_TEMP/r135-w19-staged" \
            scripts/r135-w19-release-pin.json
          test -s "$RUNNER_TEMP/r135-w19-staged/index.wasm.gz"
          test -s "$RUNNER_TEMP/r135-w19-staged/index.pck"

      - name: Validate original screenshot luminance and production Nginx byte-serving
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/r135-w11-readability-qa.py \
            --portrait "$RUNNER_TEMP/r135-w19-artifact/r135-screens/w6-portrait-optical-active.png" \
            --desktop "$RUNNER_TEMP/r135-w19-artifact/r135-screens/desktop-1366.png" \
            --output "$RUNNER_TEMP/r135-w19-luminance.json"
          export OSGARD_EXPECTED_R135_SOURCE="$(jq -er '.source_commit' scripts/r135-w19-release-pin.json)"
          export OSGARD_EXPECTED_R135_VERSION="$(jq -er '.version' scripts/r135-w19-release-pin.json)"
          export OSGARD_EXPECTED_R135_MANIFEST_SHA256="$(jq -er '.manifest_sha256' scripts/r135-w19-release-pin.json)"
          export OSGARD_REQUIRE_R135_REVALIDATION=1
          bash scripts/r135-nginx-wasm-smoke.sh "$RUNNER_TEMP/r135-w19-staged"

      - name: Retain independent W19 acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osgard-r135-w19-independent-evidence
          path: |
            ${{ runner.temp }}/r135-w19-evidence.json
            ${{ runner.temp }}/r135-w19-luminance.json
          if-no-files-found: warn
          retention-days: 30
