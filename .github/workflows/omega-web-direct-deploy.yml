# OSGARD HORIZON R4: publish fully tested original native 3D web assets over SSH with SHA-256 verification.
# HORIZON R3.1: activate checksum-verified Godot Web build with smoothed PBR asphalt and drift physics.
# HORIZON DRIVE Release R2: includes native-tested updated civic architecture and player silhouette.
# Release: HORIZON DRIVE - SHA-verified original PBR coupe and GPU-instanced scenic Godot 4.4.1 Web export.
# Release activation: verified OSGARD AURORA CITY native UI and daylight build.
name: OSGARD Omega verified Godot direct SSH deploy

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/omega-web-direct-deploy.yml"
      - "scripts/omega-build-freshness.py"
  workflow_dispatch:
  # The exporter commits its checksum-verified Godot files using GITHUB_TOKEN.
  # Such commits do NOT trigger push workflows; use workflow_run to activate
  # the actual game without waiting for unrelated frontend product deployments.
  workflow_run:
    workflows: ["OSGARD frontend deploy", "OSGARD Empire Omega native Godot Web"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: osgard-omega-direct-ssh
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reject superseded Godot source BEFORE any SSH or file upload
        id: source_gate
        shell: bash
        run: |
          set -euo pipefail
          manifest_source="$(python3 -c 'import json; print(json.load(open("public/games/omega-3d-preview/release.json"))["source_commit"])')"
          if ! [[ "$manifest_source" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid game release source SHA"; exit 1
          fi
          git fetch --no-tags --depth=1 origin "+refs/heads/master:refs/remotes/origin/master"
          git fetch --no-tags --depth=1 origin "$manifest_source"
          if python3 scripts/omega-build-freshness.py "$manifest_source" origin/master; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "source_sha=$manifest_source" >> "$GITHUB_OUTPUT"
          else
            # SUPERSEDED is a safe NON-DEPLOYMENT, never a successful release.
            # A green no-op previously triggered downstream R50 live acceptance
            # even though no new WASM/PCK bytes had reached production.
            echo "::error::SUPERSEDED Omega source: no SSH upload and no successful deployment signal."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 3
          fi
      - name: Verify release-integrity failure conditions
        if: steps.source_gate.outputs.ready == 'true'
        run: python3 scripts/omega-live-integrity.py --self-test
      - name: Verify exact native Godot binary artifacts
        if: steps.source_gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,pathlib
          directory=pathlib.Path('public/games/omega-3d-preview')
          m=json.loads((directory/'release.json').read_text())
          assert m.get('engine')=='Godot 4.4.1'
          assert m.get('native_tests')=='passed'
          assert m.get('artifact_kind')=='native-Godot-HTML5-export'
          manifest=m.get('files',{})
          for needed in ('index.html','index.js','index.wasm','index.pck'):
              assert needed in manifest,needed
          assert (directory/'index.wasm').stat().st_size>1_000_000
          assert (directory/'index.pck').stat().st_size>100_000
          with (directory/'SHA256SUMS.txt').open('w') as output:
              for name,digest in sorted(manifest.items()):
                  path=directory/name
                  assert path.is_file(),name
                  actual=hashlib.sha256(path.read_bytes()).hexdigest()
                  assert actual==digest,f'{name}: checksum mismatch'
                  output.write(f'{digest}  {name}\n')
          print('PASS:',len(manifest),'official Godot Web assets checksum matched')
          PY
          (cd public/games/omega-3d-preview && sha256sum -c SHA256SUMS.txt)
          mkdir -p "$RUNNER_TEMP/omega-native"
          tar -czf "$RUNNER_TEMP/omega-native/game.tgz" -C public/games/omega-3d-preview .
      - name: Configure SSH to existing OSGARD VPS
        if: steps.source_gate.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.OSGARD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.OSGARD_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.OSGARD_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/osgard_omega_deploy
          chmod 600 ~/.ssh/osgard_omega_deploy
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
      - name: Upload verified Godot game, activate with rollback
        id: publish
        if: steps.source_gate.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.OSGARD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.OSGARD_DEPLOY_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Revalidate immediately before the remote upload. A newer game
          # may have merged since checkout or initial source gate.
          git fetch --no-tags --depth=1 origin "+refs/heads/master:refs/remotes/origin/master"
          if ! python3 scripts/omega-build-freshness.py "${{ steps.source_gate.outputs.source_sha }}" origin/master; then
            echo "::error::SUPERSEDED immediately before SSH; older release not published."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 3
          fi
          # A prior VPS outage was caused by 96 GiB/96 GiB disk usage.
          # Fail closed before creating staging or transferring any bytes.
          required_bytes="$(python3 scripts/omega-native-space-budget.py \
            --archive "$RUNNER_TEMP/omega-native/game.tgz" \
            --game-dir public/games/omega-3d-preview)"
          ssh -o BatchMode=yes -i ~/.ssh/osgard_omega_deploy \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$required_bytes'" \
            < scripts/omega-native-remote-free-space.sh
          remote="/tmp/osgard-omega-native-${RUN_ID}"
          ssh -o BatchMode=yes -i ~/.ssh/osgard_omega_deploy "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$remote'"
          scp -i ~/.ssh/osgard_omega_deploy "$RUNNER_TEMP/omega-native/game.tgz" "$DEPLOY_USER@$DEPLOY_HOST:$remote/game.tgz"
          scp -i ~/.ssh/osgard_omega_deploy scripts/deploy-omega-native-remote.sh "$DEPLOY_USER@$DEPLOY_HOST:$remote/deploy.sh"
          # A large WASM/PCK SCP can outlive the source tree it was built
          # from. Reject a new upstream game commit before touching the
          # actual Nginx game directory; staging alone is NOT a deployment.
          git fetch --no-tags --depth=1 origin "+refs/heads/master:refs/remotes/origin/master"
          if ! python3 scripts/omega-build-freshness.py "${{ steps.source_gate.outputs.source_sha }}" origin/master; then
            echo "::error::SUPERSEDED after SCP, before Nginx activation; no live game changed."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            # Transport is now fully staged; remove only this run's files.
            ssh -o BatchMode=yes -i ~/.ssh/osgard_omega_deploy \
              "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$RUN_ID'" \
              < scripts/omega-native-remote-cleanup.sh || echo "::warning::Old staged transport needs manual inspection."
            exit 3
          fi
          ssh -o BatchMode=yes -i ~/.ssh/osgard_omega_deploy "$DEPLOY_USER@$DEPLOY_HOST" "bash '$remote/deploy.sh' '$RUN_ID'"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Verify exact live Godot source and downloaded SHA-256 for every file
        if: steps.publish.outputs.deployed == 'true'
        env:
          OMEGA_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/omega-live-integrity.py \
            --expected public/games/omega-3d-preview/release.json \
            --base https://osgard.world/games/omega-3d-preview \
            --nonce "$OMEGA_RUN_ID"
      - name: Remove only this release transport staging after exact public SHA attestation
        if: steps.publish.outputs.deployed == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.OSGARD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.OSGARD_DEPLOY_USER }}
        run: |
          set -euo pipefail
          # The key is provisioned earlier in this job; never print it.
          ssh -o BatchMode=yes -i ~/.ssh/osgard_omega_deploy \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '${{ github.run_id }}'" \
            < scripts/omega-native-remote-cleanup.sh
