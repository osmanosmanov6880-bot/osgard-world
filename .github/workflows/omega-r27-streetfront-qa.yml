name: OSGARD HORIZON R27 live city streetfront GPU batches QA
on:
  pull_request:
    branches: [master, feat/horizon-r26-mobile-focus-organic-trees]
    paths:
      - 'godot/empire-omega/**'
      - '.github/workflows/omega-r27-streetfront-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-live-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Generate genuine original game assets and import Godot
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          godot --headless --editor --path godot/empire-omega --import --quit
      - name: Test actual city geometry, mobile camera and one-shot actions
        shell: bash
        run: |
          set -euo pipefail
          for test in v23_horizon_visuals v26_horizon_sculpted_visuals v29_responsive_layout v37_touch_commands v48_city_polish v50_organic_foliage_mobile_focus v51_batched_streetfronts; do
            timeout --signal=TERM --kill-after=5s 95s godot --headless --path godot/empire-omega --script "res://tests/$test.gd"
          done
