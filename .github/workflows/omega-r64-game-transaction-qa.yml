name: EMPIRE Omega R64 genuine game-economy mission transactions
on:
  pull_request:
    branches: [master]
    paths:
      - 'godot/empire-omega/scripts/game_state.gd'
      - 'godot/empire-omega/scripts/mission_manager.gd'
      - 'godot/empire-omega/scripts/city_mobility.gd'
      - 'godot/empire-omega/scripts/civic_initiatives.gd'
      - 'godot/empire-omega/tests/v74_r64_authoritative_mission_transactions.gd'
      - '.github/workflows/omega-r64-game-transaction-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-economy-and-mission-awards:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Prepare actual game content and strict native script import
        shell: bash
        run: |
          set -euo pipefail
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          bash scripts/omega-strict-godot-import.sh godot/empire-omega
      - name: Exercise 15 authored missions through original transaction methods
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=8s 180s godot --headless \
            --path godot/empire-omega \
            --script res://tests/v74_r64_authoritative_mission_transactions.gd
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('godot/empire-omega/tests/r64-original-transactions-evidence.json')
          assert p.exists() and p.stat().st_size > 1200, 'Missing real engine transaction evidence'
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema']=='empire-omega-r64-real-transactions-v1'
          assert d['engine']=='Godot 4.4.1'
          assert d['real_gamestate_transactions']==15
          rows=d['transaction_results']
          assert len(rows)==15 and len(set(x['action'] for x in rows))==15
          assert all(x['actual_transaction_passed'] is True for x in rows)
          assert all(x['mission_after']==x['mission_index']+1 for x in rows)
          assert all(x['post_mission_wallet']-x['post_transaction_wallet']==x['reward'] for x in rows)
          assert d['checks_failed']==0 and d['checks_passed']>=120
          assert d['simulated_economy_fixture'] is True
          assert d['human_40_mission_playthrough_attested'] is False
          assert d['published_browser_attested'] is False
          assert d['physical_hardware_attested'] is False
          assert d['production_release_authorized'] is False
          print('PASS: 15 genuine native GameState transactions, mission and wallet invariants; UI/human gameplay remains HOLD')
          PY
      - name: Preserve original transaction ledger, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-r64-native-original-economic-transactions
          path: godot/empire-omega/tests/r64-original-transactions-evidence.json
          if-no-files-found: warn
          retention-days: 15
