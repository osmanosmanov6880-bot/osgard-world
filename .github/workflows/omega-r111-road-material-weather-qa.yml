name: EMPIRE Omega R111 original road material identity, rain and dry PBR QA
on:
  pull_request:
    branches:
      - feat/omega-r90-aaa-reference-first-slice-20261026
      - master
    paths:
      - 'godot/empire-omega/scripts/horizon_road_materials.gd'
      - 'godot/empire-omega/tests/v89_r111_stable_weather_pbr.gd'
      - '.github/workflows/omega-r111-road-material-weather-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-native-original-road-and-world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Confirm locked photo source and compile actual Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/r90_cc0_texture_pack.py verify
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          bash scripts/omega-strict-godot-import.sh godot/empire-omega
      - name: Test original R15 photographic wet-road regression and independent R111
        shell: bash
        run: |
          set -euo pipefail
          for suite in v38_adaptive_graphics v54_r32_cinematic_cabinet_wet_grip v76_r87_honest_mission_navigation v84_r98_facade_geometry v89_r111_stable_weather_pbr; do
            timeout --signal=TERM --kill-after=5s 115s godot --headless --path godot/empire-omega --script "res://tests/$suite.gd"
          done
