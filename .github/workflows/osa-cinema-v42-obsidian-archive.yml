name: OSA CINEMA V42 - approved Obsidian Archive viewer, permanent NO-GO
on:
  pull_request:
    paths:
      - 'src/OSACinema.tsx'
      - 'src/OSAObsidianArchive.tsx'
      - 'src/osaCinemaObsidian.css'
      - 'public/osa-cinema/obsidian/**'
      - 'scripts/osa-cinema-v42-ui-contract.test.mjs'
      - '.github/workflows/osa-cinema-v42-obsidian-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viewer-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --test scripts/osa-cinema-v42-ui-contract.test.mjs
      - run: npm ci --ignore-scripts
      - run: npm run check
  publication-still-blocked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Historical V16/V18/V20 proof stays NO-GO
        run: node --test scripts/osa-cinema-v35-historical-guard.test.mjs