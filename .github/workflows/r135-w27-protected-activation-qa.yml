name: OSGARD R135 W27 strict reviewed 29-frame SSH activation and full rollback contract NO DEPLOY

on:
  push:
    branches: [release/r135-w27-protected-activation-20261025]
    paths:
      - '.github/workflows/deploy-frontend.yml'
      - '.github/workflows/r135-w27-protected-activation-qa.yml'
      - 'scripts/r135-release-selector.sh'
      - 'scripts/r135-w18-deploy-contract.mjs'
      - 'scripts/r135-w27-promotion-qa.py'
      - 'scripts/r135-w27-release-pin.json'
      - 'scripts/r135-active-release.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pinned-all-prior-rollback-and-29-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Execute real Bash/Node protected selectors preserving W14-W21
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/r135-release-selector.sh
          node --check scripts/r135-w18-deploy-contract.mjs
          node scripts/r135-w18-deploy-contract.mjs
      - name: Reject forged W27 screenshots, native evidence and hardware claims
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_r135_w27_promotion_gate.py -v
          python3 -m unittest discover -s scripts -p test_r135_w21_promotion_gate.py -v
          python3 -m unittest discover -s scripts -p test_r135_w20_promotion_gate.py -v
          python3 -m unittest discover -s scripts -p test_r135_w19_promotion_gate.py -v
          python3 -m py_compile scripts/r135-release-stage.py scripts/r135-w27-promotion-qa.py scripts/r135-w27-candidate-pin-draft.py
      - name: Do not deploy from this branch: exact W27 reviewed pin required
        run: echo 'PASS means protected W27 selector implementation tested, NOT a live release. Keep W21 deployed.'
