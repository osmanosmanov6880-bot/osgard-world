name: OSGARD release readiness

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["OSGARD frontend deploy"]
    types: [completed]
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  readiness:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Syntax-check production health monitor
        run: node --check scripts/production-health-watch.mjs
      - name: Validate TEDES luxury pages and demo JavaScript
        run: node scripts/tedes-case-smoke.mjs
      - name: Validate NULL SHIFT standalone game
        run: npm run qa:null-shift
      - name: Verify OSGARD Games portal
        run: npm run qa:games-portal
      - name: Verify partner inventory and enquiry form
        run: npm run qa:partners-page
      - name: Build and archive preflight
        run: npm run build && npm run preflight:frontend
      - name: Verify Imperium of Time gameplay and diagnostics
        run: npm run qa:time-ui
      - name: Verify production routes after deploy or manual request
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
        env:
          OSGARD_BASE_URL: https://osgard.world
        run: npm run qa:production-routes
      - name: Probe authenticated production API when configured
        env:
          OSGARD_PRODUCTION_API_BASE: ${{ secrets.OSGARD_PRODUCTION_API_BASE }}
          OSGARD_PRODUCTION_BEARER_TOKEN: ${{ secrets.OSGARD_PRODUCTION_BEARER_TOKEN }}
        run: npm run qa:production-api
      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: osgard-release-readiness
          path: |
            release-manifest.json
            production-route-matrix.json
