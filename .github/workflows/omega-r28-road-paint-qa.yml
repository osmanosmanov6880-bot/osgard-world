name: OSGARD HORIZON R28 road paint GPU batching and driving QA
on:
  pull_request:
    branches: [master, feat/horizon-r27-batched-city-streetfronts]
    paths:
      - 'godot/empire-omega/**'
      - '.github/workflows/omega-r28-road-paint-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  road-native:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Prepare original game sources
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          godot --headless --editor --path godot/empire-omega --import --quit
      - name: Real world road meshes, wheel physics, multitouch and city visual tests
        shell: bash
        run: |
          set -euo pipefail
          for test in v21_vehicle_dynamics v29_responsive_layout v34_real_touch_drive v44_four_wheel_surface v48_city_polish v50_organic_foliage_mobile_focus v51_batched_streetfronts v52_road_markings_gpu; do
            timeout --signal=TERM --kill-after=5s 95s godot --headless --path godot/empire-omega --script "res://tests/$test.gd"
          done
