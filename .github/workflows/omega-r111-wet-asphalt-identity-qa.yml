name: EMPIRE Omega R111 preserve rain/clear asphalt PBR identity native Godot QA
on:
  pull_request:
    branches:
      - feat/omega-r90-aaa-reference-first-slice-20261026
    paths:
      - 'godot/empire-omega/scripts/horizon_road_materials.gd'
      - 'godot/empire-omega/tests/v89_r111_stable_weather_pbr.gd'
      - '.github/workflows/omega-r111-wet-asphalt-identity-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-road-physics-native-and-legacy-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Verify exact original 3 JPEGs before testing actual photo material
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/r90_cc0_texture_pack.py verify
      - name: Strict Godot import, actual dry/wet traction and old native tests
        shell: bash
        run: |
          set -euo pipefail
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          bash scripts/omega-strict-godot-import.sh godot/empire-omega
          for suite in v29_responsive_layout v38_adaptive_graphics v48_city_polish v50_organic_foliage_mobile_focus v54_r32_cinematic_cabinet_wet_grip v76_r87_honest_mission_navigation v83_r97_cinematic_command_hierarchy v84_r98_facade_geometry v89_r111_stable_weather_pbr; do
            timeout --signal=TERM --kill-after=5s 115s godot --headless --path godot/empire-omega --script "res://tests/$suite.gd"
          done
