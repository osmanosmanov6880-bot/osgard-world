name: OSGARD Omega HORIZON R7 responsive mobile gameplay QA
on:
  pull_request:
    branches: [master]
    paths:
      - 'godot/empire-omega/**'
      - '.github/workflows/omega-r7-mobile-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Create original local game audio
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
      - name: Import authentic Godot game and dependencies
        run: godot --headless --editor --path godot/empire-omega --import --quit
      - name: Native driving regression plus phone controls, HUD and quick mission actions
        shell: bash
        run: |
          set -euo pipefail
          for test in v21_vehicle_dynamics v25_horizon_racing v27_driver_assists v28_touch_controls v29_responsive_layout v30_mobile_quick_actions; do
            echo "::group::NATIVE $test"
            timeout --signal=TERM --kill-after=5s 30s godot --headless --path godot/empire-omega --script "res://tests/$test.gd"
            echo "::endgroup::"
          done
