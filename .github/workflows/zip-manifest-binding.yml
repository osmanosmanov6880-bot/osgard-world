name: OSGARD ZIP manifest binding
on:
  pull_request:
    paths:
      - 'scripts/verify-zip-manifest.py'
      - 'tests/test_zip_manifest_binding.py'
      - 'docs/ZIP-MANIFEST-BINDING.md'
      - '.github/workflows/zip-manifest-binding.yml'
permissions:
  contents: read
jobs:
  binding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/verify-zip-manifest.py tests/test_zip_manifest_binding.py
      - run: python -m unittest discover -s tests -p test_zip_manifest_binding.py -v
