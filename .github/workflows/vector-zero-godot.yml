name: VECTOR ZERO Blackfield native Godot validation

on:
  pull_request:
    paths:
      - 'godot/vector-zero/**'
      - '.github/workflows/vector-zero-godot.yml'
  push:
    branches:
      - 'feat/vector-zero-blackfield*'
    paths:
      - 'godot/vector-zero/**'
      - '.github/workflows/vector-zero-godot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import main scene and compile scripts
        run: godot --headless --editor --path godot/vector-zero --import --quit
      - name: Execute gameplay, level, and UI smoke tests
        run: godot --headless --path godot/vector-zero --script res://tests/runtime_smoke.gd
      - name: Export real Godot Web runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/vector-zero/.build-web
          godot --headless --path godot/vector-zero --export-release Web "$GITHUB_WORKSPACE/godot/vector-zero/.build-web/index.html"
          test -s godot/vector-zero/.build-web/index.html
          ls -lah godot/vector-zero/.build-web/
          python3 - <<'PYCODE'
          from pathlib import Path
          root = Path('godot/vector-zero/.build-web')
          for ext in ('.html', '.js', '.wasm', '.pck'):
              matching = sorted(root.glob('*' + ext))
              assert matching, f'Missing Godot Web export extension: {ext}'
              for file in matching:
                  assert file.stat().st_size > 0, f'Empty Web export file: {file}'
                  print(f'PASS {file.name}: {file.stat().st_size:,} bytes')
          wasm = next(root.glob('*.wasm'))
          assert wasm.open('rb').read(4) == b'\x00asm', 'WebAssembly magic mismatch'
          assert next(root.glob('*.pck')).stat().st_size >= 1024, 'Godot PCK too small'
          PYCODE
      - name: Capture authentic Godot renderer frame (optional GPU QA)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          command -v xvfb-run
          timeout 90s xvfb-run -a -s "-screen 0 1600x900x24" godot --rendering-method gl_compatibility --path godot/vector-zero --script res://tests/capture.gd
          test -s godot/vector-zero/screenshots-ci/vector-zero-blackfield-native.png
      - name: Attach original renderer screenshot for art review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-zero-blackfield-native-render
          path: godot/vector-zero/screenshots-ci/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Publish playable build as CI artifact (not production)
        uses: actions/upload-artifact@v4
        with:
          name: vector-zero-blackfield-godot-web
          path: godot/vector-zero/.build-web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Archive exact native Godot sources at this validated commit
        uses: actions/upload-artifact@v4
        with:
          name: vector-zero-cinematic-source
          path: |
            godot/vector-zero/project.godot
            godot/vector-zero/export_presets.cfg
            godot/vector-zero/scenes/
            godot/vector-zero/scripts/
            godot/vector-zero/tests/
            godot/vector-zero/README.md
          if-no-files-found: error
          retention-days: 14
