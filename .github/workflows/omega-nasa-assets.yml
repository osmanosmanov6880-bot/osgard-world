name: OSGARD Omega NASA 4K asset pipeline
on:
  push:
    branches: ["feature/omega-ultra-nasa-earth-20261020"]
    paths:
      - ".github/workflows/omega-nasa-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-earth:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow image processing
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download NASA source and generate local responsive textures
        run: python scripts/omega-nasa-assets.py
      - name: Verify dimensions and outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          manifest = json.loads(Path('public/brand/omega-nasa-manifest.json').read_text())
          assert len(manifest['assets']) == 6
          for asset in manifest['assets'].values():
              p = Path('public') / asset['path'].lstrip('/')
              assert p.exists(), p
              with Image.open(p) as img:
                  assert img.size == tuple(asset['size'])
              print(p, asset['bytes'], asset['sha256'])
          PY
      - name: Commit verified, credited assets to same feature branch
        run: |
          git config user.name "osgard-asset-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/omega-nasa-*.webp public/brand/omega-nasa-manifest.json
          if git diff --cached --quiet; then
            echo "Assets unchanged"
          else
            git commit -m "assets(omega): store NASA 4K satellite day/night textures with provenance"
            git push origin HEAD:feature/omega-ultra-nasa-earth-20261020
          fi
