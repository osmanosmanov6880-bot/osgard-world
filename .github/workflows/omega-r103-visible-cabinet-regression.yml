name: EMPIRE Omega R103 readable dark command / real city visible regression
on:
  pull_request:
    branches:
      - feat/omega-r90-aaa-reference-first-slice-20261026
    paths:
      - 'godot/empire-omega/scripts/hud.gd'
      - '.github/workflows/omega-r103-visible-cabinet-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserve-world-and-legacy-r32:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Verify original native gameplay, readable city backdrop and R97/R98
        shell: bash
        run: |
          set -euo pipefail
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          bash scripts/omega-strict-godot-import.sh godot/empire-omega
          for suite in v29_responsive_layout v54_r32_cinematic_cabinet_wet_grip v76_r87_honest_mission_navigation v78_r90_reference_fidelity v79_r91_original_architecture v82_r95_city_massing v83_r97_cinematic_command_hierarchy v84_r98_facade_geometry; do
            timeout --signal=TERM --kill-after=5s 115s godot --headless --path godot/empire-omega --script "res://tests/$suite.gd"
          done
