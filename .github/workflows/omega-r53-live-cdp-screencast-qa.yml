name: EMPIRE Omega R53 independent authentic public desktop and touch screencast experiment
on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/omega-browser-evidence.mjs'
      - 'scripts/omega-browser-evidence.contract.test.mjs'
      - '.github/workflows/omega-r53-live-cdp-screencast-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-cdp-screencast-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove real PNG stream and exact-SHA live web evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/omega-browser-evidence.mjs
          node --test scripts/omega-browser-evidence.contract.test.mjs
          node --test scripts/omega-live-webgl-capture.contract.test.mjs
  authentic-public-desktop-and-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact Chromium renderer and Playwright version
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.58.2 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Test same REAL public WebAssembly source SHA with new capture on desktop and phone
        shell: bash
        env:
          OSGARD_GAME_ORIGIN: https://osgard.world
        run: |
          set -euo pipefail
          npx playwright test --config playwright.omega-live-webgl.config.mjs \
            --project=desktop-chromium --project=touch-phone-chromium
      - name: Keep real Chromium PNG, camera motion, source SHA and trace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-r53-experimental-original-desktop-phone
          path: |
            omega-live-webgl-results/
            omega-live-webgl-report/
          retention-days: 12
          if-no-files-found: warn
