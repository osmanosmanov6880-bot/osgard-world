name: OSGARD HORIZON R20 camera framing and reduced motion QA
on:
  pull_request:
    branches: [master]
    paths:
      - 'godot/empire-omega/**'
      - '.github/workflows/omega-r20-chase-camera-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera-native:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Generate original game audio and import Godot
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          godot --headless --editor --path godot/empire-omega --import --quit
      - name: Validate genuine collision camera, reduced motion and driving
        shell: bash
        run: |
          set -euo pipefail
          for test in v34_real_touch_drive v37_safe_chase_camera v40_yaw_inertia v42_engine_audio v43_camera_composition; do
            timeout --signal=TERM --kill-after=5s 85s godot --headless --path godot/empire-omega --script "res://tests/$test.gd"
          done
