name: OSA CINEMA V33 private workspace hardening
on:
  pull_request:
    paths:
      - 'scripts/osa-cinema-v32-first-run.mjs'
      - 'scripts/osa-cinema-v33-hardening.test.mjs'
      - '.github/workflows/osa-cinema-v33-hardening.yml'
      - 'docs/OSA_CINEMA_V33_TRANSACTIONAL_SECURITY_RU.md'
  push:
    branches: [master]
    paths:
      - 'scripts/osa-cinema-v32-first-run.mjs'
      - 'scripts/osa-cinema-v33-hardening.test.mjs'
      - '.github/workflows/osa-cinema-v33-hardening.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-workspace-regression:
    name: owner-only security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax & transactional privacy checks
        shell: bash
        run: |
          node --check scripts/osa-cinema-v32-first-run.mjs
          node --check scripts/osa-cinema-v33-hardening.test.mjs
          node --test scripts/osa-cinema-v33-hardening.test.mjs
  public-film-must-remain-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public release remains blocked
        run: |
          set +e
          node scripts/osa-cinema-v20-release-audit.mjs --strict-publication > "$RUNNER_TEMP/osa-v33-no-go.txt" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -q OSA_CINEMA_V20_NO_PUBLICATION "$RUNNER_TEMP/osa-v33-no-go.txt"
