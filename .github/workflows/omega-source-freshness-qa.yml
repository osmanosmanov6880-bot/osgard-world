name: OSGARD Omega stale export protection native Git QA
on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/omega-build-freshness.py'
      - '.github/workflows/omega-godot-web.yml'
      - '.github/workflows/omega-source-freshness-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tree-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify stale-safety logic against a temporary real Git repository
        run: python3 scripts/omega-build-freshness.py --self-test
      - name: Verify current source against the checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/omega-build-freshness.py HEAD HEAD
          if python3 scripts/omega-build-freshness.py HEAD does-not-exist; then
            echo 'Missing source revision was incorrectly accepted'
            exit 1
          fi
      - name: Check actual R60 Web release source against current game runtime files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/master:refs/remotes/origin/master"
          source_sha="$(python3 -c 'import json; print(json.load(open("public/games/omega-3d-preview/release.json"))["source_commit"])')"
          git fetch --no-tags --depth=1 origin "$source_sha"
          python3 scripts/omega-build-freshness.py "$source_sha" origin/master
          echo 'PASS: actual latest Godot runtime equals exported binary source, ignoring only docs Markdown'
      - name: Verify a source-guard fix triggers fresh protected SSH deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          deploy=Path('.github/workflows/omega-web-direct-deploy.yml').read_text()
          src=Path('scripts/omega-build-freshness.py').read_text()
          assert '- "scripts/omega-build-freshness.py"' in deploy, 'no auto-trigger after guard correction'
          assert 'runtime_fingerprint' in src
          assert 'relative_path.startswith(b"docs/")' in src
          assert 'relative_path.lower().endswith(b".md")' in src
          assert 'exit 3' in deploy, 'stale source must fail closed'
          print('PASS: guard-only change reactivates honest fail-closed release gate')
          PY
      - name: Verify the release job calls the source-tree gate before restaging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/omega-godot-web.yml').read_text()
          gate='if ! python3 scripts/omega-build-freshness.py'
          assert gate in src, 'build gate missing'
          assert src.index(gate) < src.index('git reset --mixed origin/master'), 'gate must precede restaging'
          # A superseded source must fail the exporter itself; its green
          # conclusion otherwise incorrectly triggers downstream SSH releases.
          block=src[src.index(gate):src.index('git reset --mixed origin/master')]
          assert '::error::SUPERSEDED native export' in block, 'missing stale-export error'
          assert 'exit 3' in block, 'stale export cannot exit successfully'
          assert 'exit 0' not in block, 'green no-op would trigger a false deployment'
          print('PASS: stale native export is non-success before restaging or SSH')
          PY
