name: OSGARD R135 W25 physical-phone evidence integrity and hardware HOLD

on:
  push:
    branches: [feat/r135-w25-real-mobile-field-evidence-20261025]
    paths:
      - 'scripts/r135-w25-physical-browser-capture.js'
      - 'scripts/r135-w25-physical-evidence.py'
      - 'scripts/test_r135_w25_physical_evidence.py'
      - '.github/workflows/r135-w25-physical-evidence-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-mobile-evidence-must-be-human-verified:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse actual field probe and hardware negative gates
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/r135-w25-physical-browser-capture.js
          python3 -m py_compile scripts/r135-w25-physical-evidence.py scripts/test_r135_w25_physical_evidence.py
          python3 -m unittest discover -s scripts -p test_r135_w25_physical_evidence.py -v
          python3 - <<'PY'
          from pathlib import Path
          script=Path("scripts/r135-w25-physical-browser-capture.js").read_text()
          gate=Path("scripts/r135-w25-physical-evidence.py").read_text()
          for forbidden in ("RTCPeerConnection", "sendBeacon(", "fetch('https://", "fetch(\"https://"):
              assert forbidden not in script, "real phone probe cannot exfiltrate device info"
          assert "physical_hardware_attested: false" in script
          assert "reviewer_confirmed: false" in script
          assert "performance.now()" in script and "requestAnimationFrame" in script
          assert "source_commit" in script and "release.json" in script
          assert "hardware_fps_certified" in gate and "False" in gate
          assert "production_W28_go" in gate and "False" in gate
          print("W25 legitimate real-device evidence collection tool PASS; HARDWARE HOLD remains")
          PY
      - name: Real phones NOT certified by GitHub runners
        run: |
          echo 'W25 physical Android Chrome and iOS Safari sessions are missing.'
          echo 'Machine tests only enforce integrity. Hardware release remains HOLD.'
