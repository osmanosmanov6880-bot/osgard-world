name: OSA CINEMA V47 - production program and permanent film NO-GO
on:
  pull_request:
    branches: [master]
    paths:
      - 'docs/OSA_CINEMA_V47_*'
      - 'scripts/osa-cinema-v47-*'
      - 'docs/OSA_CINEMA_V16_WORKPRINT_MANIFEST.json'
      - 'docs/OSA_CINEMA_V16_NARRATION_MANIFEST.json'
      - 'docs/OSA_CINEMA_V20_PRIVATE_RELEASE_POLICY.json'
      - 'scripts/osa-cinema-v27-release-board.mjs'
      - 'src/OSACinema.tsx'
      - '.github/workflows/osa-cinema-v47-production-board.yml'
  push:
    branches: [master]
    paths:
      - 'docs/OSA_CINEMA_V47_*'
      - 'scripts/osa-cinema-v47-*'
      - '.github/workflows/osa-cinema-v47-production-board.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osa-cinema-v47-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  production-program:
    name: Read-only production board + NO-GO (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static parser and actual fail-closed contract tests
        shell: bash
        run: |
          node --check scripts/osa-cinema-v47-production-board.mjs
          node --check scripts/osa-cinema-v47-production-board.test.mjs
          node --test scripts/osa-cinema-v47-production-board.test.mjs
      - name: Print truthful read-only packet receipt
        shell: bash
        run: node scripts/osa-cinema-v47-production-board.mjs

  historical-film-policy:
    name: Historical SHA locks and permanent V20 publication denial
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual historical source immutability
        run: node scripts/osa-cinema-v35-historical-guard.mjs --root .
      - name: Verify V20 privacy and per-asset NO-GO
        run: node --test scripts/osa-cinema-v20-release-audit.test.mjs
      - name: An unlicensed release MUST exit nonzero with the expected code
        shell: bash
        run: |
          set +e
          node scripts/osa-cinema-v20-release-audit.mjs --strict-publication > "$RUNNER_TEMP/osa-v47-mandatory-no-go.log" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -q 'OSA_CINEMA_V20_NO_PUBLICATION' "$RUNNER_TEMP/osa-v47-mandatory-no-go.log"
          echo "Strict film publication correctly DENIED"
