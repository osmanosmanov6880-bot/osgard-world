name: INHERIT real desktop and mobile QA

on:
  pull_request:
    branches: [master, feature/inherit-r16-real-threejs-world-20261023, feature/inherit-r22-coastal-atmosphere-pbr-20261023]
    paths:
      - "public/games/inherit/**"
      - "scripts/inherit-3d/**"
      - "scripts/inherit-r18-performance-smoke.mjs"
      - "scripts/inherit-r19-microbiome-smoke.mjs"
      - "scripts/inherit-r19-device-acceptance-smoke.mjs"
      - "scripts/inherit-r21-surf-smoke.mjs"
      - "scripts/inherit-r22-geology-smoke.mjs"
      - "scripts/inherit-r23-cinematic-smoke.mjs"
      - "scripts/inherit-benchmark-gate.mjs"
      - "scripts/inherit-r23-benchmark-gate-smoke.mjs"
      - "scripts/inherit-r24-ocean-focus-smoke.mjs"
      - "scripts/inherit-r24-foliage-smoke.mjs"
      - "scripts/inherit-r20-smoke.mjs"
      - "scripts/inherit-device-acceptance.mjs"
      - "scripts/build-inherit-3d.mjs"
      - "scripts/inherit-3d-smoke.mjs"
      - "scripts/ecosystem-browser.spec.mjs"
      - ".github/workflows/inherit-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inherit-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inherit-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install the locked application
        run: npm ci
      - name: Validate genuine 3D source and offline bundle
        run: npm run qa:inherit-3d
      - name: Build the actual production site
        run: npm run build
      - name: Include all published game assets
        run: cp -a public/games/. dist/games/
      - name: Use real Chrome on the runner or pinned fallback
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo "OSGARD_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps --no-shell chromium
          fi
      - name: Verify complete classic and R15 INHERIT journeys on desktop and mobile
        run: npx playwright test --config playwright.ecosystem.config.mjs --grep "INHERIT" --grep-invert "INHERIT R16|INHERIT R17|INHERIT R19" --workers 2
      - name: Prove actual R16 GPU WebGL frames and real fallbacks in Chrome
        env:
          OSGARD_ENABLE_SWIFTSHADER: "1"
        run: npx playwright test --config playwright.ecosystem.config.mjs --grep "INHERIT R1[679]|INHERIT R23|INHERIT R24" --workers 1
      - name: Record real-Chrome CPU and WebGL performance evidence
        env:
          OSGARD_ENABLE_SWIFTSHADER: "1"
          OSGARD_BENCHMARK_OUTPUT: "browser-report/inherit-r17-performance.json"
        run: node scripts/inherit-hardware-benchmark.mjs --serve --swiftshader --require-webgl
      - name: Retain real interaction screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inherit-real-browser-evidence
          path: |
            browser-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
