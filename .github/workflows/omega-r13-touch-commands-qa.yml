name: OSGARD Omega R13 real mobile command delivery QA
on:
  pull_request:
    branches: [master]
    paths:
      - 'godot/empire-omega/**'
      - 'scripts/omega-mobile-touch-geometry*'
      - 'scripts/omega-live-webgl.spec.mjs'
      - '.github/workflows/omega-r13-touch-commands-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pixel-accurate touch targets against real 390x844 screenshot
        run: node --test scripts/omega-mobile-touch-geometry.test.mjs
      - name: Compile-check real WebGL browser acceptance
        run: |
          node --check scripts/omega-live-webgl.spec.mjs
          node --check scripts/omega-mobile-touch-geometry.mjs
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Generate real project assets
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
      - name: Import original Godot 4.4.1 game
        run: godot --headless --editor --path godot/empire-omega --import --quit
      - name: Check authentic physics, mobile HUD, routing and one-shot touch commands
        shell: bash
        run: |
          set -euo pipefail
          for test in v21_vehicle_dynamics v25_horizon_racing v27_driver_assists v28_touch_controls v29_responsive_layout v30_compact_hud v31_academy_navigation v32_road_guidance v33_checkpoint_gate v34_real_touch_drive v35_touch_commands; do
            echo "Godot R13 native: $test"
            timeout --signal=TERM --kill-after=5s 95s godot --headless --path godot/empire-omega --script "res://tests/$test.gd"
          done
