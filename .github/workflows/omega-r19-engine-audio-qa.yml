name: OSGARD HORIZON R19 native engine audio QA
on:
  pull_request:
    branches: [master, feat/horizon-r18-glare-grade-clearcoat]
    paths:
      - 'godot/empire-omega/**'
      - '.github/workflows/omega-r19-engine-audio-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Generate original synthesized WAV assets and import game
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          godot --headless --editor --path godot/empire-omega --import --quit
      - name: Run audio, vehicle and mobile safety regressions in Godot
        shell: bash
        run: |
          set -euo pipefail
          for suite in v21_vehicle_dynamics v25_horizon_racing v34_real_touch_drive v40_yaw_inertia v41_lighting_grade v42_engine_audio; do
            timeout --signal=TERM --kill-after=5s 85s godot --headless --path godot/empire-omega --script "res://tests/$suite.gd"
          done
