name: NEBULA R40 final production evidence preflight
on:
  pull_request:
    paths:
      - "scripts/nebula-r40-production-preflight.mjs"
      - "scripts/nebula-r40-device-progress.mjs"
      - "scripts/nebula-r40-field-kit.mjs"
      - "scripts/nebula-r40-evidence-import.mjs"
      - "scripts/test-nebula-r40-evidence-import.mjs"
      - "scripts/test-nebula-r40-field-kit.mjs"
      - "docs/nebula/R40-FIELD-QA-RUNBOOK.md"
      - "docs/nebula/R40-ON-DEVICE-AB-PROTOCOL.md"
      - "scripts/test-nebula-r40-current-field-protocol.mjs"
      - "docs/nebula/R40-FINAL-CLOSEOUT-BLOCKS.md"
      - ".github/workflows/nebula-r40-production-preflight.yml"
  push:
    branches: [master]
    paths:
      - "scripts/nebula-r40-production-preflight.mjs"
      - "scripts/nebula-r40-device-progress.mjs"
      - "scripts/nebula-r40-field-kit.mjs"
      - "scripts/nebula-r40-evidence-import.mjs"
      - "scripts/test-nebula-r40-evidence-import.mjs"
      - "scripts/test-nebula-r40-field-kit.mjs"
      - "docs/nebula/R40-FIELD-QA-RUNBOOK.md"
      - "docs/nebula/R40-ON-DEVICE-AB-PROTOCOL.md"
      - "scripts/test-nebula-r40-current-field-protocol.mjs"
      - "docs/nebula/R40-FINAL-CLOSEOUT-BLOCKS.md"
      - ".github/workflows/nebula-r40-production-preflight.yml"
permissions:
  contents: read
jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify honest release hold and rejects missing phone evidence
        run: |
          set -euo pipefail
          node --check scripts/nebula-r40-production-preflight.mjs
          node --check scripts/nebula-r40-field-kit.mjs
          node --check scripts/nebula-r40-device-progress.mjs
          node --check scripts/nebula-r40-evidence-import.mjs
          node --test scripts/test-nebula-r40-field-kit.mjs
          node --test scripts/test-nebula-r40-evidence-import.mjs
          node --test scripts/test-nebula-r40-current-field-protocol.mjs
          node scripts/nebula-r40-production-preflight.mjs --selftest
          if node scripts/nebula-r40-production-preflight.mjs docs/nebula/R40-DEVICE-FIELD-MANIFEST.example.json; then
            echo "Empty original phone evidence must never be approved" >&2
            exit 1
          fi
          node scripts/nebula-production-artifact-guard.mjs
          echo "NEBULA_R40_FINAL_RELEASE_HELD_CORRECTLY"
      - name: Package EMPTY physical QA kit for real phone testers
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          node scripts/nebula-r40-field-kit.mjs init "$RUNNER_TEMP/nebula-r40-private-field"
          test "$(find "$RUNNER_TEMP/nebula-r40-private-field/reports" -type f | wc -l)" -eq 0
          test "$(find "$RUNNER_TEMP/nebula-r40-private-field/images" -type f | wc -l)" -eq 0
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/nebula-r40-empty-field-kit.zip" nebula-r40-private-field)
          test -s nebula-r40-empty-field-kit.zip
      - name: Upload empty QA kit (NO measured FPS or images)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nebula-r40-empty-physical-device-kit
          path: nebula-r40-empty-field-kit.zip
          if-no-files-found: error
          retention-days: 14

