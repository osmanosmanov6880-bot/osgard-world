name: OSGARD HORIZON R22 skid graphics and GPU pool QA
on:
  pull_request:
    branches: [master, feat/horizon-r21-four-wheel-surface-feedback]
    paths:
      - 'godot/empire-omega/**'
      - '.github/workflows/omega-r22-skid-visuals-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skid-world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Prepare actual Godot gameplay assets
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          godot --headless --editor --path godot/empire-omega --import --quit
      - name: Regression for tyre marks, contact, mobile and camera
        shell: bash
        run: |
          set -euo pipefail
          for test in v21_vehicle_dynamics v34_real_touch_drive v40_yaw_inertia v43_camera_composition v44_four_wheel_surface v45_skid_trails; do
            timeout --signal=TERM --kill-after=5s 90s godot --headless --path godot/empire-omega --script "res://tests/$test.gd"
          done
