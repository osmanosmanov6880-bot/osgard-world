name: IRON PULSE BLACKOUT - exact-head Godot 4.4.1 slice QA and preview binaries

on:
  pull_request:
    paths:
      - 'iron-pulse-prologue/**'
      - '.github/workflows/iron-pulse-blackout-slice.yml'
  push:
    branches: [master]
    paths:
      - 'iron-pulse-prologue/**'
      - '.github/workflows/iron-pulse-blackout-slice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iron-pulse-blackout-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  source-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact audited HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head and baseline isolation
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test -f iron-pulse-prologue/Main.tscn
          test -f iron-pulse-prologue/scripts/CrisisEngine.gd
          test -f iron-pulse-prologue/scripts/Main.gd
          test -f w33-godot-native/project.godot
          # Refuse unlicensed external assets, arbitrary device APIs or remote dependencies.
          if grep -R -nE 'HTTPClient|HTTPRequest|OS\.execute|FileAccess\.open\("res://\.\./' iron-pulse-prologue/scripts; then
            echo '::error::Unexpected external access in offline gameplay slice'
            exit 1
          fi
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Import actual native Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path iron-pulse-prologue --import --quit 2>&1 | tee "$RUNNER_TEMP/iron-pulse-import.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script' "$RUNNER_TEMP/iron-pulse-import.log"; then
            echo '::error::Godot import/compile failed'
            exit 1
          fi
      - name: Deterministic reactor and power-grid game mechanics
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path iron-pulse-prologue --script res://tests/test_crisis_engine.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-gameplay.log"
          grep -q '^IRON PULSE BLACKOUT GAMEPLAY PASS:' "$RUNNER_TEMP/iron-pulse-gameplay.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-gameplay.log"; then exit 1; fi
      - name: Real native 3D scene and RU/EN interface tests
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path iron-pulse-prologue --script res://tests/test_scene.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-scene.log"
          grep -q '^IRON PULSE BLACKOUT 3D SCENE PASS:' "$RUNNER_TEMP/iron-pulse-scene.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-scene.log"; then exit 1; fi
      - name: Actual cinematic architecture, original audio, live hazard HUD and reduced-motion regression
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path iron-pulse-prologue --script res://tests/test_aaa_foundation.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-aaa-native.log"
          grep -q '^IRON PULSE AAA FOUNDATION NATIVE PASS:' "$RUNNER_TEMP/iron-pulse-aaa-native.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-aaa-native.log"; then exit 1; fi
      - name: V3 readable cinema native light, overlay and mobile glyph acceptance
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path iron-pulse-prologue --script res://tests/test_v3_readable_cinema.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-v3-ui.log"
          grep -q '^IRON PULSE V3 READABLE CINEMA PASS:' "$RUNNER_TEMP/iron-pulse-v3-ui.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v3-ui.log"; then exit 1; fi
      - name: V4 three deterministic emergencies, distinct strategies and winnable outcomes
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path iron-pulse-prologue --script res://tests/test_v4_three_scenarios.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-v4-engine.log"
          grep -q '^IRON PULSE V4 THREE SCENARIOS PASS:' "$RUNNER_TEMP/iron-pulse-v4-engine.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v4-engine.log"; then exit 1; fi
      - name: V4 actual localized 3D mission selector and physical E/Q interaction
        shell: bash
