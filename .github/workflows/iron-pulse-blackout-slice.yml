      - name: V7 deterministic 2-of-3 rescue decisions and backward compatible V6 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path iron-pulse-prologue --script res://tests/test_v7_rescue_rules.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-v7-rules.log"
          grep -q '^IRON PULSE V7 RESCUE NETWORK PASS:' "$RUNNER_TEMP/iron-pulse-v7-rules.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v7-rules.log"; then exit 1; fi
      - name: V7 physical 3D relay gamepad HUD and saved-recovery scene QA
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path iron-pulse-prologue --script res://tests/test_v7_rescue_gamepad_scene.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-v7-gamepad.log"
          grep -q '^IRON PULSE V7 PHYSICAL GAMEPAD PASS:' "$RUNNER_TEMP/iron-pulse-v7-gamepad.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v7-gamepad.log"; then exit 1; fi
      - name: V8 physical 15m reactor atrium, original PBR, safety guardrail and real game controls
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 160s godot --headless --path iron-pulse-prologue --script res://tests/test_v8_reactor_atrium.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-v8-atrium.log"
          grep -q '^IRON PULSE V8 CINEMATIC REACTOR PASS:' "$RUNNER_TEMP/iron-pulse-v8-atrium.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v8-atrium.log"; then exit 1; fi
      - name: V8.1 authored reactor director camera, GPU plasma shader, accessible motion and player-state safety
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 160s godot --headless --path iron-pulse-prologue --script res://tests/test_v8_1_director_camera.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-v8-1-director.log"
          grep -q '^IRON PULSE V8.1 DIRECTOR CAMERA PASS:' "$RUNNER_TEMP/iron-pulse-v8-1-director.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v8-1-director.log"; then exit 1; fi
      - name: V8.2 physical clean cinematic camera sightlines and intact original 3D gameplay
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 160s godot --headless --path iron-pulse-prologue --script res://tests/test_v8_2_clean_sightlines.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-v8-2-art.log"
          grep -q '^IRON PULSE V8.2 CLEAR SIGHTLINES PASS:' "$RUNNER_TEMP/iron-pulse-v8-2-art.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v8-2-art.log"; then exit 1; fi
      - name: V8.3 physically open reactor armour, real brighter plasma and intact gameplay
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 160s godot --headless --path iron-pulse-prologue --script res://tests/test_v8_3_open_core.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-v8-3-core.log"
          grep -q '^IRON PULSE V8.3 OPEN CORE PASS:' "$RUNNER_TEMP/iron-pulse-v8-3-core.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v8-3-core.log"; then exit 1; fi
      - name: V8.3 real open plasma reactor, industrial shell and all original gameplay
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 160s godot --headless --path iron-pulse-prologue --script res://tests/test_v8_3_open_core.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-v8-3-core.log"
          grep -q '^IRON PULSE V8.3 OPEN CORE PASS:' "$RUNNER_TEMP/iron-pulse-v8-3-core.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v8-3-core.log"; then exit 1; fi
      - name: V8.4 true plasma hero silhouette, open support structure and balanced front lighting
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 160s godot --headless --path iron-pulse-prologue --script res://tests/test_v8_4_plasma_hero.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-v8-4-hero.log"
          grep -q '^IRON PULSE V8.4 PLASMA HERO PASS:' "$RUNNER_TEMP/iron-pulse-v8-4-hero.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v8-4-hero.log"; then exit 1; fi
      - name: V8.5 authored reactor framing, source-bound ring normals and faithful player controls
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 160s godot --headless --path iron-pulse-prologue --script res://tests/test_v8_5_framed_core.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-v8-5-framing.log"
          grep -q '^IRON PULSE V8.5 FRAMED REACTOR PASS:' "$RUNNER_TEMP/iron-pulse-v8-5-framing.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v8-5-framing.log"; then exit 1; fi
      - name: V8.6 real 3D pressure relief, live hazard-driven vent animation, steam and instanced surge FX
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s godot --headless --path iron-pulse-prologue --script res://tests/test_v8_6_reactive_containment.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-v8-6-hazard-fx.log"
          grep -q '^IRON PULSE V8.6 REACTIVE CONTAINMENT PASS:' "$RUNNER_TEMP/iron-pulse-v8-6-hazard-fx.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v8-6-hazard-fx.log"; then exit 1; fi
      - name: V9-V12 full story / in-world UX / cinematic / release-gate source regression
        shell: bash
        run: |
          set -euo pipefail
          for entry in             'test_v9_campaign_flow.gd|IRON PULSE V9 CAMPAIGN PASS'             'test_v9_campaign_scene.gd|IRON PULSE V9 THREE-ACT SCENE PASS'             'test_v10_wayfinding.gd|IRON PULSE V10 WAYFINDING PASS'             'test_v11_campaign_echoes.gd|IRON PULSE V11 CONSEQUENCES PASS'             'test_v12_release_gate.gd|IRON PULSE V12 RELEASE GATE PASS'; do
            script="${entry%%|*}"
            proof="${entry#*|}"
            output="$RUNNER_TEMP/iron-pulse-${script%.gd}.log"
            echo "GODOT GATE: $script"
            timeout --signal=TERM --kill-after=5s 180s godot --headless --path iron-pulse-prologue --script "res://tests/$script" 2>&1 | tee "$output"
            grep -q "^$proof:" "$output"
            if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$output"; then exit 1; fi
          done
      - name: V15 true deterministic 30s crisis projections, UI controls, and save isolation
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s godot --headless --path iron-pulse-prologue --script res://tests/test_v15_decision_forecast.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-v15-forecast.log"
          grep -q '^IRON PULSE V15 DECISION FORECAST PASS:' "$RUNNER_TEMP/iron-pulse-v15-forecast.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v15-forecast.log"; then exit 1; fi
      - name: V16 real engine hazard monitoring, honest black box, real HUD and V6 save regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s godot --headless --path iron-pulse-prologue --script res://tests/test_v16_black_box_hazard.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-v16-hazard-black-box.log"
          grep -q '^IRON PULSE V16 BLACK BOX HAZARD PASS:' "$RUNNER_TEMP/iron-pulse-v16-hazard-black-box.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v16-hazard-black-box.log"; then exit 1; fi
      - name: V17 real operator records, atomic private retention, local deletion and native HUD regression
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 190s godot --headless --path iron-pulse-prologue --script res://tests/test_v17_operator_records.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-v17-operator-records.log"
          grep -q '^IRON PULSE V17 OPERATOR RECORDS PASS:' "$RUNNER_TEMP/iron-pulse-v17-operator-records.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v17-operator-records.log"; then exit 1; fi
      - name: V13 safe world-link contract to actual story campaign and original mission
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 160s godot --headless --path iron-pulse-prologue --script res://tests/test_v13_world_launch.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-v13-world-launch.log"
          grep -q '^IRON PULSE V13 WORLD LAUNCH PASS:' "$RUNNER_TEMP/iron-pulse-v13-world-launch.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v13-world-launch.log"; then exit 1; fi
      - name: V12 source manifest, offline provenance and release HOLD check
        shell: bash
        run: |
          set -euo pipefail
          python3 iron-pulse-prologue/ci/verify_release_v12.py
      - name: Export exact-source Godot 4.4.1 WebGL playable build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p iron-pulse-prologue/build/web
          (cd iron-pulse-prologue && godot --headless --path . --export-release Web build/web/index.html) 2>&1 | tee "$RUNNER_TEMP/iron-pulse-web.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-web.log"; then exit 1; fi
          test -s iron-pulse-prologue/build/web/index.html
          test -s iron-pulse-prologue/build/web/index.js
          test -s iron-pulse-prologue/build/web/index.wasm
          test -s iron-pulse-prologue/build/web/index.pck
      - name: Export Windows x64 executable (not physical Windows QA)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p iron-pulse-prologue/build/windows
          (cd iron-pulse-prologue && godot --headless --path . --export-release 'Windows Desktop' build/windows/IRON_PULSE_BLACKOUT.exe) 2>&1 | tee "$RUNNER_TEMP/iron-pulse-win.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-win.log"; then exit 1; fi
          test -s iron-pulse-prologue/build/windows/IRON_PULSE_BLACKOUT.exe
          test -s iron-pulse-prologue/build/windows/IRON_PULSE_BLACKOUT.pck
      - name: Bind preview to source SHA and independently hash each artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p iron-pulse-prologue/build/proof
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > iron-pulse-prologue/build/proof/SOURCE_SHA.txt
          printf '%s\n' 'SOFTWARE-ONLY PREVIEW; NOT PRODUCTION; PHYSICAL DEVICE QA PENDING' > iron-pulse-prologue/build/proof/RELEASE_HOLD.txt
          cd iron-pulse-prologue/build
          sha256sum web/index.html web/index.js web/index.wasm web/index.pck windows/IRON_PULSE_BLACKOUT.exe windows/IRON_PULSE_BLACKOUT.pck > proof/SHA256SUMS.txt
          sha256sum -c proof/SHA256SUMS.txt
      - name: Install pinned browser playback tools for real Godot canvas QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/iron-pulse-playwright"
          "$RUNNER_TEMP/iron-pulse-playwright/bin/pip" install --disable-pip-version-check --no-cache-dir playwright==1.56.0 Pillow==11.3.0
          "$RUNNER_TEMP/iron-pulse-playwright/bin/python" -m playwright install --with-deps chromium
      - name: Exercise real WebGL player controls at desktop and touch-emulated resolutions
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/iron-pulse-playwright/bin/python" iron-pulse-prologue/ci/browser_webgl_acceptance.py \
            --export iron-pulse-prologue/build/web \
            --evidence iron-pulse-prologue/build/browser-evidence \
            --sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            2>&1 | tee "$RUNNER_TEMP/iron-pulse-browser-playback.log"
          grep -q '"status": "PASS"' iron-pulse-prologue/build/browser-evidence/webgl-evidence.json
      - name: V13 build exact-source IRON PULSE WORLD including unaltered real gameplay frame
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p iron-pulse-prologue/build/world-preview/play iron-pulse-prologue/build/world-preview/assets
          cp -a iron-pulse-prologue/world/. iron-pulse-prologue/build/world-preview/
          cp -a iron-pulse-prologue/build/web/. iron-pulse-prologue/build/world-preview/play/
          cp iron-pulse-prologue/build/browser-evidence/cinematic-reactor-desktop.png iron-pulse-prologue/build/world-preview/assets/gameplay-proof.png
          python3 iron-pulse-prologue/ci/attest_world_bundle.py \
            --site iron-pulse-prologue/build/world-preview \
            --web iron-pulse-prologue/build/web \
            --capture iron-pulse-prologue/build/browser-evidence/cinematic-reactor-desktop.png \
            --sha "${{ github.event.pull_request.head.sha || github.sha }}"
          cd iron-pulse-prologue/build
          sha256sum world-preview/play/index.html world-preview/play/index.js world-preview/play/index.wasm world-preview/play/index.pck world-preview/index.html world-preview/styles.css world-preview/app.js world-preview/assets/gameplay-proof.png world-preview/assets/build-proof.json > proof/WORLD_SHA256SUMS.txt
          sha256sum -c proof/WORLD_SHA256SUMS.txt
      - name: V13 test premium RU/EN web portal, 320/390px touch, real 3-act CTA and actual Godot WebGL launch
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/iron-pulse-playwright/bin/python" iron-pulse-prologue/ci/world_portal_acceptance.py \
            --root iron-pulse-prologue/build/world-preview \
            --evidence iron-pulse-prologue/build/world-evidence \
            --sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            2>&1 | tee "$RUNNER_TEMP/iron-pulse-world-v13-browser.log"
          grep -q '"status": "PASS"' iron-pulse-prologue/build/world-evidence/world-portal-evidence.json
          grep -q '"genuine_webgl_launch": true' iron-pulse-prologue/build/world-evidence/world-portal-evidence.json
      - name: Retain build proof even if packaging fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iron-pulse-blackout-source-bound-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            iron-pulse-prologue/build/web
            iron-pulse-prologue/build/windows
            iron-pulse-prologue/build/proof
            iron-pulse-prologue/build/browser-evidence
            iron-pulse-prologue/build/world-preview
            iron-pulse-prologue/build/world-evidence
          if-no-files-found: warn
          retention-days: 14
