          grep -q '^IRON PULSE V4 REAL SCENE PASS:' "$RUNNER_TEMP/iron-pulse-v4-scene.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v4-scene.log"; then exit 1; fi
      - name: V5 physical three-sector environment, real player exploration and GPU instancing
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path iron-pulse-prologue --script res://tests/test_v5_world_sectors.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-v5-world.log"
          grep -q '^IRON PULSE V5 THREE WORLD SECTORS PASS:' "$RUNNER_TEMP/iron-pulse-v5-world.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v5-world.log"; then exit 1; fi
      - name: V6 narrative branches, crew/core ethics and encrypted-free atomic offline checkpoint integrity
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path iron-pulse-prologue --script res://tests/test_v6_story_checkpoint.gd 2>&1 | tee "$RUNNER_TEMP/iron-pulse-v6-story.log"
          grep -q '^IRON PULSE V6 STORY CHECKPOINT PASS:' "$RUNNER_TEMP/iron-pulse-v6-story.log"
          if grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:' "$RUNNER_TEMP/iron-pulse-v6-story.log"; then exit 1; fi
      - name: V6 physical scanner radio controls, bilingual transcript and real Continue save recovery
        shell: bash
        run: |
