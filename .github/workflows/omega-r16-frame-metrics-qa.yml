name: OSGARD Horizon R16 phone performance telemetry QA
on:
  pull_request:
    branches: [master]
    paths:
      - 'godot/empire-omega/**'
      - '.github/workflows/omega-r16-frame-metrics-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-native:
    runs-on: ubuntu-latest
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Generate audio and import actual runtime
        run: |
          python3 godot/empire-omega/tools/generate_audio.py
          python3 godot/empire-omega/tools/generate_patrol_audio.py
          godot --headless --editor --path godot/empire-omega --import --quit
      - name: Run authentic frame-time and touch input regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in v30_mobile_quick_actions v37_touch_commands v38_adaptive_graphics v39_frame_metrics; do
            timeout --signal=TERM --kill-after=5s 65s godot --headless --path godot/empire-omega --script "res://tests/$test.gd"
          done
