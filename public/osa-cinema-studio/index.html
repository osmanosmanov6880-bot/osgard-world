function recalculate(project){

 next.shots=order;
 for(const scene of next.scenes){const group=order.filter(sh=>sh.scene===scene.id);assert(group.length>0,'Сцена без кадров');scene.startSec=group[0].timelineStartSec;scene.endSec=group.at(-1).timelineEndSec;scene.durationSec=scene.endSec-scene.startSec;}
 return next;
}

 <section class="setting-card"><div><strong>${ui.lang==='ru'?'Восстановление JSON':'Restore JSON backup'}</strong><p>${ui.lang==='ru'?'Импорт проверяет схему, длительности, ID и защищённый статус неснятого фильма. Создайте резервную копию прежде чем заменить проект.':'Import validates schema, timings, IDs, and the unfilmed production gate. Back up before replacing local work.'}</p></div><button class="btn btn-outline" data-act="import-json">${tr('importJson')}</button></section>
 <section class="setting-card"><div><strong>${ui.lang==='ru'?'Сбросить локальные изменения':'Reset local changes'}</strong><p>${ui.lang==='ru'?'Возврат к исходному V52. Действие можно отменить внутри открытой вкладки.':'Restore the original V52 shotbook. You can undo within this open tab.'}</p></div><button class="btn btn-danger" data-act="reset-data">${tr('restore')}</button></section>
 <section class="setting-card"><div><strong>${ui.lang==='ru'?'Экспорт производственных данных':'Production data export'}</strong><p>SHOTLIST.CSV / TASKS.CSV / BUDGET.CSV</p></div><button class="btn btn-outline" data-act="export-all">${ui.lang==='ru'?'ЭКСПОРТ CSV':'EXPORT CSV'}</button></section>
 <section class="panel padded"><div class="panel-head"><h2>${tr('help')}</h2></div><div class="cost-row"><span>${ui.lang==='ru'?'Поиск кадра':'Focus shot search'}</span><span class="kbd">/</span></div><div class="cost-row"><span>${ui.lang==='ru'?'Отменить изменение':'Undo change'}</span><span class="kbd">CTRL + Z</span></div><div class="cost-row"><span>${ui.lang==='ru'?'Вернуть изменение':'Redo change'}</span><span class="kbd">CTRL + SHIFT + Z</span></div><div class="cost-row"><span>${ui.lang==='ru'?'Закрыть редактор':'Close editor'}</span><span class="kbd">ESC</span></div></section>
 <div class="notice">${ui.lang==='ru'?'Область данных — localStorage текущего браузера. Нет серверных аккаунтов, ролей доступа, общей базы или совместного монтажа. Для резервного копирования регулярно экспортируйте JSON.':'Data is stored in this browser’s localStorage. No cloud accounts, permission system, central database or live collaboration is implemented. Export JSON regularly.'}</div></div>`}
function render(){if(!project)return;document.documentElement.lang=ui.lang;renderNavigation();const title=titles[ui.page];$('topCrumb').textContent=tr(ui.page).toUpperCase();$('topTitle').textContent=title[ui.lang==='ru'?0:1];$('languageRu').classList.toggle('active',ui.lang==='ru');$('languageEn').classList.toggle('active',ui.lang==='en');$('languageRu').setAttribute('aria-pressed',String(ui.lang==='ru'));$('languageEn').setAttribute('aria-pressed',String(ui.lang==='en'));document.querySelectorAll('[data-i18n]').forEach(x=>x.textContent=tr(x.dataset.i18n));const pages={overview:renderOverview,shots:renderShots,timeline:renderTimeline,production:renderProduction,reviews:renderReviews,budget:renderBudget,screening:renderScreening,library:renderLibrary,settings:renderSettings};$('view').innerHTML=pages[ui.page]();setSavedIndicator(storageSaved);updateUndo();}
function showDrawer(html){const overlay=$('overlay');overlay.classList.remove('hidden');overlay.setAttribute('aria-hidden','false');$('drawer').innerHTML=html;ui.drawerOpen=true;const f=$('drawer').querySelector('button,input,textarea,select');if(f)f.focus()}
function hideDrawer(){ui.drawerOpen=false;$('overlay').classList.add('hidden');$('overlay').setAttribute('aria-hidden','true');$('drawer').innerHTML=''}
function drawerTop(kicker,title){return `<div class="drawer-top"><div class="eyebrow">${e(kicker)}</div><button class="close" data-act="close-drawer" aria-label="Close editor">×</button></div><h2 id="drawerTitle">${e(title)}</h2>`}
function openShot(id){const sh=project.shots.find(s=>s.id===id);if(!sh)return;ui.selectedShot=id;const s=project.scenes.find(x=>x.id===sh.scene);showDrawer(drawerTop(`SCENE ${String(sh.scene).padStart(2,'0')} / ${e(sh.id)}`,ui.lang==='ru'?'Редактор кадра':'Shot inspector')+`
 <img class="drawer-ref" src="${e(s.referenceFrame)}" alt="V48.1 reference; not photographed scene"><div class="notice">V48.1 CONCEPT REFERENCE · THIS NARRATIVE SHOT HAS NOT BEEN FILMED.</div>
 <div class="panel padded" style="margin-top:15px"><div class="mini-label">${tr('action')}</div><p class="info-value">${e(sh.actionRu)}</p><div class="two-grid" style="margin-top:16px"><div><div class="mini-label">LENS</div><div class="info-value">${sh.lensMm}mm · ${e(sh.framing)}</div></div><div><div class="mini-label">TIMECODE</div><div class="info-value">${timecode(sh.timelineStartSec)} → ${timecode(sh.timelineEndSec)}</div></div></div></div>
 <form id="shotForm" data-form="shot"><input type="hidden" name="id" value="${e(sh.id)}"><label class="field"><span>${tr('status')}</span><select class="input" name="status">${statusOptions(SHOT_STATES,sh.status)}</select></label>
 <div class="two-grid"><label class="field"><span>${tr('owner')}</span><input name="owner" class="input" maxlength="120" value="${e(sh.owner||'')}" placeholder="${e(tr('unknown'))}"></label><label class="field"><span>${tr('priority')}</span><select class="input" name="priority">${['normal','high','critical'].map(x=>`<option value="${x}" ${x===sh.priority?'selected':''}>${e(PRIORITY[x][ui.lang==='ru'?0:1])}</option>`).join('')}</select></label></div>
 <div class="two-grid"><label class="field"><span>${tr('duration')} (SEC)</span><input name="durationSec" class="input" type="number" min="1" max="600" step="1" value="${sh.durationSec}" required></label><label class="field"><span>${tr('shootDay')}</span><input name="shootDay" class="input" type="number" min="1" max="120" step="1" value="${sh.shootDay||''}" placeholder="—"></label></div>
 <label class="field"><span>${tr('notes')}</span><textarea name="notes" class="input" maxlength="8000" placeholder="${ui.lang==='ru'?'Точные задачи, реквизит, склейки, риски…':'Direction, props, cuts, risks…'}">${e(sh.notes||'')}</textarea></label><div class="drawer-footer"><span class="tiny">${e(sh.id)} · SOURCE V52</span><button class="btn" type="submit">${tr('save')} ↗</button></div></form>
 <button class="btn btn-outline" style="width:100%;margin-top:12px" data-act="review-this-shot">＋ ${tr('newReview')}</button>`)}
function openNewTask(){showDrawer(drawerTop('PRODUCTION / NEW TASK',tr('newTask'))+`<form id="taskForm" data-form="task"><label class="field"><span>${ui.lang==='ru'?'Описание задачи':'Task description'}</span><input name="titleRu" class="input" placeholder="${ui.lang==='ru'?'Конкретная проверяемая задача':'Concrete actionable task'}" minlength="3" maxlength="400" required autofocus></label><label class="field"><span>${tr('owner')}</span><input name="owner" class="input" maxlength="120"></label><div class="two-grid"><label class="field"><span>${tr('scene')}</span><select name="sceneId" class="input">${project.scenes.map(s=>`<option value="${s.id}">${s.id} · ${e(s.titleRu)}</option>`).join('')}</select></label><label class="field"><span>${tr('priority')}</span><select name="priority" class="input"><option value="normal">Normal</option><option value="high">High</option><option value="critical">Critical</option></select></label></div><div class="drawer-footer"><button class="btn" type="submit">${tr('save')} ↗</button></div></form>`)}
function openNewReview(id){const shot=id||ui.selectedShot||project.shots[0].id;const sel=project.shots.find(s=>s.id===shot)||project.shots[0];showDrawer(drawerTop('PRODUCTION / DIRECTOR NOTES',tr('newReview'))+`<form id="reviewForm" data-form="review"><label class="field"><span>${tr('shot')}</span><select name="shotId" class="input">${project.shots.map(s=>`<option value="${e(s.id)}" ${s.id===sel.id?'selected':''}>${e(s.id)} · ${e(s.actionRu.slice(0,38))}</option>`).join('')}</select></label><label class="field"><span>${ui.lang==='ru'?'Автор':'Author'}</span><input name="author" maxlength="100" class="input" value="${ui.lang==='ru'?'Режиссёр':'Director'}"></label><label class="field"><span>${tr('priority')}</span><select name="priority" class="input"><option value="normal">Normal</option><option value="high">High</option><option value="critical">Critical</option></select></label><label class="field"><span>${ui.lang==='ru'?'Замечание':'Review note'}</span><textarea name="text" class="input" minlength="3" maxlength="2500" placeholder="${ui.lang==='ru'?'Что именно нужно исправить и как проверить результат?':'Describe the issue and objective verification.'}" required></textarea></label><div class="drawer-footer"><button class="btn" type="submit">${tr('save')} ↗</button></div></form>`)}
function openSceneInTimeline(id){ui.selectedScene=Number(id);changePage('timeline')}
function download(name,content,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);notify(ui.lang==='ru'?`Подготовлен файл ${name}`:`Exported ${name}`)}
const timeLabel=()=>new Date().toISOString().slice(0,10);
function doExport(kind){if(kind==='json')download(`osa-cinema-v53-backup-${timeLabel()}.json`,projectSnapshot(project),'application/json');else if(kind==='shots')download('OSA_STUDIO_V53_SHOTS.csv',exportShotCSV(project),'text/csv;charset=utf-8');else if(kind==='tasks')download('OSA_STUDIO_V53_TASKS.csv',exportTaskCSV(project),'text/csv;charset=utf-8');else if(kind==='budget')download('OSA_STUDIO_V53_BUDGET.csv',exportBudgetCSV(project),'text/csv;charset=utf-8')}
function updateLanguage(lang){ui.lang=lang;savedPrefs();render()}
function savedPrefs(){safeWriteStorage(PREFS,JSON.stringify({lang:ui.lang}))}
function onClick(evt){const n=evt.target.closest('[data-nav],[data-shot],[data-scene],[data-act],[data-review-filter],[data-review-state],[data-video-locale],[data-seek]');if(!n)return;
 if(n.dataset.nav){changePage(n.dataset.nav);return}
 if(n.dataset.shot){openShot(n.dataset.shot);return}
 if(n.dataset.scene){openSceneInTimeline(n.dataset.scene);return}
 if(n.dataset.reviewFilter){ui.reviewStatus=n.dataset.reviewFilter;render();return}
 if(n.dataset.reviewState){commit(updateReview(project,n.dataset.reviewState,n.dataset.next));return}
 if(n.dataset.videoLocale){ui.videoLocale=n.dataset.videoLocale;ui.videoOverride=null;render();return}
 if(n.dataset.seek){const video=$('cinemaPlayer');if(video){const sec=+n.dataset.seek;const seek=()=>{try{video.currentTime=sec}catch{notify('Media not loaded',true)}};if(video.readyState<1)video.addEventListener('loadedmetadata',seek,{once:true});else seek();}return}
 switch(n.dataset.act){case 'close-drawer':hideDrawer();break;case 'new-task':openNewTask();break;case 'new-review':openNewReview();break;case 'review-this-shot':openNewReview(ui.selectedShot);break;case 'shot-export':doExport('shots');break;case 'task-export':doExport('tasks');break;case 'budget-export':doExport('budget');break;case 'export-json':doExport('json');break;case 'import-json':$('importFile').click();break;case 'attach-video':$('videoFile').click();break;case 'reset-video':if(ui.videoOverride){URL.revokeObjectURL(ui.videoOverride.url);ui.videoOverride=null;render()}break;case 'export-all':doExport('shots');setTimeout(()=>doExport('tasks'),150);setTimeout(()=>doExport('budget'),300);break;case 'reset-data':if(confirm(ui.lang==='ru'?'Сбросить текущие изменения к оригинальному V52? Сначала экспортируйте резервную копию.':'Reset changes to original V52? Export a backup first.'))commit(clone(seed));break;default:break;}}
function onSubmit(evt){const form=evt.target.closest('[data-form]');if(!form)return;evt.preventDefault();const d=new FormData(form);try{if(form.dataset.form==='shot'){const id=String(d.get('id'));const n=Number(d.get('durationSec'));const day=d.get('shootDay')?Number(d.get('shootDay')):null;commit(updateShot(project,id,{status:String(d.get('status')),owner:String(d.get('owner')),priority:String(d.get('priority')),durationSec:n,shootDay:day,notes:String(d.get('notes'))}),ui.lang==='ru'?'Кадр обновлён':'Shot saved');}
 else if(form.dataset.form==='task')commit(addTask(project,{titleRu:String(d.get('titleRu')),owner:String(d.get('owner')),priority:String(d.get('priority')),sceneId:Number(d.get('sceneId'))}),ui.lang==='ru'?'Задача создана':'Task added');
 else if(form.dataset.form==='review')commit(addReview(project,{shotId:String(d.get('shotId')),author:String(d.get('author')),text:String(d.get('text')),priority:String(d.get('priority'))}),ui.lang==='ru'?'Замечание сохранено':'Review saved');hideDrawer();}catch(error){notify(error.message,true)}}
function onChange(evt){const t=evt.target;if(t.dataset.taskStage){try{commit(updateTask(project,t.dataset.taskStage,{stage:t.value}))}catch(error){notify(error.message,true)}return}
 if(t.dataset.gateStage){try{commit(updateMilestone(project,t.dataset.gateStage,t.value))}catch(error){notify(error.message,true)}return}
 if(t.dataset.budget){const next=Number(t.value);try{commit(updateBudget(project,{[t.dataset.budget]:next}))}catch(error){notify(error.message,true)}return}
 if(t.id==='sceneFilter'){ui.shotScene=t.value;render();return}
 if(t.id==='statusFilter'){ui.shotStatus=t.value;render();return}}
function onInput(evt){if(evt.target.id!=='shotSearch')return;const input=evt.target;ui.shotSearch=input.value;const cursor=input.selectionStart;render();const replacement=$('shotSearch');replacement?.focus({preventScroll:true});if(replacement&&cursor!==null)replacement.setSelectionRange(cursor,cursor)}
function wireEvents(){document.body.addEventListener('click',onClick);document.body.addEventListener('submit',onSubmit);document.body.addEventListener('change',onChange);document.body.addEventListener('input',onInput);$('languageRu').addEventListener('click',()=>updateLanguage('ru'));$('languageEn').addEventListener('click',()=>updateLanguage('en'));$('undoBtn').addEventListener('click',undo);$('redoBtn').addEventListener('click',redo);$('exportBtn').addEventListener('click',()=>doExport('json'));
 $('importFile').addEventListener('change',async evt=>{const file=evt.target.files?.[0];evt.target.value='';if(!file)return;try{if(file.size>3000000)throw new Error('Archive is too large');const next=importSnapshot(await file.text());if(!confirm(ui.lang==='ru'?'Заменить текущий проект данными из архива?':'Replace the current project with imported data?'))return;commit(next,ui.lang==='ru'?'Резервная копия загружена':'Backup restored')}catch(error){notify(error.message,true)}});
 $('videoFile').addEventListener('change',evt=>{const file=evt.target.files?.[0];evt.target.value='';if(!file)return;if(!['video/mp4','video/webm','video/quicktime'].includes(file.type)&&!(/\.(mp4|webm|mov)$/i.test(file.name))){notify('Choose MP4 / WEBM / MOV',true);return}if(ui.videoOverride)URL.revokeObjectURL(ui.videoOverride.url);ui.videoOverride={name:file.name,url:URL.createObjectURL(file),type:file.type||'video/mp4'};ui.page='screening';render()});
 window.addEventListener('keydown',event=>{const tag=document.activeElement?.tagName;const editing=['INPUT','TEXTAREA','SELECT'].includes(tag);if(event.key==='Escape'&&ui.drawerOpen){hideDrawer();return}if(editing)return;if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'){event.preventDefault();if(event.shiftKey)redo();else undo()}else if(event.key==='/'&&!event.ctrlKey&&!event.metaKey){event.preventDefault();if(ui.page!=='shots')changePage('shots');$('shotSearch')?.focus()}});
 window.addEventListener('storage',evt=>{if(evt.key!==STORAGE||!evt.newValue)return;try{const next=JSON.parse(evt.newValue).project;validateProject(next);if(JSON.stringify(next)!==JSON.stringify(project)){project=recalculate(next);history=[];future=[];render();notify(ui.lang==='ru'?'Данные обновлены из другой вкладки':'Updated from another tab')}}catch{}});
 window.addEventListener('hashchange',()=>{const next=location.hash.replace(/^#/,'');if(titles[next]&&next!==ui.page){ui.page=next;render()}});
}
async function boot(){try{const resp=await Promise.resolve({ok:true,json:async()=>JSON.parse(__SEED_JSON)});if(!resp.ok)throw new Error('Unable to load V52 project source');seed=await resp.json();validateProject(seed);project=seed;try{const key='osa_studio_v53_probe';localStorage.setItem(key,'1');localStorage.removeItem(key);storageSaved=true}catch{storageSaved=false}const pref=safeReadStorage(PREFS);if(pref){try{const parsed=JSON.parse(pref);if(['ru','en'].includes(parsed.lang))ui.lang=parsed.lang}catch{}}
 const data=safeReadStorage(STORAGE);if(data){try{const parsed=JSON.parse(data);validateProject(parsed.project);if(parsed.project.id!==seed.id)throw Error('Mismatched workspace');project=recalculate(parsed.project)}catch(error){console.warn('Corrupt local data ignored',error);notify(ui.lang==='ru'?'Локальная копия повреждена. Загрузили исходную V52.':'Local backup invalid. Original V52 restored.',true)}}
 const hash=location.hash.replace(/^#/,'');ui.page=titles[hash]?hash:'overview';ui.selectedScene=project.scenes[0].id;wireEvents();render();
 }catch(error){console.error(error);$('view').innerHTML=`<div class="empty"><strong>OSA STUDIO — STARTUP HOLD</strong><span>${e(error.message)}</span><span>Serve the app folder using a local HTTP server. Do not open index.html with file://</span></div>`;}}
boot();
</script></body>
</html>
