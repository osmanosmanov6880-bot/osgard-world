<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b11"><title>SABLEFAULT WORLD 3.2 — OSGARD PLAY</title><style>html,body{margin:0;min-height:100%;background:#070b11;color:#d9f6ff;font:16px system-ui}main{min-height:100vh;display:grid;place-content:center;text-align:center;padding:20px}h1{letter-spacing:.12em}p{color:#91b5c6}button{background:#6ee7f5;color:#041017;border:0;padding:13px 20px;border-radius:8px;cursor:pointer}button[hidden]{display:none}</style></head><body><main><h1>SABLEFAULT WORLD</h1><p id="status" role="status">Загрузка игровой сборки 3.2…</p><button id="retry" hidden>Повторить загрузку</button></main><script>
(async function boot(){
const status=document.getElementById('status'),retry=document.getElementById('retry');
retry.hidden=true;
try{
const urls=[1,2,3].map(n=>'/games/sablefault-world/parts/world32-'+n+'.txt');
const parts=await Promise.all(urls.map(async u=>{const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status+' '+u);return r.text()}));
const html=parts.join('\n');
if(!html.startsWith('<!doctype html>')||!html.includes('SABLEFAULT WORLD')||html.length<1000000)throw Error('Игровая сборка повреждена или загружена не полностью');
document.open();document.write(html);document.close();
}catch(error){status.textContent='Не удалось загрузить игру: '+error.message;retry.hidden=false;retry.onclick=()=>location.reload();console.error(error)}
})();
</script></body></html>
