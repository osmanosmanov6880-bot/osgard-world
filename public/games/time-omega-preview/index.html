  <script>
(function(){
'use strict';
// OSGARD TIME OMEGA 3.0. Dependency-free, deterministic simulation engine.
// All mutations happen on copies: the UI never writes directly to game state.
const VERSION = 3;
const DISTRICTS = ['forum', 'housing', 'lower', 'aqueduct'];
const POLICIES = ['balance', 'industry', 'energy', 'welfare'];
const TABS = ['council', 'build', 'research', 'chronicle'];
const MAX_LEVEL = 4;
const BUILDINGS = Object.freeze({
  council:   { district:'forum',    cost:230, rise:1.52, upkeep:9  },
  clinic:    { district:'forum',    cost:205, rise:1.45, upkeep:8  },
  academy:   { district:'forum',    cost:270, rise:1.50, upkeep:11 },
  homes:     { district:'housing',  cost:190, rise:1.48, upkeep:5  },
  gardens:   { district:'housing',  cost:175, rise:1.42, upkeep:6  },
  school:    { district:'housing',  cost:240, rise:1.50, upkeep:8  },
  market:    { district:'lower',    cost:230, rise:1.50, upkeep:8  },
  factory:   { district:'lower',    cost:310, rise:1.55, upkeep:15 },
  depot:     { district:'lower',    cost:170, rise:1.48, upkeep:5  },
  plant:     { district:'aqueduct', cost:255, rise:1.54, upkeep:10 },
  purifier:  { district:'aqueduct', cost:230, rise:1.48, upkeep:9  },
  reservoir: { district:'aqueduct', cost:185, rise:1.43, upkeep:5  }
});
const RESEARCH = Object.freeze({
  grid:       { science:45,  cost:175, requires:[] },
  filtration: { science:50,  cost:185, requires:[] },
  councilAI:  { science:65,  cost:245, requires:[] },
  commerce:   { science:75,  cost:265, requires:[] },
  agronomy:   { science:70,  cost:210, requires:[] },
  automation: { science:130, cost:410, requires:['grid','commerce'] }
});
const DECISIONS = ['aid', 'decree', 'bonds', 'repay'];
const CRISES = ['drought','strike','fire','blackout','epidemic'];
const STAGES = [
  [ {id:'energy', target:60}, {id:'water',target:60}, {id:'stability',target:75}, {id:'turn',target:5} ],
  [ {id:'population',target:14500}, {id:'market',target:2}, {id:'treasury',target:1200}, {id:'turn',target:10} ],
  [ {id:'population',target:16000}, {id:'stability',target:85}, {id:'technology',target:3}, {id:'food',target:60}, {id:'turn',target:16} ]
];
const BUILDING_KEYS = Object.keys(BUILDINGS);
const RESEARCH_KEYS = Object.keys(RESEARCH);
const clamp = (n,low,high) => Math.max(low,Math.min(high,n));
const clone = value => JSON.parse(JSON.stringify(value));
const num = (x,low,high,integer=false) => typeof x==='number'&&Number.isFinite(x)&&x>=low&&x<=high&&(!integer||Number.isInteger(x));
const hasOnlyKnownKeys = (obj,keys) => obj&&typeof obj==='object'&&!Array.isArray(obj)&&Object.keys(obj).every(k=>keys.includes(k));
const bound = x => Math.round(clamp(x,0,100));

function createGame(seed=781413) {
  const buildings = Object.fromEntries(BUILDING_KEYS.map(k=>[k,0]));
  const technologies = Object.fromEntries(RESEARCH_KEYS.map(k=>[k,false]));
  const s = {
    version:VERSION, seed:(seed>>>0)||781413, turn:1,
    treasury:1000, population:12800, energy:93, water:87, food:83,
    stability:72, trust:[62,65,59,70], science:24, debt:0,
    tax:10, course:'balance', selected:'forum', tab:'council',
    buildings, technologies, actionsLeft:2, acted:[], incident:null,
    stage:0, status:'playing', criticalTurns:0, crisesResolved:0,
    log:[], history:[], tutorialSeen:false
  };
  s.history=[historyPoint(s)];
  return s;
}
function historyPoint(s) {return {turn:s.turn,treasury:s.treasury,population:s.population,stability:s.stability,energy:s.energy,water:s.water,food:s.food};}
function getBuildCost(s,id) {
  if (!BUILDINGS[id]) return null;
  return Math.round(BUILDINGS[id].cost*Math.pow(BUILDINGS[id].rise,s.buildings[id])*(s.technologies.automation?.9:1));
}
function districtLevel(s,id){return BUILDING_KEYS.filter(k=>BUILDINGS[k].district===id).reduce((n,k)=>n+s.buildings[k],0);}
function averageTrust(s) {return Math.round(s.trust.reduce((a,b)=>a+b,0)/4);}
function technologyCount(s) {return RESEARCH_KEYS.filter(k=>s.technologies[k]).length;}
function cityScore(s){return Math.round(clamp((s.stability+averageTrust(s)+s.energy+s.water+s.food)/5 + Math.min(8,s.population/2500)+technologyCount(s)*1.8,0,100));}

// Forecast and real turn use exactly the same math, avoiding misleading projections.
function getForecast(s) {
  const b=s.buildings, t=s.technologies;
  const policy=s.course;
  const revenue=Math.round(33+s.population*s.tax/2000 +b.market*48+b.factory*75+b.depot*7 + (policy==='industry'?32:0)+(t.commerce?27:0)+(t.automation?24:0));
  const upkeep=Object.entries(BUILDINGS).reduce((n,[k,v])=>n+s.buildings[k]*v.upkeep,0);
  const expenses=Math.round(54+s.population/1300+upkeep+(policy==='welfare'?16:0)+Math.ceil(s.debt*.04));
  const powerSupply=29+b.plant*21+(policy==='energy'?17:0)+(t.grid?9:0)+(t.automation?8:0);
  const powerNeed=Math.round(28+s.population/1200+b.homes*4+b.factory*13+b.market*3+b.purifier*2);
  const waterSupply=30+b.purifier*19+b.reservoir*9+(t.filtration?11:0);
  const waterNeed=Math.round(22+s.population/1750+b.factory*5+b.homes*3+b.gardens*2);
  const foodSupply=27+b.gardens*13+b.depot*10+b.market*3+(t.agronomy?13:0);
  const foodNeed=Math.round(29+s.population/2600+b.homes*3);
  const nextEnergy=bound(s.energy+powerSupply-powerNeed);
  const nextWater=bound(s.water+waterSupply-waterNeed);
  const nextFood=bound(s.food+foodSupply-foodNeed);
  const resourceStress=[nextEnergy,nextWater,nextFood].filter(n=>n<25).length;
  const severeStress=[nextEnergy,nextWater,nextFood].filter(n=>n<8).length;
  const housingCapacity=13000+b.homes*1700;
  const socialBonus=(policy==='welfare'?19:0)+b.clinic*8+b.school*5;
  const healthy=nextEnergy>=25&&nextWater>=25&&nextFood>=25;
  let populationDelta=healthy?Math.round(48+socialBonus+b.homes*22):Math.round(-80*resourceStress-150*severeStress);
  if(s.population+populationDelta>housingCapacity) populationDelta=Math.max(-150,Math.round((housingCapacity-s.population)/6));
  if (s.population<9000&&populationDelta<0) populationDelta=Math.max(populationDelta,-200);
  const taxDiscontent=s.tax>=30?-7:s.tax>=21?-4:s.tax<=6?2:0;
  const polluted=b.factory>0&&!t.filtration ? -b.factory:0;
  const trustDelta=taxDiscontent+(policy==='welfare'?3:0)+b.clinic+(t.councilAI?1:0)+(healthy?0:-3*resourceStress);
  const stabilityDelta=Math.round((policy==='balance'?2:0)+b.council+(t.councilAI?2:0)+b.gardens*.5+(averageTrust(s)<35?-3:0)+
    (s.treasury+revenue-expenses < -100?-4:0)+ (healthy?0:-6*resourceStress) + (s.tax>25?-3:0)+(polluted));
  const scienceGain=6+b.academy*10+b.school*6+(t.councilAI?2:0);
  return {revenue,expenses,net:revenue-expenses,powerSupply,powerNeed,waterSupply,waterNeed,foodSupply,foodNeed,
    energyDelta:nextEnergy-s.energy,waterDelta:nextWater-s.water,foodDelta:nextFood-s.food,
    energyAfter:nextEnergy,waterAfter:nextWater,foodAfter:nextFood,populationDelta,trustDelta,stabilityDelta,scienceGain,housingCapacity};
}

function addLog(s,type,data={}) {
  s.log.unshift({turn:s.turn,type,data});
  s.log=s.log.slice(0,55);
}
function assignVictory(s) {
  if(s.status!=='playing')return;
  if(s.stage>2)return;
  const done=getObjectives(s).every(x=>x.done);
  if(done){const old=s.stage;s.stage+=1;addLog(s,'chapter',{stage:old+1});if(s.stage===3){s.status='victory';addLog(s,'victory');}else{s.treasury+=120;s.science+=20;addLog(s,'reward',{treasury:120,science:20});}}
}
function getObjectives(s) {
  const checks={energy:s.energy,water:s.water,stability:s.stability,turn:s.turn,population:s.population,
    market:s.buildings.market,treasury:s.treasury,technology:technologyCount(s),food:s.food};
  return (STAGES[Math.min(s.stage,2)]||[]).map(x=>({...x,current:checks[x.id],done:checks[x.id]>=x.target,progress:clamp(100*checks[x.id]/x.target,0,100)}));
}
function ok(s){return {ok:true,state:s};}
function fail(code){return {ok:false,error:code};}
const checkPlaying=s=>s.status==='playing';
function updatePolicy(state,patch) {
  if(!checkPlaying(state))return fail('ended');
  if(patch.tax!==undefined&&(!Number.isInteger(patch.tax)||patch.tax<0||patch.tax>40))return fail('invalid');
  if(patch.course!==undefined&&!POLICIES.includes(patch.course))return fail('invalid');
  const s=clone(state);
  if(patch.tax!==undefined)s.tax=patch.tax;
  if(patch.course!==undefined)s.course=patch.course;
  return ok(s);
}
function selectDistrict(state,id) {
  if(!DISTRICTS.includes(id))return fail('invalid');
  return ok({...state,selected:id});
}
function selectTab(state,id) {
  if(!TABS.includes(id))return fail('invalid');
  return ok({...state,tab:id});
}
function setTutorialSeen(state){return ok({...state,tutorialSeen:true});}
function construct(state,id) {
  if(!checkPlaying(state))return fail('ended');
  const building=BUILDINGS[id];
  if(!building)return fail('invalid');
  if(state.actionsLeft<=0)return fail('noActions');
  if(state.buildings[id]>=MAX_LEVEL)return fail('maxLevel');
  const cost=getBuildCost(state,id);
  if(state.treasury<cost)return fail('notEnough');
  const s=clone(state);s.treasury-=cost;s.actionsLeft--;s.buildings[id]++;
  if(id==='clinic')s.stability=bound(s.stability+2);
  if(id==='council')s.trust[0]=bound(s.trust[0]+3);
  if(id==='gardens')s.food=bound(s.food+8);
  if(id==='purifier')s.water=bound(s.water+10);
  if(id==='plant')s.energy=bound(s.energy+12);
  addLog(s,'build',{id,level:s.buildings[id],cost});assignVictory(s);
  return ok(s);
}
function enact(state,id) {
  if(!checkPlaying(state))return fail('ended');
  if(!DECISIONS.includes(id))return fail('invalid');
  if(state.acted.includes(id))return fail('alreadyActed');
  const prices={aid:140,decree:100,bonds:0,repay:250};
  if(id==='repay'&&state.debt<1)return fail('noDebt');
  if(state.treasury<prices[id])return fail('notEnough');
  const s=clone(state);
  if(id==='aid') {s.treasury-=140;s.trust=s.trust.map(v=>bound(v+7));s.stability=bound(s.stability+3);}
  if(id==='decree') {s.treasury-=100;s.stability=bound(s.stability+8);s.trust[0]=bound(s.trust[0]+4);}
  if(id==='bonds'){s.treasury+=230;s.debt+=270;s.stability=bound(s.stability-3);s.trust=s.trust.map(v=>bound(v-2));}
  if(id==='repay'){const payment=Math.min(250,s.debt);s.treasury-=payment;s.debt-=payment;}
  s.acted.push(id);addLog(s,'decision',{id});assignVictory(s);
  return ok(s);
}
function research(state,id) {
  if(!checkPlaying(state))return fail('ended');
  const tech=RESEARCH[id];if(!tech)return fail('invalid');
  if(state.technologies[id])return fail('researched');
  if(state.actionsLeft<=0)return fail('noActions');
  if(tech.requires.some(k=>!state.technologies[k]))return fail('prerequisite');
  if(state.science<tech.science)return fail('notScience');
  if(state.treasury<tech.cost)return fail('notEnough');
  const s=clone(state);s.science-=tech.science;s.treasury-=tech.cost;s.actionsLeft--;s.technologies[id]=true;
  addLog(s,'research',{id});assignVictory(s);return ok(s);
}
// Seeded generator ensures identical crises when a save is replayed.
function random(s) {s.seed=((s.seed*1664525+1013904223)>>>0);return s.seed/4294967296;}
function chooseCrisis(s) {
  const pool=[];
  if(s.water<50)pool.push('drought','drought');
  if(averageTrust(s)<55)pool.push('strike','strike');
  if(s.buildings.factory>0)pool.push('fire');
  if(s.energy<50)pool.push('blackout','blackout');
  if(s.food<50)pool.push('epidemic');
  pool.push(...CRISES);
  return pool[Math.floor(random(s)*pool.length)];
}
function advanceTurn(state) {
  if(!checkPlaying(state))return fail('ended');
  if(state.incident)return fail('incident');
  const s=clone(state), f=getForecast(s);
  s.treasury+=f.net;s.energy=f.energyAfter;s.water=f.waterAfter;s.food=f.foodAfter;
  s.population=Math.max(5000,s.population+f.populationDelta);
  s.stability=bound(s.stability+f.stabilityDelta);
  s.trust=s.trust.map((v,i)=>bound(v+f.trustDelta+(i===2&&s.buildings.factory>0&&!s.technologies.filtration?-2:0)));
  s.science=clamp(s.science+f.scienceGain,0,200000);
  s.turn++;s.actionsLeft=2;s.acted=[];
  addLog(s,'turn',{net:f.net,population:f.populationDelta,energy:f.energyDelta,water:f.waterDelta,food:f.foodDelta});
  s.criticalTurns=s.stability<=3||s.treasury<=-800?s.criticalTurns+1:0;
  if(s.criticalTurns>=2){s.status='defeat';addLog(s,'defeat');}
  if(s.status==='playing'&&s.turn%3===0){s.incident=chooseCrisis(s);addLog(s,'incident',{id:s.incident});}
  assignVictory(s);
  s.history.push(historyPoint(s));s.history=s.history.slice(-35);
  return ok(s);
}
function resolveCrisis(state,option) {
  if(!checkPlaying(state))return fail('ended');
  if(!state.incident)return fail('noIncident');
  if(!Number.isInteger(option)||option<0||option>2)return fail('invalid');
  const cost=option===0?175:0;
  if(state.treasury<cost)return fail('notEnough');
  const s=clone(state),id=s.incident;
  if(option===0){s.treasury-=175;s.stability=bound(s.stability+3);s.trust=s.trust.map(v=>bound(v+3));
    if(id==='drought')s.water=bound(s.water+24);
    else if(id==='blackout')s.energy=bound(s.energy+24);
    else if(id==='epidemic')s.food=bound(s.food+22);
    else if(id==='fire')s.treasury+=35;
  }
  if(option===1){s.trust=s.trust.map(v=>bound(v-4));s.stability=bound(s.stability-1);
    if(id==='drought')s.water=bound(s.water+12);
    else if(id==='blackout')s.energy=bound(s.energy+12);
    else if(id==='epidemic')s.food=bound(s.food+10);
    else if(id==='strike')s.treasury-=40;
  }
  if(option===2){s.stability=bound(s.stability-11);s.treasury-=80;
    if(id==='drought')s.water=bound(s.water-16);
    if(id==='blackout')s.energy=bound(s.energy-16);
    if(id==='epidemic')s.food=bound(s.food-16);
    if(id==='strike')s.trust=s.trust.map(v=>bound(v-8));
    if(id==='fire')s.buildings.market=Math.max(0,s.buildings.market-1);
  }
  s.incident=null;s.crisesResolved++;addLog(s,'resolve',{id,option});assignVictory(s);
  // An emergency decision immediately affects the current history point.
  s.history[s.history.length-1]=historyPoint(s);
  return ok(s);
}

const isEntry = e => e&&num(e.turn,1,100001,true)&&typeof e.type==='string'&&e.type.length<30&&
  e.data&&typeof e.data==='object'&&!Array.isArray(e.data)&&JSON.stringify(e).length<=1200;
function isValidState(s) {
  return !!(s&&s.version===VERSION&&num(s.seed,1,4294967295,true)&&num(s.turn,1,100000,true)&&
    num(s.treasury,-20000000,20000000)&&num(s.population,5000,3000000)&&
    ['energy','water','food','stability'].every(k=>num(s[k],0,100))&&num(s.science,0,200000)&&num(s.debt,0,20000000)&&
    Array.isArray(s.trust)&&s.trust.length===4&&s.trust.every(x=>num(x,0,100))&&
    num(s.tax,0,40,true)&&POLICIES.includes(s.course)&&DISTRICTS.includes(s.selected)&&TABS.includes(s.tab)&&
    hasOnlyKnownKeys(s.buildings,BUILDING_KEYS)&&BUILDING_KEYS.every(k=>num(s.buildings[k],0,MAX_LEVEL,true))&&
    hasOnlyKnownKeys(s.technologies,RESEARCH_KEYS)&&RESEARCH_KEYS.every(k=>typeof s.technologies[k]==='boolean')&&
    num(s.actionsLeft,0,2,true)&&Array.isArray(s.acted)&&s.acted.length<=4&&s.acted.every(x=>DECISIONS.includes(x))&&new Set(s.acted).size===s.acted.length&&
    (s.incident===null||CRISES.includes(s.incident))&&num(s.stage,0,3,true)&&['playing','victory','defeat'].includes(s.status)&&
    num(s.criticalTurns,0,100000,true)&&num(s.crisesResolved,0,100000,true)&&typeof s.tutorialSeen==='boolean'&&
    Array.isArray(s.log)&&s.log.length<=55&&s.log.every(isEntry)&&
    Array.isArray(s.history)&&s.history.length>=1&&s.history.length<=35&&s.history.every(h=>h&&num(h.turn,1,100000,true)&&num(h.treasury,-20000000,20000000)&&num(h.population,5000,3000000)&&['stability','energy','water','food'].every(k=>num(h[k],0,100))));
}
function migrateLegacy(input) {
  if(!input||typeof input!=='object'||Array.isArray(input)||!
    num(input.turn,1,100000,true)||!num(input.treasury,-10000000,10000000)||!num(input.population,0,3000000)||
    !num(input.energy,0,100)||!num(input.stability,0,100)||!num(input.tax,0,40,true)||
    !num(input.course,0,3,true)||!Array.isArray(input.trust)||input.trust.length!==4||!input.trust.every(x=>num(x,0,100))||
    !Array.isArray(input.buildings)||input.buildings.length!==4||!input.buildings.every(x=>num(x,0,10000,true)))throw new Error('legacy-invalid');
  const s=createGame();s.turn=input.turn;s.treasury=input.treasury;s.population=Math.max(5000,Math.round(input.population));
  s.energy=input.energy;s.stability=input.stability;s.trust=input.trust.slice();s.tax=input.tax;
  s.course=POLICIES[input.course];s.selected=DISTRICTS.includes(input.selected)?input.selected:'forum';
  s.tab=TABS.includes(input.tab)?input.tab:'council';
  const oldKeys=['homes','plant','market','council'];
  oldKeys.forEach((k,i)=>{s.buildings[k]=Math.min(MAX_LEVEL,input.buildings[i]);});
  if(input.incident&&num(input.incident.type,0,2,true))s.incident=['drought','strike','fire'][input.incident.type];
  s.crisesResolved= num(input.crisesResolved,0,100000,true)?input.crisesResolved:0;
  s.log=(Array.isArray(input.logs)?input.logs:[]).slice(0,35).filter(x=>typeof x==='string'&&x.length<500)
    .map(message=>({turn:s.turn,type:'legacy',data:{message}}));
  s.history=[historyPoint(s)];
  if(!isValidState(s))throw new Error('legacy-invalid');
  return s;
}
function parseSave(text) {
  if(typeof text!=='string'||text.length>250000)throw new Error('file-too-large');
  let json;try{json=JSON.parse(text);}catch{throw new Error('json-invalid');}
  if(!json||typeof json!=='object')throw new Error('save-invalid');
  if(json.format&&json.format!=='osgard-time-omega')throw new Error('format-invalid');
  if(json.format&&![2,3].includes(json.version))throw new Error('version-invalid');
  const payload=json.format?json.state:json;
  if(payload?.version===VERSION){if(!isValidState(payload))throw new Error('save-invalid');return clone(payload);}
  if(payload?.version!==undefined&&payload.version!==2)throw new Error('version-invalid');
  return migrateLegacy(payload);
}
function serializeSave(state) {
  if(!isValidState(state))throw new Error('save-invalid');
  return JSON.stringify({format:'osgard-time-omega',version:VERSION,createdAt:new Date().toISOString(),state},null,2);
}

const langCodes = ['ru','en','zh'];
const words = lang => I18N[langCodes.includes(lang)?lang:'ru'];
const formatNumber = (value,lang) => Math.round(value).toLocaleString(lang==='zh'?'zh-CN':lang==='en'?'en-US':'ru-RU');
const formatSigned = (value,lang) => (value>0?'+':'')+formatNumber(value,lang);
function entryText(entry,lang){
  const d=words(lang), data=entry.data||{};
  switch(entry.type){
    case 'turn': return `${d.historyLabels.turn} · ${formatSigned(data.net||0,lang)} ₽`;
    case 'build': return `${d.buildings[data.id]?.[0]||'?'} · ${d.labels.level} ${data.level||1}`;
    case 'decision':return d.orders[data.id]?.[0]||'?';
    case 'research':return d.tech[data.id]?.[0]||'?';
    case 'incident':return d.crises[data.id]?.[0]||'?';
    case 'resolve':return `${d.crises[data.id]?.[0]||'?'} · ${d.crisisChoices[data.option]||''}`;
    case 'chapter':return `${d.completed}: ${d.chapters[(data.stage||1)-1]||''}`;
    case 'reward':return `${formatSigned(data.treasury||0,lang)} ₽ · ${formatSigned(data.science||0,lang)} ${d.labels.science}`;
    case 'victory':return d.victory;
    case 'defeat':return d.defeat;
    case 'legacy':return typeof data.message==='string'?data.message:'';
    default:return entry.type;
  }
}

  slider.addEventListener('input',()=>{
    const r=updatePolicy(state,{tax:Number(slider.value)});
    if(!r.ok)return;
    state=r.state;value.textContent=state.tax+'%';saveSilently();renderStats();renderForecast();renderGoals();renderResources();
  });
  root.append(create('div','inner-kicker','02 / '+d.policy));
  const policies=create('div','policy-grid');
  for(const id of POLICIES){const opt=create('button','policy'+(state.course===id?' active':''));opt.type='button';opt.setAttribute('aria-pressed',String(state.course===id));opt.append(create('b','',d.policies[id][0]),create('small','',d.policies[id][1]));opt.addEventListener('click',()=>{changeState(updatePolicy(state,{course:id}));});policies.append(opt);}
  root.append(policies);
  root.append(create('div','inner-kicker','03 / '+d.order));
  const list=create('div','options-list');
  const numbers={aid:'−140 ₽',decree:'−100 ₽',bonds:'+230 ₽',repay:'−250 ₽'};
  for(const id of DECISIONS){
    const done=state.acted.includes(id);
    const card=create('button','option-card');card.type='button';card.disabled=done||(id==='repay'&&state.debt===0)||(id!=='bonds'&&state.treasury<(id==='aid'?140:id==='decree'?100:Math.min(250,state.debt)));
    card.append(addChild(create('span','text-block'),create('b','',d.orders[id][0]),create('small','',d.orders[id][1])));
    const right=create('span','right');right.append(create('em','',done?'✓':numbers[id]));card.append(right);card.addEventListener('click',()=>{if(changeState(enact(state,id)))flashSuccess();});list.append(card);
  }
  root.append(list);
  const box=create('div','count-strip');box.append(create('span','',d.labels.debt),create('strong','',money(state.debt)));box.style.marginTop='14px';root.append(box);
}
function renderBuild(){
  const d=dict(),root=$('mainContent');clear(root);
  root.append(create('div','inner-kicker',d.buildTitle));root.append(create('p','hint',d.buildHint));
  const head=create('div','count-strip');head.append(create('span','',d.districts[state.selected]),create('strong','',d.labels.actions+' '+state.actionsLeft));root.append(head);
  const list=create('div','options-list');
  for(const [id,spec] of Object.entries(BUILDINGS)){
    if(spec.district!==state.selected)continue;
    const level=state.buildings[id],cost=getBuildCost(state,id),maximum=level>=MAX_LEVEL;
    const card=create('button','option-card');card.type='button';card.dataset.build=id;
    card.disabled=maximum||state.status!=='playing'||state.actionsLeft===0||state.treasury<cost;
    card.append(addChild(create('span','text-block'),create('b','',d.buildings[id][0]),create('small','',d.buildings[id][1])));
    const side=create('span','right');side.append(create('em','',maximum?'✓':'−'+money(cost)),create('span','',maximum?d.maxLevel:d.labels.level+' '+level+' / '+MAX_LEVEL));card.append(side);
    card.addEventListener('click',()=>{if(changeState(construct(state,id)))flashSuccess();});list.append(card);
  }
  root.append(list);
}
function renderResearch(){
  const d=dict(),root=$('mainContent');clear(root);
  root.append(create('div','inner-kicker',d.researchTitle));root.append(create('p','hint',d.researchHint));
  const header=create('div','count-strip');header.append(create('span','',d.labels.science),create('strong','',formatNumber(state.science,lang)));root.append(header);
  const list=create('div','options-list');
  for(const [id,spec] of Object.entries(RESEARCH)){
    const completed=state.technologies[id],missing=spec.requires.filter(k=>!state.technologies[k]);
    const card=create('button','option-card'+(completed?' active':'')+(missing.length?' locked':''));card.type='button';card.dataset.tech=id;
    const locked=!!missing.length;
    card.disabled=state.status!=='playing'||completed||locked||state.actionsLeft<=0||state.science<spec.science||state.treasury<spec.cost;
    const text=create('span','text-block');text.append(create('b','',d.tech[id][0]),create('small','',d.tech[id][1]));
    if(locked)text.append(create('small','tech-tags',d.requires+' '+missing.map(k=>d.tech[k][0]).join(', ')));
    const right=create('span','right');right.append(create('em','',completed?'✓':money(spec.cost)),create('span','',completed?d.researched:spec.science+' '+d.labels.science));
    card.append(text,right);card.addEventListener('click',()=>{if(changeState(research(state,id)))flashSuccess();});list.append(card);
  }
  root.append(list);
}
function renderChronicle(){
  const d=dict(),root=$('mainContent');clear(root);
  root.append(create('div','inner-kicker',d.history));
  if(!state.log.length){root.append(create('div','empty',d.historyEmpty));return;}
  const list=create('div','chronicle-feed');
  for(const entry of state.log){
    const row=create('div','feed-row');const title=create('b','',d.historyLabels[entry.type]||entry.type),stamp=create('small','stamp',d.labels.turn+' '+entry.turn);
    title.append(stamp);
    row.append(title,create('small','',entryText(entry,lang)));list.append(row);
  }
  root.append(list);
}
function renderChamber(){
  const d=dict();setText('cabinetTitle',d.cabinet);setText('actionLabel',d.labels.actions);setText('actionCounter',state.actionsLeft+' / 2');
  document.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.textContent=d.tabs[btn.dataset.tab];btn.classList.toggle('active',state.tab===btn.dataset.tab);btn.setAttribute('aria-current',state.tab===btn.dataset.tab?'page':'false');
  });
  if(state.tab==='council')renderCouncil();else if(state.tab==='build')renderBuild();else if(state.tab==='research')renderResearch();else renderChronicle();
}
function renderIncident(){
  const d=dict(),root=$('incidentSlot');clear(root);
  if(!state.incident)return;
  const box=create('div','incident'),main=create('div');
  main.append(create('div','kicker',d.crisis),create('h3','',d.crises[state.incident][0]),create('p','',d.crises[state.incident][1]));
  const choices=create('div','incident-choices');
  for(let opt=0;opt<3;opt++){
    const button=create('button');button.type='button';button.disabled=opt===0&&state.treasury<175;
    button.append(create('b','',d.crisisChoices[opt]),create('small','',d.crisisDetails[opt]));
    button.addEventListener('click',()=>{if(changeState(resolveCrisis(state,opt)))notify(d.success);});
    choices.append(button);
  }
  box.append(main,choices);root.append(box);
}
function renderEnding(){
  const root=$('endingSlot');clear(root);if(state.status==='playing')return;
  const d=dict(),box=create('div','ending');box.append(create('h2','',state.status==='victory'?d.victory:d.defeat),create('p','',state.status==='victory'?d.victoryDesc:d.defeatDesc));root.append(box);
}
function renderTrend(){
  const d=dict(),hist=state.history,values=hist.map(h=>h.treasury),min=Math.min(...values),max=Math.max(...values);
  const span=Math.max(200,max-min),bottom=min-span*.15,top=max+span*.15;
  const points=hist.map((h,i)=>{
    const x=hist.length===1?300:i*600/(hist.length-1);
    const y=137-125*(h.treasury-bottom)/(top-bottom);
    return [Math.round(x*10)/10,Math.round(y*10)/10];
  });
  const line=points.map(p=>p.join(',')).join(' ');
  $('trendLine').setAttribute('points',line);
  $('trendArea').setAttribute('d','M'+points[0].join(' ')+' L'+points.slice(1).map(p=>p.join(' ')).join(' L')+' L'+points.at(-1)[0]+' 151 L'+points[0][0]+' 151 Z');
  $('trendPoint').setAttribute('cx',points.at(-1)[0]);$('trendPoint').setAttribute('cy',points.at(-1)[1]);
  setText('trendTitle',d.labels.treasury+' / '+d.labels.turn);setText('trendCaption',d.labels.turn+' '+hist[0].turn+' — '+hist.at(-1).turn);
  setText('trendLast',money(hist.at(-1).treasury));
  setText('exportGame',d.export);setText('importGame',d.import);
  setText('helpHeading',d.helpTitle);setText('helpBody',d.help);setText('offlineNotice',d.offline);
}
function renderTutorial(){
  const d=dict();setText('tutorialTitle',d.tutorialTitle);setText('tutorialStart',d.tutorialStart);
  const root=$('tutorialSteps');clear(root);
  d.tutorialSteps.forEach(([title,desc],i)=>{
    const step=create('div','tutorial-step');step.append(create('span','nr',String(i+1).padStart(2,'0')));
    const body=create('div');body.append(create('b','',title),create('p','',desc));step.append(body);root.append(step);
  });
  $('help').title=d.tutorialAgain;
}
function render(){renderHeader();renderStats();renderGoals();renderForecast();renderMap();renderChamber();renderResources();renderIncident();renderEnding();renderTrend();renderTutorial();}
// Bind events once; dynamic action panels bind their own callbacks on render.
$('next').addEventListener('click',()=>{
  if(state.incident){notify(dict().crisisBlocked,true);return;}
  if(changeState(advanceTurn(state)))notify(dict().historyLabels.turn+' '+state.turn);
});
$('save').addEventListener('click',()=>notify(saveSilently()?dict().saved:dict().loadingError,!readLocal(storeKey)));
$('reset').addEventListener('click',()=>{if(confirm(dict().resetAsk)){state=createGame();saveSilently();render();notify(dict().resetDone);}});
$('theme').addEventListener('click',()=>{theme=theme==='imperial'?'command':'imperial';writeLocal(themeKey,theme);render();});
$('lang').addEventListener('change',e=>{lang=langCodes.includes(e.target.value)?e.target.value:'ru';writeLocal(langKey,lang);render();});
document.querySelectorAll('[data-district]').forEach(spot=>{
  const choose=()=>{const res=selectDistrict(state,spot.dataset.district);if(res.ok){res.state.tab='build';changeState(res);}};
  spot.addEventListener('click',choose);
  spot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose();}});
});
document.querySelectorAll('[data-tab]').forEach(btn=>btn.addEventListener('click',()=>changeState(selectTab(state,btn.dataset.tab))));
$('exportGame').addEventListener('click',()=>{
  try{const blob=new Blob([serializeSave(state)],{type:'application/json'}),url=URL.createObjectURL(blob),a=create('a');
    a.href=url;a.download='osgard-time-omega-v3-turn-'+state.turn+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1800);
  }catch{notify(dict().importError,true);}
});
$('importGame').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',async e=>{
  const file=e.target.files?.[0];e.target.value='';if(!file)return;
  try{if(file.size>250000)throw new Error('too-large');const imported=parseSave(await file.text());
    state=imported;saveSilently();render();notify(dict().imported);
  }catch{notify(dict().importError,true);}
});
$('help').addEventListener('click',()=>$('tutorial').showModal());
$('tutorialStart').addEventListener('click',()=>{
  $('tutorial').close();changeState(setTutorialSeen(state));
});
render();
if(!state.tutorialSeen){try{$('tutorial').showModal();}catch{}}
if(loadError){console.warn('Save migration failed:',loadError);notify(dict().importError,true);}

})();
</script>
</body>
</html>
