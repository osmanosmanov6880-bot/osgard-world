# Per-client limits for the public JSON API; authentication and authorization remain enforced by osgard-game-api.
limit_req_zone $binary_remote_addr zone=osgard_player_api:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=osgard_core_api:10m rate=5r/s;

server {
  listen 80;
  server_name _;

  if ($host = www.osgard.world) {
    return 301 https://osgard.world$request_uri;
  }

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css text/javascript application/json application/javascript application/xml image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Keep the app shell and route fallback aligned with the hashed JavaScript bundle.
  location = / {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /index.html =404;
  }

  location = /index.html {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location /skillcred/ {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    try_files $uri $uri/ =404;
  }

  # Publish the standalone Empire orbit prototype as a static game page.
  location = /games/time-empire {
    return 301 /games/time-empire/;
  }

  location ^~ /games/time-empire/ {
    try_files $uri $uri/ =404;
  }

  # Route player/session/analytics endpoints to the API container instead of the SPA fallback.
  # Protected actions still require their bearer/operator token at the API boundary.
  location ^~ /api/v1/ {
    limit_req zone=osgard_player_api burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 256k;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $osgard_game_api_host __OSGARD_HOST_GATEWAY__;
    proxy_pass http://$osgard_game_api_host:4317;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
  }

  # Core accounts, learning, projects, teams and delivery stay on the same origin.
  # The API container has no published host port; only this gateway can reach it.
  location ^~ /api/core/ {
    limit_req zone=osgard_core_api burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 256k;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $osgard_core_api_host core-api;
    proxy_pass http://$osgard_core_api_host:4173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin gateway for the public SkillCred demo API.
  # The browser never supplies an issuer token; Authorization and Cookie are dropped.
  location ^~ /skillcred-api/ {
    resolver 127.0.0.11 valid=300s ipv6=off;
    set $skillcred_api_host skillcred-pilot-api.onrender.com;
    rewrite ^/skillcred-api/(.*)$ /$1 break;
    proxy_pass https://$skillcred_api_host$uri$is_args$args;
    proxy_ssl_server_name on;
    proxy_ssl_name skillcred-pilot-api.onrender.com;
    proxy_set_header Host skillcred-pilot-api.onrender.com;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 20s;
    limit_except GET POST OPTIONS { deny all; }
  }

  location = /skillcred/styles.css {
    alias /usr/share/nginx/html/skillcred/styles.css.gz;
    default_type text/css;
    gzip off;
    add_header Content-Encoding gzip always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /skillcred/app.js {
    alias /usr/share/nginx/html/skillcred/app.js.gz;
    default_type application/javascript;
    gzip off;
    add_header Content-Encoding gzip always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Serve the versioned shared brand assets from their verified precompressed files.
  location ~* ^/brand/(?:osa-transition\.js|osa5-portals\.css)$ {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    gzip on;
    gzip_min_length 64;
    gzip_types application/javascript text/css;
    gzip_proxied any;
    gzip_static on;
    gzip_vary on;
  }

  location ~* ^/skillcred/(?:styles\.css|app\.js|fonts/(?:InterVariable|InstrumentSerif-Italic|JetBrainsMono-Regular)\.woff2)$ {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/css application/javascript;
    gzip_static on;
  }

  location ~* \.webmanifest$ {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600";
  }

  location /api/remix/ {
    proxy_pass http://remix-api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Unknown APIs must not return the React document with a misleading HTTP 200.
  # The more specific /api/core/, /api/v1/ and /api/remix/ proxies still win.
  location ^~ /api/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 404 '{"error":"not_found","message":"API route not found"}';
  }

  # Unity WebGL build uses precompressed artifacts. Serve the matching .gz
  # files with the correct content encoding and WebAssembly MIME type.
  location ^~ /games/remix/player/Build/ {
    # Unity requests .wasm/.data/.js but the export contains only gzip files.
    # The prefix must also win over the global .js regex below.
    gzip_static always;
    add_header Vary Accept-Encoding always;
    types {
      application/wasm wasm;
      application/javascript js;
      application/octet-stream data;
    }
  }

  # Missing runtime data is a real 404, never a successful SPA HTML response.
  location ~* \.(?:wasm|pck|data|json|map|gz)$ {
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|woff2?)$ {
    gzip_static on;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}
