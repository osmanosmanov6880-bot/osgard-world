services:
  osgard-game-api:
    build: ../osgard-game-api
    container_name: osgard-game-api
    restart: unless-stopped
    expose:
      - "4317"
    environment:
      PORT: "4317"
      OSGARD_EMPIRE_DB: "/var/lib/osgard-game-api/empire.sqlite3"
    volumes:
      - osgard-game-data:/var/lib/osgard-game-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4317/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  osgard-world:
    build: .
    container_name: osgard-world
    restart: unless-stopped
    depends_on:
      core-api:
        condition: service_healthy
      swarm-api:
        condition: service_healthy
      osgard-game-api:
        condition: service_healthy
      remix-guard:
        condition: service_healthy
    ports:
      - "127.0.0.1:4189:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  core-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: osgard-core-api
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    cpus: "1.0"
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    expose:
      - "4173"
    command:
      - python
      - core_server.py
      - --root
      - /app/empty
      - --database
      - /var/lib/osgard-core/core.sqlite3
      - --host
      - 0.0.0.0
      - --port
      - "4173"
      - --public-origin
      - ${OSGARD_CORE_PUBLIC_ORIGIN:-https://osgard.world}
    volumes:
      - osgard-core-data:/var/lib/osgard-core
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4173/api/core/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  remix-api:
    build: ../remix/backend
    container_name: remix-api
    restart: unless-stopped
    expose:
      - "8080"
  remix-guard:
    build:
      context: .
      dockerfile: server/RemixGuard.Dockerfile
    container_name: osgard-remix-guard
    labels:
      org.osgard.service: remix-guard
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 96
    mem_limit: 128m
    cpus: "0.5"
    tmpfs:
      - /tmp:size=4m,noexec,nosuid
    depends_on:
      remix-api:
        condition: service_started
    expose:
      - "8081"
    volumes:
      - osgard-remix-guard-data:/var/lib/remix-guard
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=6)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s
  swarm-api:
    build: ../swarm-mvp
    container_name: swarm-api
    restart: unless-stopped
    expose:
      - "4175"
    environment:
      PORT: "4175"
      ALLOWED_ORIGINS: "https://osgard.world,https://www.osgard.world"
      BUILD_VERSION: "${SWARM_BUILD_VERSION:-local}"
      MONETIZATION_MODE: "disabled"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4175/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  osgard-core-data:
  osgard-game-data:
  osgard-remix-guard-data:
